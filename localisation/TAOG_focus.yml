 # <Empower the Volksraad>
 INS_the_jewel_in_the_crown: "Перлина в короні"
 INS_the_jewel_in_the_crown_desc: "Ост-Індія — найяскравіша перлина в голландській колоніальній короні, і ми маємо намір зберегти її такою. Через Фольксраад наш голос доноситься до Гааги."
 INSHOL_java: "$HOL_java$"
 INSHOL_java_desc: "$HOL_java_desc$"
 INSHOL_sumatra: "$HOL_sumatra$"
 INSHOL_sumatra_desc: "$HOL_sumatra_desc$"
 INSHOL_borneo_and_the_grote_oost: "$HOL_borneo_and_the_grote_oost$"
 INSHOL_borneo_and_the_grote_oost_desc: "$HOL_borneo_and_the_grote_oost_desc$"
 INSHOL_foundations_of_defense: "$HOL_the_foundations_of_defense$"
 INSHOL_foundations_of_defense_desc: "$HOL_the_foundations_of_defense_desc$"
 INSHOL_investments_in_civ_railways_tt: "Якщо [HOL.GetFlag]§Y[HOL.GetName]§! завершує фокус:\n         [INS.GetFlag]§Y[INS.GetName]§!: Додати §Y£autonomy_texticon -250.00§!\n   Якщо [INS.GetFlag]§Y[INS.GetName]§! завершує фокус:\n         Додати §Y£autonomy_texticon 250.00§!"
 INSHOL_investments_in_civ_railways: "Інвестиції в цивільні залізниці"
 INSHOL_investments_in_civ_railways_desc: "Завоювання підтримки населення Ост-Індії вимагає інвестицій у цивільну інфраструктуру. Наразі наші залізниці використовуються переважно для вантажних перевезень. Ми повинні закупити пасажирські потяги для курсування нашими існуючими залізницями на Яві та Суматрі."
 INSHOL_continue_exclusive_rights: "Виключні права для De Javasche Bank"
 INSHOL_continue_exclusive_rights_desc: "Гульден Ост-Індії втратив більшу частину своєї вартості під час великої депресії, а наше економічне зростання зайшло в глухий кут. Ми могли б спробувати стабілізувати гульден, надавши Банку Яви виключні права на друк грошей, які він мав до 1922 року."
 INSHOL_peg_indies_guilder_to_dutch_guilder: "Прив'язати гульден Ост-Індії до голландського гульдена"
 INSHOL_peg_indies_guilder_to_dutch_guilder_desc: "Гульден Ост-Індії втратив більшу частину своєї вартості під час великої депресії, а наше economic зростання зайшло в глухий кут. Найпростіше рішення — прив'язати ост-індський гульден до голландського гульдена, набагато стабільнішої валюти. Це також сильніше прив'яже нас до нашого сюзерена."
 INSHOL_peg_indies_guilder_to_us_dollar: "Прив'язати гульден Ост-Індії до долара США"
 INSHOL_peg_indies_guilder_to_us_dollar_desc: "Гульден Ост-Індії втратив більшу частину своєї вартості під час великої депресії, а наше економічне зростання зайшло в глухий кут. Хоча ми могли б прив'язати ост-індський гульден до голландського гульдена, долар США є набагато стабільнішою валютою. Прив'язка гульдена до долара також дозволяє нам мати більшу економічну незалежність, роблячи самоврядування більш досяжною метою."
 indonesia_currency_pegged_to_dollar_modifier: "Гульден Ост-Індії прив'язаний до долара США"
 INS_direct_rule_tt: "Відкриває окупаційний закон §Y$INS_direct_rule_occupation_law$§! в індонезійських князівствах.\nЕфекти:\n     §GЗбільшує§! кількість фабрик та ресурсів з регіону\n     §RЗменшує§! зростання підкорення\n     §RЗбільшує§! зростання опору"
 INS_local_autonomy_tt: "Відкриває окупаційний закон §Y$INS_local_autonomy_occupation_law$§! в індонезійських князівствах.\nЕфекти:\n     Дає §Yневеликі§! бонуси в усьому\n     §GЗбільшує§! зростання підкорення"
 INS_invest_in_batavian_education_req_tt: "Успішно виконано щонайменше §Y3§! місії Фольксрааду"
 INS_invest_in_batavian_education_req_2_tt: "Успішно виконано щонайменше §Y6§! місії Фольксрааду"
 INSHOL_eventual_autonomy_req_tt: "Успішно виконано щонайменше §Y4§! місії Фольксрааду"
 indonesia_volksraad_passed_12: "Індонезійський національний прапор був офіційно визнаний"
 INS_stronghold_java_tt: "Будь-який індонезійський регіон: не окупований [ROOT.GetFlag][ROOT.GetNameDefCap]"
 INSHOL_request_east_timor: "Вимога повернення Східного Тимору"
 INSHOL_request_east_timor_desc: "Тимор не має права бути окупованим Португалією, це пережиток колоніальної історії, який ми не повинні більше терпіти, бо це законна індонезійська територія. Ми висунемо формальну вимогу Португалії негайно повернути нам Тимор."

 INS_resist_occupation: "Опір окупації"
 INS_resist_occupation_desc: "Гнів багатьох індонезійців проти Нідерландів не може дозволити нам скотитися до фашизму. Ми повинні зробити все можливо за для опору японському вторгненню та захисту батьківщини."
 INS_local_resistance: "Місцевий опір"
 INS_local_resistance_desc: "Ми створимо осередки опору на території, яка ще не була окупована, гарантуючи, що якщо вона буде окупована, ми будемо готові повернути її, коли прийде час."
 INS_stronghold_java: "Фортеця Ява"
 INS_stronghold_java_desc: "Ост-Індія — це величезний архіпелаг, на якому проживає багато народів і який має надзвичайно суворий рельєф. Спроба захистити кожен острів, джунглі та гору від армії, набагато більшої за нашу, гарантовано зазнає невдачі. Хоча залишити наших побратимів нелегко, евакуація всіх островів, крім Яви, що дозволить нам розмістити там усю нашу армію, може бути найкращим кроком для нації в цілому."
 INS_silence_nationalists: "Примусити замовкнути симпатиків націоналістів"
 INS_silence_nationalists_desc: "Японське вторгнення змусило революційні націоналістичні рухи почати підтримувати японських загарбників через їхнього спільного ворога в особі Нідерландів. Нестабільність, викликана вторгненням, призвела до того, що ці рухи почали зростати такими темпами, яких ніколи раніше не бачили. Якщо ми не зробимо щось із цим зараз, це може повністю вийти з-під нашого контролю."
 INS_east_indies_exile_government: "Уряд Ост-Індії у вигнанні"
 INS_east_indies_exile_government_desc: "На жаль, попри всі наші зусилля, Ост-Індія впала. Однак ми не повинні втрачати надію. Ми повинні продовжувати робити все можливе з тими обмеженими ресурсами, які у нас є. Ми програли битву, але ми ще не програли війну."
 INS_establish_nefis: "Створення NEFIS"
 INS_establish_nefis_desc: "Ми створимо Службу розвідки сил Нідерландської Ост-Індії (NEFIS) спільно з Союзниками та розмістимо її в Австралії. Через неї ми будемо проводити таємні операції з метою саботажу японських окупаційних військ. Через кожну маленьку перемогу ми наближаємося до нашого повернення на батьківщину."
 INS_evacuate_soldiers_to_australia: "Евакуація солдатів до Австралії"
 INS_evacuate_soldiers_to_australia_desc: "Ми створимо військову базу поблизу бази NEFIS на півночі Австралії. Там ми розмістимо солдатів KNIL, які уникли полону під час окупації, що дозволить нам продовжувати боротьбу."
 INS_australian_weapons: "Австралійська зброя"
 INS_australian_weapons_desc: "Таємні операції нелегко проводити, і нам знадобиться належне спорядження, щоб досягти успіху. Ми можемо ліцензувати австралійські заводи та перепрофілювати їх для виробництва зброї для NEFIS."

 INS_defenders_of_homeland: "Захисники Батьківщини"
 INS_defenders_of_homeland_tt: "Цей фокус буде автоматично завершено, якщо буде створено «Захисників Батьківщини»."
 INS_resist_occupation_tt: "Цей фокус буде автоматично завершено, якщо на нас нападуть і ми не здамося."
 INS_defenders_of_homeland_desc: "Уряд Ост-Індії впав, і його місце зайняв новий режим. Очолювані націоналістами та японським урядом, ми створимо нову армію, що перевершуватиме KNIL, і виграємо війну. Однак не можна заперечувати, що цей союз між націоналістами та імперіалістами є крихким. Чи триватиме цей союз, чи все закінчиться кровопролиттям?"
 INS_embrace_co_prosp_sphere: "Прийняти Сферу Спільного Процвітання"
 INS_embrace_co_prosp_sphere_desc: "Ми нарешті поклали край голландському правлінню, і хоча ми просто замінили одного сюзерена іншим, обіцянки економічного процвітання та паназіатства є дуже привабливими. Ми продовжуватимемо допомагати японським військовим зусиллям, щоб гарантувати, що Нідерланди ніколи не спробують повернутися в Індонезію."
 INS_seize_oppurtunity: "Скористатися можливістю"
 INS_seize_oppurtunity_desc: "[JAP.GetNameDefCap] програє, і їхній окупаційний уряд слабкий. Вперше за багато століть ми маємо реальний шанс розірвати кайдани навколо Індонезії назавжди, створивши незалежну державу. Якщо ми не скористаємося цією можливістю оголосити незалежність зараз, невідомо, скільки часу знадобиться до наступної."
 INS_japanese_resource_infrastructure: "Фінансування спільних військових зусиль"
 INS_japanese_resource_infrastructure_desc: "Передача контролю над нашою основною інфраструктурою видобутку ресурсів [JAP.GetNameDef] є необхідним кроком до перемоги у війні, оскільки найвищим пріоритетом є те, щоб підрозділи [JAP.GetAdjective] залишалися повністю забезпеченими в будь-який час. [JAP.GetNameDefCap] також розвиватиме нашу місцеву інфраструктуру з метою підвищення ефективності експорту ресурсів."
 INS_japanese_army_training: "Реформа армії"
 INS_japanese_army_training_desc: "Ми маємо багато чому навчитися у наших сюзеренів [JAP.GetAdjective], і тепер, коли KNIL розпущено, ми повинні створити нову армію, навчену IJA, готову захищати Індонезію від зовнішніх загроз."

 INS_governor_general_de_jonge: "Генерал-губернатор де Йонге"
 INS_governor_general_de_jonge_desc: "Боніфацій Корнеліс де Йонге відомий тим, що правив залізною рукою, виступав проти будь-яких форм націоналізму і часто ігнорував побажання Фольксрааду. Його правління над Ост-Індією тривало довго, а його досвід сягає ще часів великої війни, де він служив міністром оборони Ост-Індії."
 INS_governor_general_tjarda: "Генерал-губернатор Тьярда"
 INS_tjarda_explain_tt: "Термін повноважень §YБоніфація Корнеліса де Йонге§! закінчився, і §YАлідіус Тьярда ван Старкенборг Стахауер§! був обраний заміною на посаду губернатора у вересні 1936 року."
 INS_governor_general_tjarda_desc: "Алідіус Тьярда ван Старкенборг Стахауер має дещо інше бачення Ост-Індії, ніж його попередник. Хоча він все ще налаштований проти націоналізму, він має трохи більш ліберальну політику і більш схильний прислухатися до побажань Фольксрааду."
 INS_electrical_investments: "Інвестиції в електроенергетику"
 INS_electrical_investments_desc: "Кожна європейська індустріальна нація має потужну електричну мережу для підтримки своєї промисловості. Якщо мы хочемо припинити покладатися на експорт матеріалів і створити власну обробну промисловість, як вони, ми повинні побудувати високопотужну електричну мережу, яка простягнеться по всій території Яви."
 INS_reduce_land_taxes: "Зниження податків на землю"
 INS_reduce_land_taxes_desc: "Високі податки, накладені на володіння землею, ускладнили корінним індонезійцям володіння плантаціями та бізнесом. Хоча це полегшило нам утримання монополії на каучукову промисловість, це викликало економічні проблеми по всій країні. Нам слід розглянути можливість зниження цих податків до їхніх попередніх ставок, що уможливить роботу менших приватних каучукових плантацій."
 INS_invest_in_batavian_education: "Інвестиції в освіту Батавії"
 INS_invest_in_batavian_education_desc: "Фольксраад чітко дав зрозуміти, що волею індонезійського народу є те, щоб освіта стала доступнішою, оскільки наразі її можуть дозволити собі переважно голландські індонезійці та невелика група індонезійської еліти. Щоб виконати рішення Фольксрааду, ми повинні побудувати кілька початкових і середніх шкіл у Батавії та навколо неї."
 INS_javanese_education_investments: "Інвестиції в освіту Яви"
 INS_javanese_education_investments_desc: "На додаток до нашого поточного проєкту з будівництва початкових і середніх шкіл, ми могли б побудувати громадський коледж та спеціалізовані професійно-технічні школи, що зробило б подальшу освіту набагато доступнішою для сімей середнього класу."

 INS_allow_local_autonomy: "Дозволити місцеву автономію"
 INS_allow_local_autonomy_desc: "Система Форстенланден, яка надавала князівствам самоврядування, значно полегшила керування націоналістичними рухами та підвищила стабільність нації в цілому. Ми повинні ще більше підвищити рівень автономії, наданої князівствам, дозволяючи уряду зосередитися на більш важливих справах."
 INS_direct_rule: "Пряме правління"
 INS_direct_rule_desc: "Система Форстенланден, яка надавала князівствам самоврядування, додала труднощів у адмініструванні, вимагаючи додаткової бюрократії та марнуючи час. Настав час взагалі скасувати цю систему та запровадити пряме правління на всьому архіпелазі."

 INS_seize_oppurtunity_tt: "§Y[JAP.GetFlag][JAP.GetName]§! відкинута назад і контролює менше ніж §Y[?var:temp_states_plus_more]§! регіонів.\nнаразі: §Y[?var:JAP.num_controlled_states]§!"
 INS_seize_oppurtunity_refuse_warn_tt: "§RПочнеться національна революція, яка може призвести до війни з [HOL.GetNameDef]§!."

 INS_economic_stabilization: "Економічна стабілізація"
 INS_economic_stabilization_desc: "Велика депресія та світовий протекціонізм залишили нас економічно покаліченими, і багато індонезійців, які колись працювали в сировинній промисловості, опинилися без роботи. Ми повинні вжити рішучих заходів і створити трудову програму, за якою громадянам без роботи буде призначатися робоче місце."
 INS_restore_order_in_indies: "Відновити порядок в Ост-Індії"
 INS_restore_order_in_indies_desc: "Зростаючий націоналістичний рух в Ост-Індії дестабілізував кілька регіонів і може вийти з-під контролю, якщо ми його не зупинимо. Ми повинні зробити відновлення порядку та стабільності нашим головним пріоритетом."
 INS_detangle_supply_chains: "Розплутати ланцюжки постачання"
 INS_detangle_supply_chains_desc: "Наша експортна економіка вимагає, щоб товари проходили через десятки посередників, перш ніж вони нарешті досягнуть кінцевого пункту призначення, і кожен раз вимагається збір, податок або будь-яка інша причина, щоб відібрати трохи собі. Ми повинні попрацювати над тим, щоб розплутати цей безлад і контролювати більшу частину ланцюжка постачання безпосередньо."
 INS_prioritize_industrial_growth: "Пріоритет промислового зростання"
 INS_prioritize_industrial_growth_desc: "Наша експортна економіка занадто нестабільна і тримає нас у залежності від голландської співпраці. Ми повинні працювати над створенням обробної промисловості, будуючи заводи по всій Батавії. Ми могли б стати найбільш індустріалізованою країною в Тихому океані."
 INS_closer_economic_ties_to_netherlands: "Тісніші економічні зв'язки з Нідерландами"
 INS_closer_economic_ties_to_netherlands_desc: "Ми маємо багато чому навчитися у нашого сюзерена, особливо в економічному плані. Якщо ми надалі інтегруємо нашу експортну економіку з Нідерландами, ми зможемо використовувати їхню інфраструктуру та зв'язки для забезпечення більш вигідних торговельних угод."

 INS_prioritize_dutch_companies: "Пріоритет голландських компаній"
 INS_prioritize_dutch_companies_desc: "Голландські компанії, такі як Shell і Fokker, протягом століть були основою нашої економіки, а наш експорт сировини був тісно інтегрований із Shell. Це принесло значні багатства Ост-Індії, і ми повинні надати їм пріоритет над дрібнішими місцевими підприємствами, щоб гарантувати, що наша співпраця залишатиметься міцною."

 INSHOL_java_factories: "Відкрити збройові заводи на Яві"
 INSHOL_java_factories_desc: "Хоча це й банально, не можна заперечувати, що просте будівництво більшої кількості збройових заводів значно покращує силу армії. Як промисловий центр колонії, Ява є очевидним місцем для їх будівництва."
 INSHOL_license_dutch_weapon_blueprints: "Ліцензувати креслення голландської зброї"
 INSHOL_license_dutch_weapon_blueprints_desc: "Замість того, щоб інвестувати в будівництво цілого вітчизняного виробничого процесу та створення власних технологічних розробок, ми повинні співпрацювати з голландськими компаніями, щоб купувати їхні креслення зброї."
 INSHOL_bangka_production_lines: "Виробничі лінії Банки"
 INSHOL_bangka_production_lines_desc: "Стрімкий розвиток інфраструктури Банки в результаті проєкту Банка перетворив цей колись крихітний, здебільшого неважливий острів на ідеальний майданчик для нових промислових проєктів. Ми маємо можливість зміцнити KNIL, побудувавши новий збройовий завод у Банці, який завдяки концентрованим дорогам, залізницям та портам острова працюватиме ефективніше, ніж якби ми побудували його в іншому місці."
 INSHOL_artillerie_inrichtingen: "Artillerie Inrichtingen"
 INSHOL_artillerie_inrichtingen_desc: "Artillerie Inrichtingen виробляє артилерію та іншу зброю в Нідерландах уже понад 250 років і працює в Ост-Індії вже кілька десятиліть. Розширення їхніх виробничих потужностей шляхом відкриття нових виробничих об'єктів в Ост-Індії значно покращило б можливості KNIL, одночасно зміцнюючи економіку недофінансованих регіонів шляхом створення нових робочих місць."
 INSHOL_ai_pyrotechnische: "Artillerie Inrichtingen Pyrotechnische"
 INSHOL_ai_pyrotechnische_desc: "Продовжуючи розширення виробничих потужностей Artillerie Inrichtingen в Ост-Індії, ми повинні профінансувати створення ост-індського філіалу піротехнічної дочірньої компанії Artillerie Inrichtingen."
 INSHOL_bio_pharma: "Біофармація"
 INSHOL_bio_pharma_desc: "Розширення фармацевтичної промисловості Ост-Індії є очевидним наступним кроком у реформуванні KNIL, щоб гарантувати, що поранені солдати отримають належне лікування та безпечно одужають. Поширеність хініну в Ост-Індії робить вартість цього проєкту суттєво нижчою, ніж зазвичай."
 INSHOL_develop_fighters: "Розробка нових винищувачів"
 INSHOL_develop_fighters_desc: "Ми відправимо батавських інженерів до Амстердама для вивчення виробництва винищувачів Fokker з перших рук, щоб отримати доступ до його суворо охоронюваних секретів виробництва. Вони повернуться зі знаннями та технічним досвідом, необхідними для створення сучасної вітчизняної індустрії винищувачів в Ост-Індії."
 INSHOL_develop_bombers: "Розробка нових бомбардувальників"
 INSHOL_develop_bombers_desc: "Ми відправимо батавських інженерів до Амстердама для вивчення виробництва бомбардувальників Fokker з перших рук, щоб отримати доступ до його суворо охоронюваних секретів виробництва. Вони повернуться зі знаннями та технічним досвідом, необхідними для створення сучасної вітчизняної індустрії бомбардувальників в Ост-Індії."
 INSHOL_bandung_aircraft_facility: "Авіабудівний завод у Бандунзі"
 INSHOL_bandung_aircraft_facility_desc: "Хоча креслення та секрети виробництва корисні, вони нічого не варті, поки ми не побудуємо за ними літаки. Ми відкриємо нові авіаційні заводи в Бандунзі, щоб задовольнити поточні потреби ML-KNIL."
 INSHOL_netherlands_indies_air_doctrine: "Повітряна доктрина Нідерландської Ост-Індії"
 INSHOL_netherlands_indies_air_doctrine_desc: "Ми вивчимо військово-повітряні сили країн, які стикаються з викликами, подібними до наших, спираючись на їхній важко здобутий досвід, щоб сформувати доктрину, що відповідає реаліям Ост-Індії, не повторюючи цих історичних помилок."
 INSHOL_manado_military_academy: "Військова академія Макасара"
 INSHOL_manado_military_academy_desc: "Створення військової академії за межами Яви допоможе значно пом'якшити наш дефіцит людських ресурсів, зробивши призов реальним на східних островах. Макасар, розташований приблизно в центрі Ост-Індії, є ідеальним місцем для цього."
 INSHOL_infantry_training_in_borneo: "Навчання піхоти на Борнео"
 INSHOL_infantry_training_in_borneo_desc: "Ост-Індія характеризується густими джунглями, пересіченими горами та суворим рельєфом. Наші солдати, що базуються переважно на Яві, прикро не підготовлені до бою в таких умовах. Ми повинні розширити військову підготовку за межі Яви та проводити навчання в більш суворих умовах. Мало місць на землі можуть зрівнятися з джунглями та горами Борнео, що робить його ідеальним місцем для навчання рейнджерів світового класу."
 INSHOL_knil_engineers: "Інженерний корпус"
 INSHOL_knil_engineers_desc: "Ми не повинні зосереджувати всі наші зусилля на виробництві піхоти та гвинтівок, і пам'ятати, що логістика та зв'язок відіграють важливу роль у виграші битв. Ми повинні навчати інженерів та фінансувати професійно-технічні школи Батавії, щоб наша армія не була обмежена поганою логістикою."
 INSHOL_work_with_oil_barons: "Співпраця з нафтовими баронами"
 INSHOL_work_with_oil_barons_desc: "Велика депресія залишила нашу експортну економіку в гнітючому стані. Можливо, настав час розглянути можливість перекласти частину торговельних переговорів на нафтових баронів Суматри, щоб гарантувати, що нафта буде продана. Однак це матиме свою ціну, оскільки для того, щоб вони погодилися на цю угоду, нам потрібно буде продавати нафту за цінами, значно нижчими за ринкові."
 INSHOL_rubber_taxation: "Оподаткування каучуку"
 INSHOL_rubber_taxation_desc: "Голландські інвестиції та досвід перетворили каучукові плантації Ост-Індії на один із найцінніших активів Імперії. Цілком справедливо, що Корона вимагає свою законну частку від багатства, яке вона створила. Хоча деякі місцеві політики протестують, інтереси Імперії не можуть диктуватися провінційним хвилюванням."
 INSHOL_padang_port: "Міжнародний порт у Паданзі"
 INSHOL_padang_port_desc: "Ресурси, вироблені в Паданзі, повинні спочатку направлятися через Яву, перш ніж потрапити на міжнародні ринки, оскільки в регіоні бракує об'єктів, здатних приймати великі конвої. Цей непотрібний гак перевантажує наш ланцюжок постачання та обмежує економічний потенціал Суматри. Побудувавши великий вантажний порт у Паданзі, ми зможемо усунути цей гак, підвищивши прибутковість плантацій Паданга."
 INSHOL_subsidize_bauxite: "Субсидування бокситових проєктів"
 INSHOL_subsidize_bauxite_desc: "Поточний проєкт в Ост-Індії з модернізації багатих на боксити островів Банка-Белітунг є дуже перспективним, а потенціал для довгострокового прибутку високий. Ми повинні підтримати уряд Ост-Індії економічними субсидіями, щоб прискорити виконання проєкту."
 INSHOL_agricultural_subsidies: "Приватизація сільськогосподарського сектору"
 INSHOL_agricultural_subsidies_desc: "Дозволяючи створення приватних ферм різних розмірів, ми можемо прискорити розвиток інфраструктури в недофінансованих сільських регіонах, одночасно збільшуючи доходи уряду. Для досягнення цього ми створимо структуровану податкову систему, за якої весь податковий дохід, отриманий цими фермами, перераховуватиметься безпосередньо до Нідерландів, а не проходитиме спочатку через Ост-Індію."
 INSHOL_import_sugar: "Імпорт цукру"
 INSHOL_import_sugar_desc: "Ми запровадимо контроль цін у зростаючому сільськогосподарському секторі Ост-Індії, щоб імпортувати весь цукор країни з плантацій Ост-Індії за цінами, з якими жоден інший уряд не зможе зрівнятися, і встановимо державну монополію на цукор."
 INSHOL_import_lumber: "Імпорт деревини"
 INSHOL_import_lumber_desc: "Ми запровадимо контроль цін у зростаючому сільськогосподарському секторі Ост-Індії, щоб імпортувати всю деревину країни з плантацій Ост-Індії за цінами, з якими жоден інший уряд не зможе зрівнятися, і встановимо державну монополію на деревину."
 INSHOL_industrialized_colony: "Індустріалізована колонія"
 INSHOL_industrialized_colony_desc: "Ост-Індія, колись скромна колонія, стала одним із найіндустріалізованіших, найбагатших регіонів у всій Азії. Це знаменує собою монументальний момент в історії Нідерландів та людства. Наші зусилля окупилися, і ми продовжуватимемо інвестувати в розвиток нашої колонії та знову відновимо Нідерланди як світову державу."
 INS_no_peta_tt: "Індонезія не зможе співпрацювати з іноземними загарбниками."
 INSHOL_economic_integration: "Економічна інтеграція"
 INSHOL_economic_integration_desc: "Нідерландська Ост-Індія — це сяюча перлина нашої Імперії, її процвітання забезпечується впевненим керівництвом Королеви, Прем'єр-міністра та Генерал-губернатора. Ця стабільність не повинна піддаватися загрозі через безрозсудні заклики до незалежності, які принесуть лише безлад та занепад. Ми зв'яжемо економіки Нідерландів та Ост-Індії ще міцніше, забезпечуючи тривалу стабільність та велич."

 INSHOL_republic_of_indonesia: "Республіка Індонезія"
 INSHOL_republic_of_indonesia_desc: "Коли Нідерланди неохоче погодилися на петицію Сутарджо, отримане законодавство пов'язало незалежність Індонезії з довгим списком умов, щоб кваліфікувати її як економічно самодостатню. Незважаючи на це, ці умови тепер виконані в повному обсязі завдяки рішучості індонезійського народу, і Нідерланди не мають іншого вибору, окрім як прийняти нашу офіційну декларацію незалежності."
 INSHOL_propose_malay_unification: "Запропонувати об'єднання Малайї"
 INSHOL_propose_malay_unification_desc: "Індонезія — це архіпелаг, на якому проживають сотні культур, мов та етносів. Хоча деякі з них схожі, інші чітко відрізняються. Проте через спільну боротьбу проти колоніального правління ми знайшли єдність під прапором однієї нації; Індонезії. Можливо, нам варто запитати себе, чому ця єдність повинна зупинятися тут, коли по той бік протоки народ Малайї поділяє багато в чому ту саму історію та прагнення, що й наш власний?"
 INSHOL_singapore_compromise: "Сінгапурський компроміс"
 INSHOL_singapore_compromise_desc: "Сінгапур — це індонезійська земля за історією та культурою, і цілком природно, що він має бути включений до складу єдиної Індонезії. Проте Британія не бажає відмовлятися від Сінгапуру через його стратегічне значення та необхідність як військової бази. Ми повинні запропонувати компроміс, за якого Сінгапур приєднається до союзу за умови, що Британія збереже право розміщувати війська на острові."
 INSHOL_request_ceylon: "Запит на передачу Цейлону"
 INSHOL_request_ceylon_desc: "Британська колонія Цейлон має глибокі культурні та мовні зв'язки з ширшим малайським світом. Оскільки паномалайська федерація Мафіліндо зростає, цілком природно, що і цей острів повинен знайти своє місце в межах конфедерації."
 INSHOL_papua_referendum: "Референдум у Папуа"
 INSHOL_papua_referendum_desc: "Сьогодні острів Папуа розділений між Індонезією та Австралією. Хоча наші інвестиції та розвиток перетворили нашу половину на зростаючий і процвітаючий регіон, підконтрольна Австралії територія залишається занедбаною та слаборозвиненою. Майбутнє острова має перебувати в руках його народу, і тому ми повинні вимагати офіційного референдуму щодо об'єднання Папуа."
 INSHOL_invite_phillipines: "Пропозиція Мафіліндо"
 INSHOL_invite_phillipines_desc: "Численні народи нашого союзу розмовляють різними мовами та дотримуються різних традицій, проте майже всі вони простежують своє коріння до малайського світу. Ми повинні реформувати нашу союзну державу в паномалайську конфедерацію, запросивши Філіппіни як країну-члена. Те, що колись було кількома незначними колоніями, тепер стоятиме міцно як регіональна держава Південно-Східної Азії."

