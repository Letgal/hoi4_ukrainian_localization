 # Alternative Communist Focus
 SIA_the_peoples_war_in_asia: "Народна війна в Азії"
 SIA_the_peoples_war_in_asia_desc: "Боротьба проти [JAP.GetAdjective] імперіалізму — це не просто змагання між державами. Це війна робітників, селян і солдатів проти домінування з-за кордону. Підтримуючи комуністичні сили в Китаї, [ROOT.GetNameDef] бере на себе зобов'язання до ширшої народної війни по всій Азії."


 SIA_peoples_war_in_asia_idea: "Народна війна в Азії"
 SIA_peoples_war_in_asia_idea_desc: "Війну підтримують не лише регулярні формування. Місцеві комітети, партизанські провідники та селянські колони постачання тепер служать армії в польових умовах. Кожне село стає складом, кожна дорога — можливою засідкою, а кожен відступ — шансом затягнути ворога глибше вглиб країни."

 # Alternative Nationalist Focus
 SIA_national_defense_in_asia: "Національна оборона в Азії"
 SIA_national_defense_in_asia_desc: "Оборона Азії вимагає дисципліни, ієрархії та спільної стратегічної мети. Виступаючи на боці націоналістичного уряду Китаю, [ROOT.GetNameDef] приєднується до коаліції, сповненої рішучості протистояти [JAP.GetAdjective] експансії за допомогою організованих армій та скоординованого командування."
 SIA_national_defense_in_asia_tt: "§Y[ROOT.GetNameWithFlag]§! об'єднується з націоналістичними силами в Об'єднаному фронті.\nДодає §Y$SIA_national_defense_in_asia_idea$§!, що надає:\n $MODIFIER_ARMY_ORG_FACTOR$: §G+5%§!\n $MODIFIER_PLANNING_SPEED$: §G+10%§!\n $MODIFIER_MAX_PLANNING$: §G+10%§!\n $MODIFIERS_ARMY_DEFENCE_FACTOR$: §G+5%§!"
 SIA_stronger_together: "Сильніші разом"
 SIA_stronger_together_desc: "Війна перетворила далекі обіцянки та паралельні альянси на не більше ніж перешкоди. Якщо [ROOT.GetNameDef] хоче визначати курс Азії, ми повинні попросити наших партнерів прив'язати їхню фракцію до нашої і прийняти єдине командування в майбутній боротьбі."
 idea_SIA_national_defense_in_asia: "Національна оборона в Азії"


 SIA_directorate_of_aeronautical_engineering_desc: "Майбутнє повітряних сил [ROOT.GetNameDef] не забезпечуватиметься лише пілотами. Воно потребує інженерів, інспекторів, майстерень та центрального органу, здатного перетворювати іноземні закупівлі на справні літаки. Управління авіаційної інженерії стане фундаментом цих зусиль."

 idea_SIA_aeronautical_engineering_directorate: "Управління авіаційної інженерії"

 SIA_standardize_aircraft_maintenance: "Стандартизація технічного обслуговування літаків"
 SIA_standardize_aircraft_maintenance_desc: "Наші літаки надходять з багатьох джерел, кожне з яких має власні запчастини, інструменти та звички ремонту. Стандартизувавши процедури технічного обслуговування під егідою Управління, [ROOT.GetNameDef] зможе утримувати більше літаків у повітрі та зменшити втрати, спричинені плутаниною на землі."

 SIA_expand_aircraft_workshops: "Розширення авіаційних майстерень"
 SIA_expand_aircraft_workshops_desc: "Управління потребує більшого, ніж офіси та інспекторські папери. Нові майстерні, верстати та навчені механіки дозволять ремонтувати пошкоджені літаки всередині країни, тоді як прості компоненти можна буде виробляти, не чекаючи іноземних поставок."

 SIA_license_modern_airframes: "Ліцензування сучасних планерів"
 SIA_license_modern_airframes_desc: "[ROOT.GetNameDefCap] ще не може сама спроектувати кожен потрібний їй літак. Більш практичним курсом є ліцензування іноземних моделей, вивчення їхньої конструкції та адаптація їх до нашого клімату, аеродромів та умов постачання під наглядом Управління."

 SIA_tropical_air_operations: "Повітряні операції в тропіках"
 SIA_tropical_air_operations_desc: "Спека, вологість, мусонні дощі та нерівні передові аеродроми висувають власні вимоги до літаків та екіпажів. Адаптуючи двигуни, графіки технічного обслуговування та доктрину пілотів до цих умов, Управління може зробити наші військово-повітряні сили надійнішими в небі над Південно-Східною Азією."

 SIA_thai_french_liaison: "Thai-French Liaison" # (!)
 SIA_thai_french_liaison_no_indochina_tt: "We occupy no part of French Indochina (Laos, Cambodia or Vietnam)"
 SIA_thai_french_liaison_desc: "The bonds forged when our first aviators trained in France still hold. While Paris and Bangkok remain at peace, a standing liaison keeps French technical expertise, manuals and goodwill flowing to our air arm."
 SIA_expand_don_mueang: "Expand Don Mueang Air Base"
 SIA_expand_don_mueang_desc: "Don Mueang is the beating heart of our air arm. New runways, hangars and depots will make it a base worthy of a modern air force, and the anvil upon which our squadrons are forged."
 SIA_hawk_iii_production_line: "Hawk III Production Line"
 SIA_hawk_iii_production_line_desc: "The Hawk III is already familiar to our pilots and our workshops. Standardizing around a proven, license-built fighter buys time while we decide what modernization will really mean."
 SIA_mixed_inventory_standardization: "Mixed Inventory Standardization"
 SIA_mixed_inventory_standardization_desc: "American, Japanese and older French-derived practices do not make a coherent air force by themselves. Spare parts, markings, radios and maintenance discipline must be standardized before the next war arrives."
 SIA_womens_auxiliary_air_force: "Women's Auxiliary Air Force"
 SIA_womens_auxiliary_air_force_desc: "Every mechanic, clerk and radio operator freed from the ground crews is another pilot in the air. Thai women have already proven themselves in the hospitals and the ministries; the airfields of Don Mueang will be no different."
 SIA_air_defense_of_the_kra: "Air Defense of the Kra Isthmus"
 SIA_air_defense_of_the_kra_desc: "Southern Thailand is the hinge between Malaya and Burma. Any power moving through the peninsula must face Thai airfields, warning posts and interceptors. We will hold the skies over our own soil rather than reach for those of others."
 SIA_the_interceptor_force: "The Interceptor Force"
 SIA_the_interceptor_force_desc: "Standing patrols and a ground observer net turn our fighters into a true interceptor force. Radar and quick scrambles will meet raiders before they reach our cities."
 SIA_hardened_air_defenses: "Hardened Air Defenses"
 SIA_hardened_air_defenses_desc: "Dispersed strips, revetments and dense flak batteries let our air arm absorb a blow and keep flying. What survives the first raid will still be there for the second."
 SIA_forward_strike_wings: "Forward Strike Wings"
 SIA_forward_strike_wings_desc: "Rather than wait to be attacked, we will train wings to seize the air over the front and carry the fight to the enemy the moment war begins."
 SIA_increase_air_crews: "Increase Air Crews"
 SIA_increase_air_crews_desc: "We will expand the ground crews that tend our aircraft. It costs the manpower to fill their ranks, but well maintained and better protected machines will fly again where a neglected one would be lost."
 SIA_conserve_air_crews: "Conserve Air Crews"
 SIA_conserve_air_crews_desc: "Every mechanic on the airfield is a rifleman not at the front. We will run our air arm lean, freeing that manpower for the army, and accept that our aircraft will break down more often for it."
 SIA_tropical_operations: "Tropical Operations"
 SIA_tropical_operations_desc: "Heat, monsoon and jungle canopy punish careless airmen more than enemy guns do. We will design our air arm around the climate of our own region, striking hard at the enemy on the ground despite the weather."
 SIA_veteran_jungle_aviators: "Veteran Jungle Aviators"
 SIA_veteran_jungle_aviators_desc: "Flying in this climate breaks green pilots and worn engines alike. Better maintenance and hard-earned experience will turn survival into skill, and skill into aces."
 SIA_long_range_strike_wings: "Long-Range Strike Wings"
 SIA_long_range_strike_wings_desc: "Rather than build for the jungle in front of us, we will build for the distance beyond it. A fleet of long-legged bombers, procured and produced without the usual waste, will let us strike far past our own borders."
 SIA_lightweight_airframes: "Lightweight Airframes"
 SIA_lightweight_airframes_desc: "Strip out the ferry tanks and the weight meant for distance, and what remains turns tighter, climbs faster and carries a heavier punch over the target. Our wings will not reach far, but nothing within their reach will be safe."
 SIA_tactical_bombing_school: "Tactical Bombing School"
 SIA_tactical_bombing_school_desc: "A dedicated school for bomber crews will turn our tactical bombers from a blunt instrument into a precise one, striking harder and truer at whatever stands in their path."
 SIA_reinforced_platings: "Reinforced Platings"
 SIA_reinforced_platings_desc: "Armor plating and auxiliary fuel tanks let our escort fighters take a hit and still reach targets far from home. The added weight burns more fuel along the way, but a well-drilled escort wing is worth the cost."
 SIA_destroy_the_indochinese_ports: "Destroy the Indochinese Ports"
 SIA_destroy_the_indochinese_ports_desc: "The harbours of Indochina are the hinges on which any enemy campaign against us swings. We will make their destruction a standing objective of the air arm, whether by a bomber raid at the outbreak of war or by charges quietly placed long before the first shot."
 SIA_destroy_the_indochinese_ports_tt: "Unlocks the §YSabotage the Indochinese Ports§! intelligence operation."
 SIA_destroy_the_indochinese_ports_raid_tt: "Unlocks the §YRaid Indochinese Port§! air raid."
 SIA_destroy_the_indochinese_ports_planes_bba_tt: "Gain §Y30§! §YB-17 Flying Fortress§! and §Y20§! §YP-38 Lightning§! in the national stockpile."
 SIA_destroy_the_indochinese_ports_planes_legacy_tt: "Gain §Y30§! §Y$strat_bomber_equipment_1$§! and §Y20§! §Y$heavy_fighter_equipment_1$§! in the national stockpile."
 SIA_accept_a_japanese_technical_mission: "Accept a Japanese Technical Mission"
 SIA_accept_a_japanese_technical_mission_desc: "Tokyo offers instructors, technical manuals and aircraft we can acquire quickly. If we accept, we gain speed. We also gain dependency."
 SIA_fighter_type_12_conversion: "Type 12 Training"
 SIA_fighter_type_12_conversion_desc: "The Nakajima Ki-27, our Type 12, is a nimble mount that rewards an aggressive hand. A hard training cycle on the type will sharpen our pilots and hone every ace on the roster, though the intensity cannot be kept up forever."
 SIA_preserve_american_procurement_channels: "Preserve American Procurement Channels"
 SIA_preserve_american_procurement_channels_desc: "Thai air power was built through careful procurement from Curtiss and Vought. Keeping American channels alive preserves a route to better aircraft and less dependence on Japan."
 SIA_free_thai_air_liaison: "Free Thai Air Liaison"
 SIA_free_thai_air_liaison_desc: "Air power is not only aircraft in the sky. Radios, weather reports, hidden strips and rescued airmen can matter more than one extra squadron. The Free Thai shall build that quiet network."
 idea_SIA_kra_air_defense: "Air Defense of the Kra"
 idea_SIA_kra_air_defense_desc: "Hidden posts along the highland spine of the peninsula radio in the weather and the first sight of an intruder, and our squadrons fly knowing what waits for them."
 idea_SIA_fighter_type_12: "Type 12 Training"
 idea_SIA_fighter_type_12_desc: "An intensive training cycle on the nimble Type 12 has our pilots flying at their sharpest, with the aces leading the way. The pace cannot be sustained indefinitely."
 SIA_air_cooperation_japan: "Air Cooperation"
 SIA_air_cooperation_usa: "Air Cooperation"
 SIA_air_cooperation_france: "Air Cooperation"
 SIA_free_thai_rescued_airmen: "Sheltered our downed airmen"
 SIA_free_thai_air_network_unlock_tt: "Unlocks the §YFree Thai Air Network§! decisions."
 SIA_reverse_engineer_french_airplanes: "Reverse Engineer French Airplanes"
 SIA_reverse_engineer_french_airplanes_desc: "The airfields and workshops of Indochina fell into our hands with their French machines largely intact. Our engineers will strip them to the last rivet and learn every secret they hold."
 SIA_specialized_airframe_construction: "Specialized Airframe Construction"
 SIA_specialized_airframe_construction_desc: "Rather than chase every design at once, our factories will master a single fighter airframe and build it better than anyone in the region."
 SIA_license_equipment: "License Equipment"
 SIA_license_equipment_desc: "With Indochina secured, we negotiate from strength. Foreign designs will be built under license in our own plants, cheaply and at scale."
 SIA_controls_all_indochina_tt: "We control all of §YIndochina§!"
 SIA_hawk_iii_max_efficiency_tt: "Adds the line at max available efficiency"
 idea_SIA_increase_air_crews: "Increased Air Crews"
 idea_SIA_increase_air_crews_desc: "Expanded ground crews keep our aircraft flying. Higher air ground crew manpower requirement, but greater aircraft reliability and armor."
 idea_SIA_conserve_air_crews: "Conserved Air Crews"
 idea_SIA_conserve_air_crews_desc: "A lean air arm frees manpower for the front. Lower air ground crew manpower requirement and more recruitable population, at the cost of aircraft reliability."
 idea_SIA_specialized_airframe_construction_conserve: "Specialized Fighter Airframe"
 idea_SIA_specialized_airframe_construction_conserve_desc: "Our factories are tuned to one fighter airframe, tended by a lean ground establishment. It flies more nimbly and further and costs less to build, at the price of reliability, while the mechanics we did not hire serve at the front instead. Later airframes we are not set up for suffer for it."
 idea_SIA_specialized_airframe_construction_increase: "Specialized Fighter Airframe"
 idea_SIA_specialized_airframe_construction_increase_desc: "Our factories are tuned to one fighter airframe, and full ground crews keep it in the air. It flies more nimbly and further and costs less to build, and better maintenance offsets the fragility of a design pushed this hard. Later airframes we are not set up for suffer for it."
 idea_SIA_specialized_airframe_construction_legacy_conserve: "Specialized Fighter Airframe"
 idea_SIA_specialized_airframe_construction_legacy_conserve_desc: "Our factories are tuned to one fighter airframe, tended by a lean ground establishment. It flies more nimbly and further and costs less to build, at the price of reliability, while the mechanics we did not hire serve at the front instead. Later airframes we are not set up for suffer for it."
 idea_SIA_specialized_airframe_construction_legacy_increase: "Specialized Fighter Airframe"
 idea_SIA_specialized_airframe_construction_legacy_increase_desc: "Our factories are tuned to one fighter airframe, and full ground crews keep it in the air. It flies more nimbly and further and costs less to build, and better maintenance offsets the fragility of a design pushed this hard. Later airframes we are not set up for suffer for it."
 idea_SIA_license_equipment_conserve: "Licensed Production Network"
 idea_SIA_license_equipment_conserve_desc: "Control of Indochina's industry lets us build foreign designs under license far more cheaply and quickly, serviced by a lean ground establishment that leaves manpower to the army."
 idea_SIA_license_equipment_increase: "Licensed Production Network"
 idea_SIA_license_equipment_increase_desc: "Control of Indochina's industry lets us build foreign designs under license far more cheaply and quickly, and full ground crews keep the licensed machines flying."
 idea_SIA_bomber_procurement_program: "Bomber Procurement Program"
 idea_SIA_bomber_procurement_program_desc: "Streamlined contracts and licensed production have brought the cost of our tactical bomber fleet down substantially, though the favourable terms will only hold for as long as the current contracts run."
 SIA_mio_trait_japanese_air_mission_unlock_tt: "Unlocks the §YJapanese Technical Mission§! trait for the §YDirectorate of Aeronautical Engineering§!"
 SIA_mio_trait_american_procurement_unlock_tt: "Unlocks the §YAmerican Procurement Channels§! trait for the §YDirectorate of Aeronautical Engineering§!"

