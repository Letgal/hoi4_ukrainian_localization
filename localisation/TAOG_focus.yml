# == (*) ==
 INS_nationalize_companies_tt: "Усі військово-промислові організації та промислові концерни будуть націоналізовані та отримають нову назву."
 available_focus_tt: "§GДоступні§! фокуси:\n"

 INS_is_union_tt: "Створено Нідерландсько-Індонезійську унію"
 INS_is_union_tt_NOT: "Не створено Нідерландсько-Індонезійську унію"

 INS_denounce_soetardjo: "Засудити Сутарджо"
 INS_denounce_soetardjo_tt: "Ми розпочнемо підготовку до підпільної революції, проникаючи в уряд і створюючи партизанські осередки по всьому архіпелагу. Коли ми будемо достатньо підготовлені, ми почнемо партизанську війну за незалежність проти голландців."
 INS_soetardjo_petition_debate_done_tt: "Дебати у Фольксраді щодо петиції Сутарджо про автономію завершилися"
 INS_tkr_tt: "Модифікує §YАрмію народної безпеки§! на:"
 INS_commander_sudirman_tt: "§YСудірман§![INS.GetFlag] отримує підвищення до §YФельдмаршала§!"
 INS_the_declaration_of_independence: "Декларація незалежності"
 INS_the_declaration_of_independence_desc: "Ми більше не можемо ризикувати чекати, треба кувати залізо, поки гаряче! Ми повинні відправити наше ополчення, щоб захопити контроль над портами, містами та промисловими центрами досить швидко, щоб голландська влада не встигла відреагувати. Тоді ми проголосимо незалежність, проголосивши Республіку Індонезія."
 INS_the_declaration_of_independence_tt: "Ми проголосимо §YНезалежність§!. Кожен регіон, де ми створили §YБазу ополчення§! або §YШтаб§!, буде під нашим контролем, а решта залишиться у [HOL.GetNameDef]\n\n[HOL.GetNameDefCap] скоріше за все, не буде визнавати наш суверенітет, і розпочнеться конфлікт низької інтенсивності. Це може перерости у §Rвійну§!.\n\nВідкриває наземні рейди для захоплення регіонів."
 INSHOL_the_declaration_of_independence: "Національна революція"
 INS_laskar_rakjat: "Ласкар Рак'ят"
 INS_laskar_rakjat_desc: "Революція складається з багатьох різних ополчень по всій Індонезії, як великих, так і малих. Організація ополчень є необхідним кроком для досягнення перемоги. Проте ми не повинні діяти надто поспішно, оскільки надання повноважень ополченням, пов'язаним з нашими політичними конкурентами, може призвести до катастрофи."
 INS_militia_tt: "Створює новий шаблон дивізії §YБорців за свободу§! та відкриває рішення для управління ними."
 INS_militia_warning_tt: "Ополчення — це §Yнапівавтономні§! групи борців за свободу. Вони боротимуться за нас, але їхня допомога не безкоштовна. Вони очікуватимуть компенсації за свої зусилля. §RЯкщо вимоги не будуть виконані, стабільність різко впаде!§!"
 INS_usa_tanks_opinion_mod: "Купили наші танки"
 INS_republic_add_generals_tt: "§Y$INS_sudirman$§![INS.GetFlag], §Y$INS_soengkono$§![INS.GetFlag], §Y$INS_supriyadi$§![INS.GetFlag], §Y$INS_djatikoesoemo$§![INS.GetFlag], §Y$INS_maludin_simbolan$§![INS.GetFlag] стає генералом."
 INS_big_militia_presence_tt: "Буде контролюватися нашим ополченням після проголошення незалежності."

 INS_prepare_raiding_bases: "Підготовка рейдових баз"
 INS_prepare_raiding_bases_desc: "Ми використаємо нашу мережу шпигунів, щоб таємно створити бункери по всьому архіпелагу, гарантуючи нашу готовність завдати удару, щойно почнеться революція."

 # <Joint Tree - Central Milestones>
 INSHOL_dutch_east_indies: "Голландська Ост-Індія"
 INSHOL_dutch_east_indies_desc: "Колонія була заснована майже 500 років тому і з того часу багато разів змінювалася. Світ швидко змінюється, і наші поточні дії визначатимуть майбутнє голландсько-індонезійських відносин далеко в майбутньому."
 INSHOL_the_war_in_europe: "Війна в Європі"
 INSHOL_the_war_in_europe_desc: "Конфлікт в Європі швидко загострюється, і Нідерланди тепер у стані війни. Ми більше не можемо покладатися на їхній захист і повинні твердо стояти на своєму, інакше ризикуємо бути захопленими іноземними державами."

 # <Joint Tree - Military Equipment Contracts>
 INSHOL_military_equipment_contracts: "Контракти на військову техніку"
 INSHOL_military_equipment_contracts_desc: "Ост-Індія — це величезний архіпелаг із десятками мільйонів громадян. Нам ще далеко до промислового потенціалу, необхідного для самозахисту. Проте в нас достатньо ресурсів, щоб забезпечити торгівлю по всьому світу. Шляхом укладання контрактів з демократіями по всьому світу нашу проблему можна вирішити."
 INSHOL_hawk_75a7: "Hawk 75a-7"
 INSHOL_hawk_75a7_desc: "Американський винищувач Hawk 75A-7 — ідеальний літак для Ост-Індії, доступний і потужний. Ми можемо укласти угоду з виробником, щоб внести необхідні вдосконалення до наших ВПС."
 INSHOL_purchase_american_tanks: "Купівля американських танків"
 INSHOL_purchase_american_tanks_desc: "Хоча Ост-Індії не вистачає промисловості, необхідної для виробництва танків, ми можемо купувати їх безпосередньо у США, фінансуючи за рахунок гумової промисловості Ост-Індії."
 INSHOL_purchase_british_artillery: "Купівля британської артилерії"
 INSHOL_purchase_british_artillery_desc: "Ми можемо передати виробництво нашої артилерії Об'єднаному Королівству, що дозволить нам надати пріоритет іншому обладнанню."
 INSHOL_produce_own_goods: "Виробництво власних товарів"
 INSHOL_produce_own_goods_desc: "Хоча у нас є багато вигідних торгових угод, які ми можемо укласти, ми не повинні забувати про власні виробничі лінії та військово-промислові компанії. Ми повинні субсидувати ці компанії, щоб зменшити нашу залежність від іноземного імпорту."

 # <Joint Tree - East Indies Investments>
 INSHOL_east_indies_investments: "Інвестиції в Ост-Індію"
 INSHOL_east_indies_investments_desc: "Хороший сюзерен — це той, хто інвестує в розвиток своїх колоній. Інвестиції в економічний розвиток Ост-Індії відповідають нашим інтересам і корисні для громадян колонії."
 INSHOL_east_indies_student_exchange: "Програма студентського обміну з Ост-Індією"
 INSHOL_east_indies_student_exchange_desc: "Створення системи, за якою індонезійці зможуть переїжджати до Нідерландів для навчання в наших університетах, може стати значним поштовхом для економіки як Нідерландів, так і Ост-Індії."
 INSHOL_east_indies_fokker_division: "Сформувати Ост-Індійський підрозділ Fokker"
 INSHOL_east_indies_fokker_division_desc: "Ліцензії Fokker настільки широко використовуються ВПС Ост-Індії, що варто розглянути можливість створення окремої філії, що надаватиме пріоритет ВПС Ост-Індії."
 INSHOL_expand_shell: "Розширення інфраструктури Shell"
 INSHOL_expand_shell_desc: "Shell поступово стає дедалі більшою частиною нашої економіки. Зрозуміло, що ми повинні розширити нафтову інфраструктуру в Ост-Індії, щоб не відставати від експортного потенціалу Shell."
 INSHOL_increase_funding_for_tix: "Збільшити фінансування проєкту літака T.IX"
 INSHOL_increase_funding_for_tix_desc: "Інженери Fokker розробляють новий двомоторний бомбардувальник для заміни застарілих моделей, які використовують ВПС Ост-Індії. Цей проєкт має дуже малий бюджет, і, ймовірно, його завершення триватиме дуже довго. Ми можемо збільшити їхнє фінансування, щоб значно прискорити прогрес."
 INSHOL_reduce_land_ownership_taxes: "Зниження податків на землеволодіння"
 INSHOL_reduce_land_ownership_taxes_desc: "Ми повинні зменшити податок на індонезійських громадян, які володіють землею, заохочуючи розвиток фермерських господарств і бізнесу."
 INSHOL_coffee_plantations: "Кавові плантації"
 INSHOL_coffee_plantations_desc: "Ми повинні зосередитися на отриманні більшої кількості державних земель на східних островах. Ми зможемо використати цю землю для створення кавових плантацій."
 INSHOL_overallwagen: "Овервалваген"
 INSHOL_overallwagen_desc: "Танки — не обов'язково рішення для армії Ост-Індії. Нам не вистачає промислової потужності, необхідної для їх виробництва, а суворий рельєф робить їх вузькоспеціалізованими. Щоб заповнити цю прогалину, ми могли б інвестувати у створення бронеавтомобілів для Індонезії."
 INSHOL_indonesian_cheap_labor: "Дешева індонезійська робоча сила"
 INSHOL_indonesian_cheap_labor_desc: "$CONGO_cheap_labor_desc$"
 INSHOL_eastern_development_fund: "Фонд розвитку східних островів"
 INSHOL_eastern_development_fund_desc: "Ми занадто багато уваги приділяємо інвестиціям в Яву та Суматру, ігноруючи більшу частину земель колонії. Ми маємо взяти на себе зобов'язання розвивати інфраструктуру на Сході, щоб уможливити майбутню індустріалізацію."
 INSHOL_increase_rubber_taxes: "Збільшити податки на гуму"
 INSHOL_increase_rubber_taxes_desc: "Багато каучукових компаній в Ост-Індії отримують величезні багатства, використовуючи ресурси колонії. Буде справедливо, якщо ми накладемо значний податок на ці операції."

 INSHOL_reform_knil: "Реформа KNIL"
 INSHOL_reform_knil_desc: "З того часу, як Ост-Індія завершила завоювання всього архіпелагу, Королівська голландська ост-індійська армія залишалася нерухомою і страждає від гострої нестачі фінансування. Із зростанням напруженості у світі, ми повинні почати переозброєння Ост-Індії якомога раніше."
 INSHOL_fund_ml_knil: "Фінансування ML-KNIL"
 INSHOL_fund_ml_knil_desc: "Якщо ми хочемо не відставати від армій світу, ми повинні створити власні належні військово-повітряні сили, інакше ми опинимося в значно невигідному становищі."
 INSHOL_bandung_aircraft_facility_tt: "§YЗахідна Ява:§!\n Додає §G1§! Слот для будівництва та §G1§! §YВійськовий завод§! за кожен завершений необхідний фокус."
 INSHOL_rangers: "Рейнджери"
 INSHOL_rangers_desc: "Ост-Індія — це величезний архіпелаг з різноманітним середовищем. Ми повинні підготувати рейнджерів, адаптованих до бойових дій у цих суворих умовах, щоб гарантувати нашу готовність до їхнього захисту."
 INSHOL_mountaineers: "Гірські стрільці"
 INSHOL_mountaineers_desc: "Ми повинні навчати гірських стрільців, які готові воювати у ворожому рельєфі нашого архіпелагу."
 INSHOL_elevate_elite_infantry: "Спеціальні війська Депо"
 INSHOL_elevate_elite_infantry_desc: "Ми не можемо вічно покладатися на великі військові стратегії, ми повинні адаптуватися до нових технологій і гарантувати, що не відстаємо. Ми повинні створити кілька елітних піхотних дивізій, готових захищати будь-яке середовище."
 INSHOL_modernize_knil: "Модернізація KNIL"
 INSHOL_modernize_knil_desc: "Ми вивчатимемо нові стратегії та доктрини для Ост-Індійської армії, забезпечуючи збереження переваги над ворогом."
 INSHOL_transfer_of_henri_winkelman: "Переведення Анрі Вінкельмана"
 INSHOL_transfer_of_henri_winkelman_desc: "Анрі Вінкельман раніше багато років служив у KNIL. Очевидно, що він знову потрібен в Ост-Індії, і ми повинні організувати його офіційне переведення."
 INSHOL_eastern_conscription: "Сформувати допоміжний корпус"
 INSHOL_eastern_conscription_desc: "На Яві та Мадурі є кілька туземних допоміжних корпусів, які контролюються місцевими правителями-князями. У ці важкі часи ми могли б укласти угоду з місцевими правителями, згідно з якою ці дивізії перебуватимуть під нашим командуванням."
 INSHOL_establish_vk_knil: "Створити VK-KNIL"
 INSHOL_establish_vk_knil_desc: "Ми створимо Жіночий добровольчий корпус для KNIL. Їхній внесок відіграватиме важливу роль у покращенні нашої логістики та зв'язку."
 INSHOL_emergency_dockyard_construction: "Екстрене будівництво верфей"
 INSHOL_emergency_dockyard_construction_desc: "Загрозу морського вторгнення неможливо недооцінити, ми повинні зробити морську оборону нашим головним пріоритетом."
 INSHOL_emergency_powers_gov_general: "Надзвичайні повноваження для генерал-губернатора"
 INSHOL_emergency_powers_gov_general_desc: "Триваюча війна вимагає прийняття жорстких рішень без зволікань, що неможливо, коли всі рішення в Ост-Індії повинні заздалегідь проходити через Нідерланди. Ми маємо надати надзвичайні повноваження [INS.GetLeader], щоб він міг діяти не гаючись."
 INSHOL_emergency_naval_purchases: "Екстрені військово-морські закупівлі"
 INSHOL_emergency_naval_purchases_desc: "Наші береги небезпечні та недостатньо захищені. Час має вирішальне значення, ми повинні отримати сильніший флот, інакше ми обов'язково загинемо. Ми купуватимемо кораблі у приватних компаній в борг і переобладнуватимемо їх на військово-морські есмінці."

 INSHOL_east_indies_navy: "Флот Ост-Індії"
 INSHOL_east_indies_navy_desc: "[INS.GetNameDefCap] не має офіційного флоту, залишаючи Нідерланди відповідальними за захист колонії. З огляду на зростаючу напруженість у Європі та Азії, так більше тривати не може. Ми повинні зробити перший крок до створення спеціального [INS.GetAdjective] флоту."
 INSHOL_marines: "Морська піхота"
 INSHOL_marines_desc: "Ми повинні створити спеціальний Корпус морської піхоти Ост-Індії в рамках нового флоту та відправляти морських піхотинців на навчання на голландських кораблях."
 INSHOL_domestic_ship_production: "Вітчизняне суднобудування"
 INSHOL_domestic_ship_production_desc: "Якщо ми хочемо, щоб наш флот протистояв сусідам, ми повинні почати нарощувати вітчизняне суднобудування."
 INSHOL_destroyers: "Есмінці"
 INSHOL_destroyers_desc: "Наші важчі бойові кораблі не можуть діяти у вузьких морях архіпелагу без ескорту для прикриття. Заклавши сучасні есмінці, [ROOT.GetAdjective] флот зможе охороняти свої судноплавні шляхи та відганяти торпедні катери в протоках."
 INSHOL_cruisers: "Крейсери"
 INSHOL_cruisers_desc: "Флот без лінкорів повинен спиратися на свої крейсери. Створення сильної ескадри крейсерів дає [ROOT.GetAdjective] флоту міцне ядро, здатне патрулювати великі відстані між островами та відповідати будь-якому рейдеру, який увійде в наші води."
 INSHOL_submarines: "Підводні човни"
 INSHOL_submarines_desc: "Протоки Ост-Індії створені для засідок, а підводний човен коштує набагато менше, ніж бойовий корабель, який він відправляє на дно. Сильна підводна складова дозволяє [ROOT.GetAdjective] флоту утримувати морські шляхи та завдавати ударів по ворожих суднах, навіть не показуючись."
 INSHOL_outsourced_navy: "Аутсорсинг виробництва корпораціям"
 INSHOL_outsourced_navy_desc: "У нас і так достатньо витрат, ми не можемо продовжувати відволікати все більше і більше колоніального бюджету на флот. Ми можемо платити корпораціям, щоб вони займалися виробництвом замість нас."
 INSHOL_divert_civilian_to_navy: "Перенаправити цивільні та армійські витрати на флот"
 INSHOL_divert_civilian_to_navy_desc: "За нинішнього стану у світі ризик морського вторгнення вищий, ніж будь-коли. Ми не можемо дозволити собі бути ощадливими, ми повинні перенаправити фінансування з усіх секторів уряду на флот."

 INS_netherlands_can_remove_autonomy_tt_50: "\nЯкщо [HOL.GetFlag]§Y[HOL.GetNameDefCap]§! завершить цей фокус першим:\n [INS.GetFlag]§Y[INS.GetName]§!: Отримує §Y£autonomy_texticon -50.00§!"
 INS_netherlands_can_remove_autonomy_tt_75: "\nЯкщо [HOL.GetFlag]§Y[HOL.GetNameDefCap]§! завершить цей фокус першим:\n [INS.GetFlag]§Y[INS.GetName]§!: Отримує §Y£autonomy_texticon -75.00§!"
 INS_netherlands_can_remove_autonomy_tt_100: "\nЯкщо [HOL.GetFlag]§Y[HOL.GetNameDefCap]§! завершить цей фокус першим:\n [INS.GetFlag]§Y[INS.GetName]§!: Отримує §Y£autonomy_texticon -100.00§!"
 INS_netherlands_can_remove_autonomy_tt_150: "\nЯкщо [HOL.GetFlag]§Y[HOL.GetNameDefCap]§! завершить цей фокус першим:\n [INS.GetFlag]§Y[INS.GetName]§!: Отримує §Y£autonomy_texticon -150.00§!"
 INS_netherlands_can_remove_autonomy_tt_200: "\nЯкщо [HOL.GetFlag]§Y[HOL.GetNameDefCap]§! завершить цей фокус першим:\n [INS.GetFlag]§Y[INS.GetName]§!: Отримує §Y£autonomy_texticon -200.00§!"
 INS_netherlands_can_remove_autonomy_tt_250: "\nЯкщо [HOL.GetFlag]§Y[HOL.GetNameDefCap]§! завершить цей фокус першим:\n [INS.GetFlag]§Y[INS.GetName]§!: Отримує §Y£autonomy_texticon -250.00§!"

 INSHOL_begin_negotiations_soetardjo: "Розпочати переговори з Сутарджо"
 INSHOL_begin_negotiations_soetardjo_desc: "Петиція Сутарджо щодо автономії є багатообіцяючою, даючи нам можливість знайти компроміс між націоналістами та лоялістами. Ми маємо розпочати офіційні переговори з його партією."
 INSHOL_urge_gov_veto: "Вимагати вето губернатора"
 INSHOL_urge_gov_veto_desc: "Петиція Сутарджо — це націоналістична схема, на яку ведеться уряд Ост-Індії. Ми повинні закликати генерал-губернатора негайно накласти вето на петицію, інакше ми ризикуємо втратити нашу колонію."
 INSHOL_eventual_autonomy: "Погодитись на майбутню автономію"
 INSHOL_eventual_autonomy_desc: "Прагнення індонезійців до незалежності сильне і не слабшає. Ми погодимося на остаточну автономію для Ост-Індії, але тільки після того, як колонія доведе, що може утримувати себе сама і продовжуватиме дотримуватися демократичних ідеалів."
 INSHOL_autonomous_dominion: "Акт Сутарджо [GetYear] року"
 INSHOL_autonomous_dominion_desc: "Незважаючи на нерозумне визначення 'самодостатності', встановлене Нідерландами, якому ми маємо відповідати, щоб умови петиції Сутарджо були чинними, індонезійське бажання незалежності є настільки сильним, що нам вдалося виконати ці вимоги. Згідно з угодою, ми проголосимо повну та беззастережну незалежність від голландської корони."
 INS_cannot_become_independent_tt: "§W§Y[INS.GetFlag][INS.GetNameDefCap]§! буде §Rназавжди позбавлена можливості стати незалежною§! без іноземного втручання.§!"

 INSHOL_sideline_the_volksraad: "Відсторонити Фольксрад"
 INSHOL_sideline_the_volksraad_desc: "Петиція, подана Сутарджо, є явним порушенням статті 1 Конституції Нідерландів і лише спричинить труднощі для адміністрації Ост-Індії. На петицію має бути накладено вето."
 INSHOL_prioritize_dutch_profits: "Пріоритет голландських прибутків"
 INSHOL_prioritize_dutch_profits_desc: "Ми зосередимо наші зусилля на збільшенні прибутків для батьківщини. Їхня економічна стабільність йде на благо всього Королівства."
 INSHOL_development_loans_netherlands: "Кредити на розвиток від Нідерландів"
 INSHOL_development_loans_netherlands_desc: "Ми можемо брати позики у голландських компаній, щоб пришвидшити наші зусилля з індустріалізації. Хоча ми використаємо нашу позицію як колонії, що розвивається, щоб гарантувати низькі відсоткові ставки, нам все одно доведеться платити відсотки."
 INSHOL_request_economic_dev_subsidy: "Запит на субсидії для економічного розвитку"
 INSHOL_request_economic_dev_subsidy_desc: "Ми довели своєму сюзерену свою цінність як прибуткової колонії. Ми можемо використати це як предмет торгу, щоб отримати субсидії на промисловий розвиток."
 INSHOL_loyalty_to_crown: "Вірність Короні"
 INSHOL_loyalty_to_crown_desc: "Ост-Індія — це багато що, але перш за все ми лояльна голландська колонія. Королева Вільгельміна приведе нас до перемоги. Ми не повинні дозволити націоналізму покласти край майже 500-річній історії та продовжуватимемо підтверджувати нашу абсолютну вірність Короні."
 INS_loans_timer: "\nЧерез §Y365§! днів:"
 INS_expand_batavia_med_school_tt: "§Y$INS_dutch_east_indies$§!: Модифікатор швидкості дослідження становить принаймні §G1.00%§!."
 INS_subsidize_local_business: "Субсидування місцевого бізнесу"
 INS_subsidize_local_business_desc: "Ми повинні надавати субсидії місцевому бізнесу для стимулювання економічного зростання, що в довгостроковій перспективі зміцнить нашу економіку."
 INSHOL_education_reforms: "Реформа освіти"
 INSHOL_education_reforms_desc: "Багато громадян Ост-Індії не мають можливості здобути освіту, і дуже мало хто закінчив середню школу. Якщо ми хочемо, щоб Ост-Індія стала багатою індустріальною державою, ми повинні забезпечити належний доступ населення до освіти."
 INS_expand_batavia_med_school: "Розширення Медичної школи Батавії"
 INS_expand_batavia_med_school_desc: "Розширення Медичної школи Батавії шляхом будівництва нових кампусів і найму більшої кількості професорів зробить подальшу освіту набагато доступнішою, що життєво важливо для нашого довгострокового економічного зростання."
 INS_prepare_for_policy_shift: "Підготовка до зміни політичного курсу"
 INS_prepare_for_policy_shift_desc: "Політичний ландшафт в Ост-Індії зазнав впливу національного пробудження останніх десятиліть, і наша нинішня політика вочевидь застаріла. Ми повинні подумати про внесення деяких змін до нашої структури управління."
 INS_reallocate_rubber_industry_funding: "Перерозподіл фінансування гумової промисловості"
 INS_reallocate_rubber_industry_funding_desc: "Наша залежність від продажу каучуку мала згубний вплив на нашу економіку. Ми повинні диверсифікувати нашу економіку шляхом розвідки ресурсів і відкриття шахт і фабрик по всьому архіпелагу. Це буде недешевою справою, тому нам доведеться скоротити бюджет на утримання каучукових плантацій."
 INS_reallocate_rubber_industry_funding_tt: "Відкриває рішення §Yприбрати гуму з регіону§! та замінити її меншими кількостями §Yінших ресурсів§!."

 INSHOL_nationalist_coallition: "Націоналістична коаліція"
 INSHOL_nationalist_coallition_desc: "Фольксрад занадто довго говорив в один голос, і цей голос був занадто тихим. Час петицій і терплячих відстрочок минув. Коаліція націоналістичних членів палати відкладе свої суперечки та вимагатиме безумовної незалежності. Старі голоси з-поза меж палати, люди, яких голландці колись вважали надійно відсунутими на другий план, знову будуть запрошені до нашого кола."

 INSHOL_volksraad_compromises: "Компроміси Фольксраду"
 INSHOL_volksraad_compromises_desc: "Реформи всередині палати завели нас так далеко, і немає причин відмовлятися від цього шляху зараз. Фольксрад продовжить свою обережну роботу, торгуючись поступкою за поступку з Гаагою, досягаючи самоврядування через терпіння, а не через розрив. Майбутнє в рамках голландської співдружності пропонує більше, ніж майбутнє, проведене в боротьбі за існування поза нею."

 INSHOL_establish_the_princely_council: "Створити Раду князів"
 INSHOL_establish_the_princely_council_desc: "Султани і раджі архіпелагу користуються такою лояльністю, якої не мала жодна палата в Батавії. Їхні двори старіші за Компанію і старіші за Республіку, яка її змінила. Офіційна рада князівських домів дасть цим правителям місце за столом нової нації і пов'яже їхній авторитет з нашим."

 INSHOL_nationalize_dutch_companies: "Націоналізувати голландські компанії"
 INSHOL_nationalize_dutch_companies_desc: "Великі торгові доми, судноплавні лінії, плантаційні концерни та банки носили голландські імена стільки, скільки хтось може пам'ятати. Відтепер вони носитимуть індонезійські. Ради директорів будуть перепризначені, вивіски зняті, а капітал, який вилучався з цих островів протягом трьох століть, нарешті належатиме самим островам."

 INSHOL_democracy: "Демократична Індонезія"
 INSHOL_democracy_desc: "Фольксрад розпочав своє життя як напівміра, дорадчий орган із ретельно обмеженими можливостями, покликаний створити видимість представництва, але без його суті. Він переріс своїх творців. Палата буде реорганізована у справжній законодавчий орган, члени якого обиратимуться народом, який він нібито представляє, а рішення якого будуть обов'язковими для уряду, який колись тримав її на короткому повідку."

 INSHOL_princely_authority: "Князівська влада"
 INSHOL_princely_authority_desc: "Рада радників — гарна річ на своєму місці, але султани, які позичили свої імена для заснування цієї нації, можуть дати ще більше. Парламент не стане на шляху тих, хто хотів би бачити одного з них піднесеним над іншими. Старі двори довго чекали, коли їм знову поставлять це запитання."

 INSHOL_encourage_further_investment: "Заохочення подальших інвестицій"
 INSHOL_encourage_further_investment_desc: "Умови, узгоджені у Фольксраді, наразі вирішили політичне питання, і голландський капітал взяв це до уваги. Тарифи будуть пом'якшені, гарантії розширені, а торгові палати в Амстердамі та Роттердамі переконані, що архіпелаг залишається відкритим для бізнесу. Те, що було прибутковим за старих угод, буде прибутковим і за нових."

 # <Joint Tree - ABDACOM>
 INSHOL_east_indies_artillery: "Виробництво артилерії в Ост-Індії"
 INSHOL_east_indies_artillery_desc: "Відкриття артилерійських заводів на Яві дозволить нам менше залежати від зовнішньої торгівлі у наших військових зусиллях."
 INSHOL_recall_gerardus_johannes_berenschot: "Відкликати генерала Береншота"
 INSHOL_recall_gerardus_johannes_berenschot_desc: "Герардус Йоганнес Береншот є одним з найталановитіших генералів Співдружності. Більшу частину своєї кар'єри він провів в Ост-Індії, але кілька років перебував у Нідерландах. У ці важкі часи ми повинні відкликати його до Ост-Індії, щоб допомогти у воєнних зусиллях."
 INSHOL_east_indies_cruiser_manufacturing: "Виробництво крейсерів в Ост-Індії"
 INSHOL_east_indies_cruiser_manufacturing_desc: "Виробництво власних крейсерів замість замовлення їх безпосередньо у голландців — це перший крок до формування справжнього флоту, необхідне зусилля з огляду на японську загрозу."
 INSHOL_transfer_of_conrad_helfrich: "Переведення Конрада Хелфріха до Ост-Індії"
 INSHOL_transfer_of_conrad_helfrich_desc: "Переведення адмірала Конрада Хелфріха безпосередньо до Ост-Індії критично покращить військово-морські зусилля в Ост-Індії."

 # <Joint Tree - Naval Program>
 INSHOL_naval_program: "Нідерландсько-Індонезійська військово-морська програма"
 INSHOL_naval_program_desc: "Флот Ост-Індії далеко відстає від інших флотів, навіть колоніальних. В інтересах усіх сторін, щоб ми допомогли у розбудові цього нового флоту, щоб забезпечити швидкий прогрес."

 INSHOL_naval_program_transfer_25_tt: "Передає §Y25%§! наших військово-морських сил до [INS.GetNameDef]."
 INSHOL_naval_program_transfer_25_2_tt: "§Y[HOL.GetFlag] [HOL.GetNameDefCap]§! передасть §Y25%§! своїх військово-морських сил до §Y[INS.GetNameDefCap]§!."
 INSHOL_naval_program_transfer_100_tt: "Передає §Rвесь наш флот§! до [INS.GetNameDef]."
 INSHOL_naval_program_transfer_100_2_tt: "§Y[HOL.GetFlag] [HOL.GetNameDefCap]§! передасть весь свій флот до §Y[INS.GetNameDefCap]§!."
 INSHOL_naval_program_rejected_tt: "Відкриває національний фокус §Y$INSHOL_naval_secondchance$§!."

 INSHOL_hybrid_navy: "Гібридний флот"
 INSHOL_hybrid_navy_desc: "Наш флот не може покладатися лише на захоплення тихоокеанського флоту [HOL.GetNameDef], ми повинні почати виробляти власні кораблі, інакше одна помилка може відрізати все наше військово-морське постачання."
 INSHOL_request_naval_control: "Ост-Індійська ескадра"
 INSHOL_request_naval_control_desc: "[HOL.GetNameDefCap] пала і не в змозі керувати цілим флотом. Ми повинні взяти його під свій контроль до кінця війни."
 INSHOL_naval_secondchance: "Ост-Індійська військово-морська схема"
 INSHOL_naval_secondchance_desc: "Хоча [HOL.GetNameDef] відмовилися передати контроль над флотом, нам все одно потрібно захищати Тихий океан, якщо ми не хочемо, щоб нас захопили. Хоча це може спрацювати не так добре, як якби вони погодилися на нашу пропозицію, ми знайдемо достатньо хорошу альтернативу."

 # <Joint Tree - Netherlands in Exile>
 INSHOL_netherlands_in_exile: "Нідерланди в екзилі"
 INSHOL_netherlands_in_exile_desc: "Трагічне падіння нашого королівства тепер стало реальністю. Ми не можемо опуститися до пораженства. Ми повинні прийняти те, що сталося, і зосередитися на тому, що ми можемо врятувати."
 #INSHOL_relocate_prime_minister: "Relocate the Prime Minister to Java"
 INSHOL_relocate_our_generals: "Передислокувати нашу армію на Яву"
 INSHOL_relocate_our_generals_desc: "Генерали у вигнанні, командири та солдати, що залишилися, мають бути перекинуті до [1058.GetName] з найвищим пріоритетом, поки не пізно."
 #INSHOL_relocate_our_soldiers: "Transfer Holdout Soldiers to Java"
 INSHOL_netherlands_indonesia_union: "Нідерландсько-Індонезійська унія"
 INSHOL_netherlands_indonesia_union_desc: "Концепція рівноправної союзної держави між [HOL.GetNameDef] та [INS.GetNameDef] для багатьох виглядає смішною, але в умовах кризи, в якій ми опинилися, це виглядає як єдиний спосіб максимізувати наші шанси на збереження суверенітету."

 # <Sukarno Shared Branch - Resistance Buildup>
 INS_underground_revolution: "Підпільна революція"
 INS_underground_revolution_desc: "Ми почнемо планувати революцію з тіні, повільно збільшуючи кількість членів і активність ополчення, поки не будемо готові завдати удару."
 INS_infiltrate_the_media: "Проникнення в ЗМІ"
 INS_infiltrate_the_media_desc: "Наш рух залучив кількох високопоставлених представників медіаорганізацій в Ост-Індії. Ми можемо використати це на нашу користь, щоб непомітно посіяти прореволюційні настрої в головах громадян."
 INS_infiltrate_the_army: "Проникнення в армію"
 INS_infiltrate_the_army_desc: "Багато наших членів зараховані до KNIL, від рядових до майорів. Ми повинні зібрати якомога більше секретів, одночасно просуваючи своїх на високі посади. Коли ми натиснемо на курок, ми зможемо посіяти хаос у KNIL."
 INS_privately_owned_military_industry: "Приватна військова промисловість"
 INS_privately_owned_military_industry_desc: "Ми створимо кілька тіньових корпорацій у військово-промисловому секторі, що гарантуватиме нам збереження контролю над військовою промисловістю після початку революції."
 INS_privately_owned_military_industry_tt: "Додає §G2§! §YВійськовий завод§! у вашому Штабі"
 INS_instigate_chaos_sulawesi: "Спровокувати хаос на Сулавесі"
 INS_instigate_chaos_sulawesi_desc: "Ми співпрацюватимемо з місцевими націоналістами на Сулавесі, організовуючи страйки, заворушення та радикалізуючи населення."
 INS_instigate_chaos_sulawesi_tt: "Коли ми проголосимо незалежність, ми отримаємо §Gщитову територію§! на §Y[673.GetName]§! та §Y[1056.GetName]§!. Голландська Ост-Індія більше не матиме там щитових територій."
 INS_instigate_chaos_medan: "Спровокувати хаос у Медані"
 INS_instigate_chaos_medan_desc: "Ми співпрацюватимемо з місцевими націоналістами в Медані та Ріау, організовуючи страйки, заворушення та радикалізуючи населення."
 INS_instigate_chaos_medan_tt: "Коли ми проголосимо незалежність, ми отримаємо §Gщитову територію§! на §Y[1049.GetName]§!. Голландська Ост-Індія більше не матиме там щитової території."
 INS_embezzlement_scheme_in_batavia: "Схема розкрадання в Батавії"
 INS_embezzlement_scheme_in_batavia_desc: "Ми створимо схему переміщення нашого виробництва з Батавії на територію республіки після проголошення незалежності."
 INS_embezzlement_scheme_in_batavia_tt: "Після проголошення незалежності половина всіх фабрик у §Y[1058.GetName]§! буде переміщена до нашого §YРеволюційного Штабу§!."
 INS_volksraad_rumors: "Чутки у Фольксраді"
 INS_volksraad_rumors_desc: "Ми почнемо непомітно обговорювати революцію у Фольксраді. Якщо ми досягнемо успіху, ми зможемо переконати індонезійських членів Фольксраду приєднатися до нашої справи."
 INS_volksraad_rumors_tt: "Усі §Yіндонезійські §!радники Фольксраду будуть §Gзбережені§! після проголошення незалежності."

 INS_railway_youth_force: "Співпраця із Залізничними молодіжними силами"
 INS_railway_youth_force_desc: "Залізничні молодіжні сили — це ісламська молодіжна група ополченців, яка переважно діє в Центральній Яві і названа так на честь своєї стратегії захоплення залізниць. Вони б стали цінним союзником, проте вони енергійні і хочуть брати участь у боях. Вони будуть незадоволені урядом, якщо ми занадто довго залишатимемося у стані припинення вогню."
 INS_sleeper_informant_network: "[GetInformantNetworkName]"
 INS_Sleeper_Informant_Network_name: "Мережа сплячих інформаторів"
 INS_KNIL_Informant_Network_name: "Мережа інформаторів KNIL"
 INS_sleeper_informant_network_desc: "Ми створимо мережу інформаторів, впроваджену по всьому адміністративному апарату KNIL, що дасть нам завчасне попередження про плани ворога."
 INS_sleeper_informant_network_tt: "§RПісля проголошення Незалежності:§!\n"

 # <Sukarno Shared Branch - Peoples Security Army>
 INS_the_peoples_security_army: "Армія народної безпеки"
 INS_the_peoples_security_army_desc: "Наші члени, які в основному є молодими індонезійцями, втрачають терпіння, прагнучи зробити свій внесок і боротися за нашу Незалежність. Ми повинні створити Революційні збройні сили і почати тренувати наших майбутніх солдатів."
 INS_commander_sudirman: "Армія Судірмана"
 INS_commander_sudirman_desc: "Судірман, незважаючи на те, що він молодий перспективний діяч, продемонстрував великий потенціал і користується великою популярністю серед молодих членів опору. Він має спрямувати шлях Армії народної безпеки і привести нас до перемоги."
 INS_commander_oerip: "Армія Уріпа"
 INS_commander_oerip_desc: "Уріп десятиліттями служив в армії і є єдиним індонезійцем, який коли-небудь був підвищений до майора в KNIL. Його знання та досвід набагато перевищують знання будь-якого іншого члена. Він має спрямувати шлях Армії народної безпеки і привести нас до перемоги."
 INS_sudirmans_promotion: "Підвищення Судірмана"
 INS_sudirmans_promotion_desc: "Судірман продемонстрував чудові лідерські якості та організував кілька успішних наступів. Настав час визнати зусилля нашого Командира, надавши йому звання Генерала, на яке він заслуговує."
 INS_tkr_steal_general: "Переманити генералів KNIL"
 INS_tkr_steal_general_desc: "Якщо ми зможемо переконати високопоставлених членів Ост-Індійської армії приєднатися до нашої справи, ми одночасно покращимо нашу армію і саботуємо їхню."
 INS_tkr_supply: "Кожен революціонер має битися"
 INS_tkr_supply_desc: "Ми забезпечимо, щоб кожен член нашого руху отримав офіційну військову підготовку, без винятків."
 INS_tkr_professional_army: "Професійна армія"
 INS_tkr_professional_army_desc: "Ми не повинні покладатися лише на ополчення, ми повинні створити професійну Республіканську армію для підтримання порядку."

 INS_arm_the_revolutionaries: "Озброїти революціонерів"
 INS_arm_the_revolutionaries_desc: "Ми маємо почати з революціонерів і націоналістів, які сповнені енергії і готові віддати все, що мають, за Індонезію. Ми забезпечимо їм навчання та спорядження, необхідні для боротьби за свою країну."
 INS_arm_the_youth: "Озброїти молодь"
 INS_arm_the_youth_desc: "Крім революціонерів, ми маємо озброїти молодь. Все ще сповнені енергії та надії, вони нестимуть полум'я революції. Ми повинні гарантувати, що якомога більше індонезійської молоді буде навчено та оснащено для бою. Якщо бойові дії дійдуть до їхніх домівок, вони будуть готові діяти."
 INS_arm_the_students: "Озброїти студентів"
 INS_arm_the_students_desc: "Студенти заклали фундамент революції ще десятиліття тому, і вони продовжуватимуть вести її вперед."
 INS_guerilla_industry: "Партизанська промисловість"
 INS_guerilla_industry_desc: "Ми використаємо наші партизанські сили по всьому архіпелагу, щоб захопити контроль над фабриками, що дозволить нам виробляти нову зброю для озброєння нашого ополчення."
 INS_indonesian_assault_doctrine: "Індонезійська штурмова доктрина"
 INS_indonesian_assault_doctrine_desc: "Солдати — це ще не все на війні. Мільйон людей нічого не варті, якщо у них немає зброї, якою можна битися. Ми маємо надати пріоритет отриманню високоякісної артилерії, щоб просуватися глибше на контрольовану ворогом територію."
 INS_tighter_tkr_integration: "Тісніша інтеграція TKR і Ласкар"
 INS_tighter_tkr_integration_desc: "Армія народної безпеки та різні ополчення не діють у єдності, а координація обмежена. З продовженням війни це лише створюватиме все більше і більше проблем, нам потрібно об'єднати збройні сили та ополчення в єдину організацію, незважаючи на неминучі протести офіцерів ополчення."
 INS_quality_over_quantity: "Якість важливіша за кількість"
 INS_quality_over_quantity_desc: "Один добре навчений солдат із продуманою стратегією та сучасним спорядженням переможе п'ятьох студентів із пістолетами. Ми маємо надавати пріоритет високоякісним, добре озброєним солдатам і спецпризначенцям, а не мобілізації якомога більшої кількості солдатів."
 INS_add_militia_cap_1_tt: "Ліміт дивізій §YБорців за свободу§! збільшується на §Y1§!.\n"
 INS_add_militia_cap_2_tt: "Ліміт дивізій §YБорців за свободу§! збільшується на §Y2§!.\n"
 INS_add_militia_cap_3_tt: "Ліміт дивізій §YБорців за свободу§! збільшується на §Y3§!.\n"
 INS_add_3_militia_unit_tt: "Створює три підрозділи §YБорців за свободу§!, які можна використовувати в §Yрейдах§! для збільшення §Gприсутності ополчення§! в голландських регіонах."
 INS_add_fully_trained_militia_unit_tt: "Створює один навчений підрозділ §YБорців за свободу§!.\n"

 # <Sukarno Shared Branch - Expand Resistance Membership>
 INS_expand_resistance_membership: "Розширення членства в Опорі"
 INS_expand_resistance_membership_desc: "Зосередження всього нашого руху на одній базі гарантує провал. Ми зберемо членів у групи ополченців для відправки як посланців, які підвищать нашу популярність і контроль у різних регіонах."

 # <Central Independence Branch - Militias>
 INS_deploy_the_kris: "Служба індонезійського народу Сулавесі"
 INS_deploy_the_kris_desc: "Служба індонезійського народу Сулавесі, відома індонезійською як KRIS, є активною групою ополчення та становить більшість присутнього ополчення на Сулавесі та Манадо. Ми маємо залучити їх до офіційної боротьби разом з TKR."
 INS_assist_the_pemuda: "Допомога Пемуда"
 INS_assist_the_pemuda_desc: "Ява повна різноманітних студентських ополчень Пемуда. Об'єднання зусиль з ними та надання військової допомоги в їхніх місіях проти голландців може забезпечити нам корисного союзника."
 INS_mobilize_the_pemuda: "Мобілізація Пемуда"
 INS_mobilize_the_pemuda_desc: "Тепер, коли ми успішно заслужили довіру найбільших груп Пемуда, ми повинні розпочати плани щодо їх мобілізації до TKR."
 INS_organize_jakarta_pemuda: "Організація Джакартських Пемуда"
 INS_organize_jakarta_pemuda_desc: "На Яві є багато груп Пемуда будь-яких розмірів. Хоча ми мобілізували та набрали більшість із них, у Джакарті є десятки невеликих, які все ще діють самостійно. Ми маємо зв'язатися з ними та налагодити співпрацю."
 INS_recognize_moestopos_batallion: "Визнання батальйону Мустопо"
 INS_recognize_moestopos_batallion_desc: "Революціонер на ім'я Мустопо проголосив себе 'виконувачем обов'язків міністра оборони' в Сурабаї, зберігаючи контроль над ополченням у Сурабаї. Його зусилля заслуговують на офіційне визнання, ми маємо офіційно підвищити його до генерал-майора TKR."
 INS_darul_islam_focus: "Даруль Іслам"
 INS_darul_islam_focus_desc: "Хізбулла Картосувірйо проявили себе на пагорбах Західної Яви, і ми не можемо дозволити собі залишити таких бійців поза нашими лавами. Нехай його іррегулярні війська стоять серед наших, і нехай він сам носить звання, яке заслужив. Вірні незабаром відстоюватимуть свою справу в Республіці."

 # <Central Independence Branch - Navy>
 INS_just_a_fisherman: "Проста рибалка"
 INS_just_a_fisherman_desc: "Вести війну на архіпелазі без флоту — це складне завдання, і ми не зможемо довго його підтримувати. Ми спробуємо, можливо, наївну стратегію, за якою ми відправимо ополченців на рибальських човнах, замаскованих під рибалок, до портів, які контролюються голландцями."
 INS_a_cheap_navy: "Дешевий флот"
 INS_a_cheap_navy_desc: "У нас немає часу чи грошей на створення великого сучасного флоту. Ми повинні обходитися тим, що маємо, і збирати до купи все, що можемо знайти."
 INS_divert_army_funds_to_navy: "Перенаправити армійські кошти на флот"
 INS_divert_army_funds_to_navy_desc: "Індонезія — це архіпелаг, наша піхота — ніщо без кораблів для її транспортування. Перенаправити фінансування від TKR до нашого нового флоту — це гідна жертва."
 INS_indonesian_naval_doctrine: "Індонезійська військово-морська доктрина"
 INS_indonesian_naval_doctrine_desc: "Тепер, коли ми будуємо власний флот, важливо розглянути доктрину, за якою ми будемо битися та тренуватися. Ми маємо надати пріоритет формуванню та прийняттю Військово-морської доктрини якомога швидше."
 INS_domestic_shipbuilding: "Вітчизняне суднобудування"
 INS_domestic_shipbuilding_desc: "Ми не можемо вічно покладатися на захоплені та куплені кораблі, не пройде багато часу, як для нас більше не залишиться голландських кораблів для захоплення. Ми повинні почати будувати власні кораблі завчасно."
 INS_acquire_modern_blueprints: "Придбати сучасні креслення"
 INS_acquire_modern_blueprints_desc: "Ми купуватимемо креслення в інших країнах і приватних корпораціях, які ми використаємо для будівництва нашого нового флоту."
 INS_reclaiming_the_dutch_navy: "Повернення голландського флоту Ост-Індії"
 INS_reclaiming_the_dutch_navy_desc: "Голландці залишили багато кораблів, розміщених у портах, які ми зараз займаємо. Ми повинні забрати ці кораблі собі, поки є така можливість."
 INS_admiral_mas_pardi: "Адмірал Мас Парді"
 INS_admiral_mas_pardi_desc: "Будь-якому хорошому флоту потрібен Адмірал, який буде ним командувати. Мас Парді — очевидний вибір."
 INS_akademi_angkatan_laut: "Будівництво Akademi Angkatan Laut"
 INS_akademi_angkatan_laut_desc: "Ми побудуємо Військово-морську академію з об'єктами для військово-морських досліджень, одночасно навчаючи більше громадян на інженерів та адміралів."

 # <Central Independence Branch - Militia Logistics>
 INS_pki_militia_tt: "Тан Малака має дуже потужне ополчення, проте вони борються не лише за волю Індонезії, але й за волю §Rкомунізму§! та Рад. §RЗрештою, вони жорстоко протистоятимуть будь-якому некомуністичному уряду.§!"
 INS_increase_laskar_funding_tt: "§WОтримує§! 1§Y Військовий завод§! за кожну успішно задоволену вимогу ополчення, максимум §G6§!"
 INS_subsidize_laskar_armament: "Субсидування озброєння Ласкар"
 INS_subsidize_laskar_armament_desc: "Ополченці, що б'ються бамбуковими списами, не виживуть довго проти важкоозброєних підрозділів. Нам потрібно надати пріоритет виробництву більшої кількості зброї та боєприпасів для цих ополчень."
 INS_loot_knil_weapons_caches: "Пограбувати схованки зброї KNIL"
 INS_loot_knil_weapons_caches_desc: "Є багато схованок зі зброєю, які KNIL заклав до революції. Багато наших членів є колишніми членами KNIL, і ми, можливо, зможемо знайти та пограбувати ці схованки."
 INS_utilize_tan_malakas_militia: "Використати ополчення Тана Малаки"
 INS_utilize_tan_malakas_militia_desc: "Червоне ополчення Тана Малаки — це, мабуть, найсильніше окреме ополчення в усій Індонезії, і його мобілізація до TKR стала б величезною перевагою. Це не обходиться без ризиків, надання потужному ополченню з сильними політичними мотивами такого впливу значно полегшить їм захоплення влади."
 INS_increase_laskar_funding: "Збільшити фінансування Ласкар"
 INS_increase_laskar_funding_desc: "Наші ополченці складають більшість наших сил. Ми маємо визнати це і фінансувати їх відповідно, навіть якщо вони не повністю лояльні до [INS.GetLeader]."
 INS_develop_a_functioning_airforce: "Створення належних ВПС"
 INS_develop_a_functioning_airforce_desc: "Військово-повітряні сили мають великий вплив на армію, ми повинні надати пріоритет їх створенню."

 INS_political_stabilization: "The Central Indonesian National Committee" # (!)
 INS_political_stabilization_desc: "In order to end the infighting between the many political factions in Indonesia, we must grant concessions to the other factions, allowing us to focus on the ongoing conflict. We will establish a semi-democratic committee overseen by the President, serving as a parliamentary body for Indonesia." # (!)

 INS_nationalize: "Nationalize!" # (!)
 INS_nationalize_desc: "Our newly independent republic is still plagued with remnants of Dutch rule. The military industrial companies, the oil companies, the agricultural companies, and many others are all tied to the Netherlands, be it directly or indirectly. For our Republic to truly be independent, we must establish our own national institutions to inherit the Indonesian assets from these corporations." # (!)

 # <Vice Presidential Edict - Intro>
 INS_restore_order: "Відновлення порядку"
 INS_restore_order_desc: "Наша країна стає все більш нестабільною з кожним днем. Якщо ми не відреагуємо найближчим часом, громадянська війна буде майже неминучою. Ми маємо розпочати переговори між Національним комітетом, Президентом та лідерами ополчень, щоб знайти рішення."
 INS_vice_presidential_edict: "Підписати Указ віцепрезидента X"
 INS_vice_presidential_edict_desc: "Національний комітет майже одностайний у своїй вимозі реальної законодавчої влади. Президенту було передано петицію, що пропонує гібридну систему, де Національний комітет стане незалежним парламентом, поділяючи спільні законодавчі повноваження з Президентом. Пропозиція приваблива, але існує ризик того, що влада Президента стане незначною."
 INS_local_cooperatives: "Створення місцевих кооперативів"
 INS_local_cooperatives_desc: "Ми не повинні створювати капіталістичну систему, як на заході, але ми не повинні ігнорувати економічні вигоди, які забезпечує приватизація. Ми дозволимо створення місцевих кооперативів, успіх яких принесе багатство їхнім власникам. Однак вони контролюватимуться урядом і їм буде заборонено розширюватися за межі свого регіону."
 INS_local_unity: "Часткова князівська автономія"
 INS_local_unity_desc: "Ми надамо часткову автономію князівським державам як тимчасовий захід для зменшення внутрішніх конфліктів у ці й без того неспокійні часи."
 INS_education_subsidies: "Субсидії на освіту"
 INS_education_subsidies_desc: "Інвестиції в майбутнє молоді нації абсолютно необхідні, якщо ми хочемо економічно успішної держави. Ми будуватимемо доступні школи по всій республіці."
 INS_land_reform: "Земельна реформа"
 INS_land_reform_desc: "До того, як ми проголосили незалежність, Нідерланди безпосередньо володіли великими обсягами землі. Ми повинні розподілити цю землю між індонезійцями, які будуть її використовувати, за низькими цінами, щоб стимулювати економічне зростання."
 INS_dominion_of_atjeh: "Домініон Ачех"
 INS_dominion_of_atjeh_desc: "Сепаратистський рух в Ачеху є значним і зростає. Немає причин для ескалації ситуації, замість цього ми повинні домовитися про компроміс, згідно з яким вони залишаться частиною Індонезії, маючи при цьому значну автономію."

 # <Vice Presidential Edict - Presidential Balance>
 INS_dissolve_national_party: "Розпуск Національної партії"
 INS_dissolve_national_party_desc: "Гібридна система була створена як необхідний компроміс для уникнення хаосу. Ми не повинні дозволити Президенту мати стільки влади недемократичним шляхом. Президент має бути усунутий парламентом, інакше ми ніколи не досягнемо демократії."
 INS_womens_sufferage: "Жіноче виборче право"
 INS_womens_sufferage_desc: "Надання жінкам права голосу призведе до короткострокової нестабільності, але є необхідним для довгострокової стабільності та демократії."
 INS_women_in_military: "Жінки в армії"
 INS_women_in_military_desc: "Дозвіл жінкам служити в армії є необхідним для того, щоб наші збройні сили були якомога потужнішими."
 INS_fair_election: "Чесні вибори"
 INS_fair_election_desc: "Після повалення Президента та закінчення революції ми нарешті зможемо провести перші справді чесні вибори без авторитарного впливу."

 # < Hybrid Politics >
 INS_continue_hybrid_politics: "Продовження гібридної політики"
 INS_continue_hybrid_politics_desc: "Гібридна політика — необхідне зло. Хоча кінцевою метою є справжня демократія, Індонезія занадто молода та нестабільна, щоб усю владу можна було передати народу. Президент і Парламент продовжуватимуть стримувати один одного, гарантуючи, що жоден з органів не стане надто могутнім."
 INS_guided_economy: "Керована економіка"
 INS_guided_economy_desc: "Ми безпосередньо контролюватимемо економіку Індонезії, щоб гарантувати збереження контролю. Ми націоналізуємо всі банки, а також нафтовий та сільськогосподарський сектори."
 INS_reform_education_system: "Обов'язкова ідеологічна освіта"
 INS_reform_education_system_desc: "Революція довела, що студенти та молодь, незадоволені соціальним устроєм, завжди очолюватимуть повстання. Задля безпеки нашого уряду та нації ми вимагатимемо, щоб у школах викладали відповідно до нашої урядової ідеології."
 INS_reform_education_system_2: "Реформа освіти"
 INS_reform_education_system_2_desc: "Якщо ми хочемо, щоб Індонезія в майбутньому стала багатою країною, усі індонезійці, незалежно від місця народження, повинні мати право на освіту."
 INS_three_year_plan: "Трирічний план"
 INS_three_year_plan_desc: "Ми можемо скласти трирічний план з будівництва інфраструктури по всьому архіпелагу та з'єднання островів."

 INS_destroy_pacific_colonialism: "Знищення тихоокеанського колоніалізму"
 INS_destroy_pacific_colonialism_desc: "Революція могла закінчитися, але ще є битви, які потрібно виграти. Є ще багато людей, які живуть під колоніальною тиранією біля нашого порогу. Ми не можемо сидіти склавши руки та спостерігати, ми маємо діяти, щоб звільнити їх від сюзеренів!"
 INS_rapid_mobilization: "Швидка мобілізація"
 INS_rapid_mobilization_desc: "Будь-яка сильна нація опирається на сильну армію. Якщо ми хочемо стати регіональною наддержавою, здатною стояти на своєму, ми повинні почати з того, щоб зробити нашу армію набагато сильнішою, ніж вона є сьогодні."
 INS_greater_indonesia: "Проголосити Велику Індонезію"
 INS_greater_indonesia_desc: "Стародавня імперія Нусантара колись об'єднала малайський світ як єдине ціле, один народ. Звільнивши Малайю від колоніальної тиранії, ми маємо зробити так, як наші предки в Нусантарі, проголосивши весь малайський світ єдиною об'єднаною нацією."

 # < State Religion >
 INS_secularism: "Секуляризм"
 INS_secularism_desc: "Індонезія є домом для багатьох людей різних релігій. Змішування релігії та політики призведе лише до внутрішніх конфліктів, тому ми маємо заборонити релігійні політичні партії."
 INS_integrate_sarekat_islam: "Інтегрувати Сарекат Іслам"
 INS_integrate_sarekat_islam_desc: "Великі ісламські політичні партії мають значну підтримку населення. В наших інтересах інтегрувати їх в уряд."

 # <Vice Presidential Edict - Sjahrir>
 INS_sjahrirs_continued_tenure: "Продовження повноважень Шаріра"
 INS_sjahrirs_continued_tenure_desc: "Прем'єр-міністр Шарір проявив себе як великий лідер, провівши нас через революцію, покращивши нашу економіку та встановивши демократію. Ми повинні переобрати його Прем'єр-міністром."
 INS_unity_in_diversity: "Єдність у різноманітті"
 INS_unity_in_diversity_desc: "Століттями слова 'Єдність у різноманітті' відображали дух нашого архіпелагу. Під час революції ця ідея стала гаслом, нагадуючи індонезійцям, що хоча ми говоримо багатьма мовами і дотримуємося багатьох різних традицій, ми стоїмо разом як один народ. Ми повинні закріпити цю фразу в нашій конституції, щоб наша єдність збереглася для наступних поколінь."

 INS_the_timor_issue: "[INS_timor_issue_scripted_name]"
 INS_timor_issue_scripted_name_issue: "Тіморська проблема"
 INS_timor_issue_scripted_name_attack: "Атака на Східний Тімор"
 INS_the_timor_issue_desc: "[INS_timor_issue_scripted_desc]"
 INS_timor_issue_scripted_desc_issue: "Східний Тімор вочевидь є законною індонезійською територією, і хоча революція закінчилася, він все ще перебуває під колоніальним пануванням. Ми надішлемо ультиматум [721.OWNER.GetName] з вимогою негайної передачі Східного Тімору."
 INS_timor_issue_scripted_desc_attack: "Східний Тімор вочевидь є законною індонезійською територією. Повстанці на острові можуть вимагати незалежності, але вони вочевидь не говорять від імені всього населення. Залишки португальського колоніалізму мають бути інтегровані в Республіку."

 INS_pledge_to_allies: "Присяга Союзникам"
 INS_pledge_to_allies_desc: "Ми ризикуємо зазнати вторгнення як частина зростаючого конфлікту в усьому світі. Хоча наші відносини з Союзниками були хиткими, ми утвердилися як демократична держава в Тихому океані і повинні об'єднатися з великими демократичними державами."
 INS_mixed_economy_system: "Система змішаної економіки"
 INS_mixed_economy_system_desc: "Індонезія є унікальною країною і не буде процвітати за традиційного капіталізму чи комунізму. Ми маємо створити систему змішаної економіки, з елементами як капіталізму, так і комунізму."
 INS_social_democracy: "Соціал-демократія"
 INS_social_democracy_desc: "Економіка [INS.GetAdjective] значно зросла з часу впровадження економічної політики Шаріра. Ми повинні оголосити Індонезію повністю соціал-демократичною державою і розробляти майбутню економічну політику на основі принципів соціал-демократії."

 # <Vice Presidential Edict - Sjarifuddin>
 INS_prime_minister_sjarifuddin: "Прем'єр-міністр Шаріфуддін"
 INS_prime_minister_sjarifuddin_desc: "Шаріфуддін є найкращим кандидатом для Індонезії, його поміркована політика дозволяє знайти компроміс між комуністами та соціалістами."
 INS_concessions_to_communists: "Поступки комуністам"
 INS_concessions_to_communists_desc: "PKI має значну кількість місць у парламенті, ми повинні надати кілька міністерських посад лідерам PKI, щоб забезпечити стабільність."
 INS_sjarifuddin_focus_2: "Експортна економіка з самоуправлінням"
 INS_sjarifuddin_focus_2_desc: "З нашою новою незалежністю ми маємо переглянути нашу експортну економіку та реорганізувати її таким чином, щоб більше не враховувалися голландські прибутки. Хоча економіка, заснована на експорті, все ще небезпечна, ми можемо зробити її набагато надійнішою, ніж у попередні роки."

 # <Vice Presidential Edict - Hatta>
 INS_prime_minister_hatta: "Прем'єр-міністр Хатта"
 INS_prime_minister_hatta_desc: "Мохаммад Хатта, відомий як проголошувач революції, служив віцепрезидентом при Сукарно і, як правило, був більш демократично налаштованим з них двох. Він стане підходящим Прем'єр-міністром, на якого зможе погодитися більшість політичних партій."
 INS_hatta_focus_2: "Наступні кроки"
 INS_hatta_focus_2_desc: "Революція закінчилася, і хоча певні політичні діячі наполягають, що революція має продовжуватися, ці голоси слід ігнорувати. Натомість ми маємо дивитися вперед, ми маємо розбудовувати Індонезію, щоб майбутні покоління жили в процвітанні."
 INS_hatta_princely_advisors: "Інтеграція князівських держав"
 INS_hatta_princely_advisors_desc: "Через нашу спільну різноманітність ми знаходимо єдність. Ми заснували нашу націю на цьому принципі, але кінець революції створив напругу для цієї ідеї через відсутність спільної боротьби. Аби запобігти обуренню та повстанням меншин, ми маємо створити додаткову раду, де місцеві правителі з князівських держав матимуть прямий вплив на національну політику."
 INS_prime_minister_tt: "Відбулися перші загальні вибори в Індонезії"

 # < Guided Democracy >
 INS_guided_democracy: "Declare Martial Law" # (!)
 INS_guided_democracy_desc: "It is now clear that the division of power through the formation of the National Committee was a mistake and has only resulted in instability. We mustn’t let this continue else we want another civil war. We must declare martial law and temporarily seize control over the committee until order is restored." # (!)
 INS_centralization: "Centralization" # (!)
 INS_centralization_desc: "Power will be centralized in Java with other islands having limited autonomy. All decisions must pass through Java to ensure order and stability. The President will oversee democracy." # (!)
 INS_abolish_national_committee: "Abolish National Committee" # (!)
 INS_abolish_national_committee_desc: "The National Committee will be abolished and replaced by a Working Committee serving underneath the presidency. The President will serve for life to maintain order. The Working Committee will be given more power slowly rather than all at once." # (!)
 INS_abolish_national_committee_tt: "Support for §Y[ROOT.GetNeutralParty]§! will be set to §Y100%§!." # (!)
 INS_pancasila_achieved: "Pancasila Achieved" # (!)
 INS_pancasila_achieved_desc: "When we founded this country, it was founded on the five principles of Pancasilia; Belief in the one and only god, just and civilized humanity, the unity of Indonesia, democratic life led by wisdom, and social justice for all the people of Indonesia. While we have not always successfully operated under these principles, we have finally achieved the unity envisioned by the original principles, and can officially begin the next phase of our Republic’s continued prosperity." # (!)
 INS_the_co_prosperity_sphere: "The Co-Prosperity Sphere" # (!)
 INS_the_co_prosperity_sphere_tt: "Unlocks decisions §Y$INS_request_membership$§! and §Y$INS_assume_complete_power$§! decision to flip the country and §Y$INS_sukarno$ Fascist§!." # (!)
 INS_the_co_prosperity_sphere_desc: "Though there is much opposition to cooperating with the Japanese, it is in our best interest during these unstable times to join forces with a stronger power to stand strong against the western allies." # (!)
 INS_strengthen_ins_jap_trade: "Strengthen [ROOT.GetAdjective]-[JAP.GetAdjective] Trade" # (!)
 INS_strengthen_ins_jap_trade_desc: "We should improve the trade relations between us and our new ally. If we sell our excess resources at drastically lower costs, we can prove our worthiness and gain additional bargaining power after the war." # (!)
 INS_seek_recognition_of_mal_claims: "Seek Recognition of Our Malay Claims" # (!)
 INS_seek_recognition_of_mal_claims_desc: "Malaya and North Borneo are of our origin, only divided by thin colonial borders. We should seek that [JAP.GetNameDef] recognizes our right to this territory and promises it to us once we have defeated Britain." # (!)
 INS_demand_northern_malay: "Demand Northern Malay" # (!)
 INS_demand_northern_malay_desc: "Northern Malay belongs today to Siam, despite being ethnically Malay. We will not tolerate a so-called “ally” occupying our territory, we must demand intervention from Japan." # (!)
 INS_siam_agreement: "The Siam Agreement" # (!)
 INS_siam_agreement_desc: "Siam is a weak nation unable to stand up for itself. We have proven our worthiness to Japan, and they have continued to fall to pressure. There is no doubt that we will all be better off if Siam becomes an Indonesian puppet." # (!)
 INS_local_autonomy: "Local Autonomy" # (!)
 INS_local_autonomy_industry_tt: "§Y1§! Civilian Factory is §Rremoved§! from §Y[1051.GetName]§!, §Y[335.GetName]§! and §Y[1058.GetName]§!.\n§Y1§! Civilian Factory is §Gadded§! to §Y4 random owned states§!." # (!)
 INS_local_autonomy_desc: "The many islands that encompass Indonesia have different cultures, languages, and needs. It is unreasonable to think that one government can successfully oversee them all. We will begin to reform Indonesia into a Federation, where each province has a significant degree of autonomy over itself." # (!)
 INS_union_of_ins_states: "Union of [ROOT.GetAdjective] Provinces" # (!)
 INS_union_of_ins_states_desc: "We should give provinces even more autonomy, reducing the role of the federal government to primarily inter-province and external affairs. We will elect a new federal President based on the wishes of the provinces. The local rulers will be free to form their own leadership structure as they choose." # (!)
 INS_union_of_ins_states_tt: "\nReleases §Y[ATJ.GetName]§!, §Y[BLI.Getname]§!, §Y[SSI.GetName]§!, §Y[TNE.GetName]§!, §Y[POK.GetName]§! and §Y[GOW.GetName]§! as §Y$autonomy_taog_indonesian_union_state$s§!." # (!)
 INS_indonesian_inter_province_trade_agreement: "[ROOT.GetAdjective] Inter-Province Trade Agreement" # (!)
 INS_indonesian_inter_province_trade_agreement_tt: "All §YIndonesian§! countries gain:" # (!)
 INS_indonesian_inter_province_trade_agreement_desc: "Trade between provinces must be quick and cheap. We will ensure it is almost always preferable to buy from and sell to another province rather than another country, through drastically reducing taxes on trade, and building new inter-province infrastructure." # (!)
 INS_expanding_the_union: "Expanding the Union" # (!)
 INS_expanding_the_union_desc: "The people of Northern Borneo have lived in tyranny for too long. We will utilize guerilla warfare in order to force the British to withdraw, allowing Brunei, Sabah, and the Raj of Sarawak to become provinces of Indonesia." # (!)
 INS_expanding_the_union_tt: "Unlocks decisions to start a §YLimited War§! for any states we do not yet control on §YBorneo§!." # (!)
 INS_dismantle_indonesia: "Dismantle [ROOT.GetName]" # (!)
 INS_dismantle_indonesia_tt: "§YDismantle the federation§! and choose which state to rule from. The remaining provinces will be set free." # (!)
 INS_dismantle_indonesia_desc: "We have tried many government types and they have all ended in instability. The revolution has ended, and the Dutch colonizers have been defeated, we are no longer required to stand together as one united front. We will dismantle the federation altogether, giving the local Sultans free reign to establish their own independent countries." # (!)
 INS_all_toward_the_war_effort: "All Toward the War Effort" # (!)
 INS_all_toward_the_war_effort_desc: "The Malay and [AST.GetAdjective] fronts led by us will dictate the outcome of Malay unity for years to come. We cannot spare any resources, everything must go to the brave soldiers fighting for Malay freedom." # (!)
 INS_enact_militarism: "Впровадження мілітаризму"
 INS_enact_militarism_desc: "Ми маємо засвоїти кілька уроків від [JAP.GetNameDefCap] та її мілітаристської політики. Прийняття подібних принципів піде на користь нашому новому уряду."
 INS_sukarnos_industrialization: "Посилення яванської промисловості"
 INS_sukarnos_industrialization_desc: "Промисловість Яви — це основа нашої економіки та армії. Усі дороги мають вести до Риму."
 INS_sukarnos_industrialization2: "Кожен має відігравати свою роль"
 INS_sukarnos_industrialization2_desc: "Військові зусилля — пріоритет номер один цієї нації, а тому пріоритет номер один кожного індонезійця — зробити свій внесок. Розкіш — це ворог, військово-промисловий комплекс має зростати."
 INS_japanese_military_lessons: "Японські військові уроки"
 INS_japanese_military_lessons_desc: "Ми маємо вивчити військові доктрини Японії і відповідно адаптувати нашу власну армію."

 # < Support Tan Malaka's Coup>
 INS_support_tan_malakas_coup: "Підтримка перевороту Тана Малаки"
 INS_support_tan_malakas_coup_desc: "Сукарно проголосив нашу незалежність, але він проявив себе як людина напівзаходів і дипломатичних поступок. Тан Малака та його організація Persatuan Perjuangan вимагають того, чого вимагає народ: стовідсоткової незалежності, ніяких переговорів, ніяких компромісів. Якщо Сукарно не хоче боротися за революцію в повному обсязі, то революція має знайти лідера, який буде."
 INS_minimum_program: "Програма-мінімум"
 INS_minimum_program_desc: "Persatuan Perjuangan висунула свої вимоги: народний уряд, народна армія та націоналізація всіх плантацій і промисловості, що належать іноземцям. Нам потрібні здібні люди, щоб просувати цю програму вперед. Нйоно виступає від імені робітників, Сетяджіт — від імені партійної інтелігенції. Разом вони подбають про те, щоб революція була організована від фабричних цехів до урядових кабінетів."
 INS_agrarian_reform: "Аграрна реформа"
 INS_agrarian_reform_desc: "Три століття земля Індонезії годувала плантації чужинців. Селяни, які її обробляли, мало що інше знали. Революція, яка залишає це незмінним, не є революцією взагалі. Ми доб'ємося, щоб земля перейшла до тих, хто її обробляє."
 INS_soviet_aid: "Радянська допомога"
 INS_soviet_aid_desc: "Радянський Союз визнав нашу революцію і готовий її підтримувати. Які б розбіжності не відокремлювали нашу програму від московської, ми не можемо дозволити собі відмовитися від того, що пропонується. Ми повинні взяти зброю і рухатися далі."
 INS_pacific_revolution: "Тихоокеанська революція"
 INS_pacific_revolution_desc: "Колоніальні держави не відступили з Азії, а лише з Індонезії. Старий порядок досі тримається в таких місцях, як Малайя та Філіппіни, і в кожному з них є чоловіки та жінки, які бажають його повалити. Наша революція дала нам і статус, і зобов'язання допомогти їм. Ми мусимо."
 INS_purge_oppurtunists_tt: "Відкриває §Y$INS_launch_revolution$§! у країнах із §Y60%§! або більше підтримки комуністів. Країни, в яких ми розпалюємо революції, стануть нашими §Yмаріонетками§!."
 INS_purge_oppurtunists: "Чистка опортуністів"
 INS_purge_oppurtunists_desc: "Муссо провів двадцять років у Москві, навчаючись приймати накази. Він повернувся з радянськими інструкціями в кишені і планом перетворити нашу республіку на маріонетку Комінтерну. Ми не для того скидали голландців, щоб ставати на коліна перед іншим іноземним господарем. Опортуністи, які продали б нашу революцію Москві, мають бути викорінені, а народи, які ми звільняємо, повинні дивитися на Джакарту, а не на Кремль."
 INS_the_maphilindo_speech: "The Maphilindo Speech" # (!)
 INS_the_maphilindo_speech_desc: "If a Betawi and Banjar person are both Indonesian despite cultural differences through their shared struggle against tyranny, then there is no reason a Malayan and Filipino are not also Indonesian. We must unite these lands as one unified state!" # (!)
 INS_the_maphilindo_speech_tt: "Allows coring and annexing §YMalay§! subjects" # (!)
 INS_pan_asian_union: "The Pan-Asian Union" # (!)
 INS_pan_asian_union_desc: "The pacific revolution is only beginning, and we are not yet safe. We must stand together and cooperate to protect each other from the great powers of the world. Together we are strong." # (!)
 INS_federation_of_aslia: "Федерація Аслії"
 INS_federation_of_aslia_trigger_tt: "Прийнято рішення §Y$form_maphilindo$§!"
 INS_federation_of_aslia_desc: "Нації, які ми звільнили, не повинні стояти наодинці. Тан Малака завжди уявляв собі щось більше, ніж одну республіку. Федерацію від материка до Тихого океану, об'єднану проти будь-якої колоніальної держави, яка наважиться повернутися. Ми запропонуємо їм повноправне членство в нашій державі."
 INS_aslia_tt: "Дозволяє зробити щитовими та анексувати §YТихоокеанських§! суб'єктів"
 INS_pan_economic_area: "The Pan-Asian Economic Area" # (!)
 INS_pan_economic_area_desc: "Economic cooperation within the union is essential for our shared prosperity. We must facilitate duty-free trade between all member states to reduce our reliance on outside nations." # (!)
 INS_pan_economic_area_tt: "All faction members that are a subject of §Y[ROOT.GetNameDef]§!" # (!)
 INS_musso_ascends: "Піднесення Муссо"
 INS_musso_ascends_tt: "Відкриває §Y$INS_launch_revolution$§! у країнах із §Y30%§! або більше підтримки комуністів. Країни, в яких ми розпалюємо революції, залишаться незалежними."
 INS_musso_ascends_desc: "Тан Малака — мрійник. Муссо приносить те, чого не можуть мрійники: повну підтримку Радянського Союзу та солідарність міжнародного комуністичного руху. Наша революція не обов'язково повинна стояти наодинці."
 INS_utilize_comintern_connections: "Utilize Comintern Connections" # (!)
 INS_utilize_comintern_connections_desc: "Musso’s connections with high-ranking comintern officials makes the process of joining the comintern easy. We should send him to [SOV.GetNameDef] to negotiate without delay." # (!)
 INS_united_against_japan: "United against [JAP.GetNameDef]" # (!)
 INS_united_against_japan_desc: "While nobody is keen on siding with the Allies, and the scar left by the Dutch is not forgotten, we must temporarily put aside our differences to fight against our mutual enemy, else we risk another overlord taking over [ROOT.GetName]." # (!)
 INS_revolutionary_economic_cooperation: "Revolutionary Economic Cooperation" # (!)
 INS_revolutionary_economic_cooperation_desc: "We have saved the lives of many millions who no longer live under tyranny. Now, we must build together. Through cooperation and trade, we can forge strong economies and armies, protecting us from foreign powers for years to come." # (!)
 INS_revolutionary_economic_cooperation_tt: "Gains §Y$INS_revolutionary_economic_cooperation_modifier$§! which grants:\n§Y4%§! Stability §Yper Country§! that we have §Ystarted a revolution in§!\n§Y4%§! Construction Speed §Yper Country§! that we have §Ystarted a revolution in§!\n§Y4%§! Political Power Gain §Yper Country§! that we have §Ystarted a revolution in§!\n§Y-4%§! Consumer Goods §Yper Country§! that we have §Ystarted a revolution in§!\n\nCurrently we have started revolutions in §Y[?INS_communist_revolts_succeeded]§! countries." # (!)
 INS_soviet_economic_integration: "Радянська економічна інтеграція"
 INS_soviet_economic_integration_desc: "Революція дала нам свободу, але сама по собі свобода не будує фабрик і не годує маси. Радянський Союз пропонує те, чого не запропонує жодна капіталістична держава: промисловий досвід, кредити на розвиток і торгівлю на умовах, які не супроводжуються колоніальними ниточками. Ми були б дурнями, якби відмовилися."
 INS_the_three_year_plan: "The Three Year Plan" # (!)
 INS_the_three_year_plan_desc: "We will declare a three year plan for our economy, which will guide us long-term and reduce time spent on bureaucracy." # (!)
 INS_the_three_year_plan_tt: "The §YNational Spirit§! Will improve by §G1%§! every month until reaching it's full potential at §Y26%§!." # (!)
 INS_realign_export_markets: "Realign Export Markets" # (!)
 INS_realign_export_markets_desc: "We must strengthen our global trade relations, reducing our dependency on a few major powers. Instead, we should make many, smaller trades with smaller nations & companies." # (!)
 INS_divert_javanese_education_funding_the_east: "Divert Javanese Education Funding East" # (!)
 INS_divert_javanese_education_funding_the_east_desc: "There is no question that the former colonial overlords invested only in the growth of Java and resource-rich parts of Sumatra, while leaving the rest of the colony to rot. We can right this wrong by taking parts of Java’s education budget and reallocating it to build new schools in the east." # (!)
 INS_eastern_universities: "Eastern Universities" # (!)
 INS_eastern_universities_desc: "By building new universities in the east, higher education will be available to more citizens, and students will be encouraged to move from Java to attend far-away schools, reducing the cultural divide between Java and the rest of [ROOT.GetName]." # (!)

 # <National Revolution - Reasserting Control>
 INSHOL_revolution_ongoing_tt: "Індонезійська революція триває"

 INSHOL_reasserting_control: "Відновлення контролю над Ост-Індією"
 INSHOL_reasserting_control_desc: "Ми не можемо сидіти склавши руки та дивитися, як ці опортуністи намагаються зруйнувати те, що ми будували століттями, одночасно руйнуючи нашу інфраструктуру та радикалізуючи молодь. Ми маємо діяти!"
 INSHOL_request_british_support: "Запит британської підтримки"
 INSHOL_request_british_support_desc: "[ENG.GetNameDefCap], як ще одна колоніальна держава, швидше за все, з розумінням поставиться до нашої ситуації, особливо зважаючи на те, що якщо революціонери досягнуть успіху, це може викликати ефект доміно у східній Азії. Ми повинні попросити їх про економічну та військову допомогу."

 INS_eng_treaty_holside_tt: "§Y[ENG.GetNameDefCap]§! офіційно оголосить про свою підтримку на нашому боці конфлікту та надасть суттєву допомогу. Якщо війна закінчиться перемогою, §Y[ENG.GetNameDefCap]§! матиме право на Борнео."
 INS_eng_treaty_engside_tt: "Ми офіційно об'єднаємося з §Y[HOL.GetNameDefCap]§! у конфлікті в Ост-Індії. Якщо §Y[HOL.GetNameDefCap]§! переможе, ми матимемо право власності на Борнео."
 INS_fra_treaty_holside_tt: "§Y[FRA.GetNameDefCap]§! офіційно оголосить про свою підтримку на нашому боці конфлікту та надасть суттєву допомогу. Якщо війна закінчиться перемогою, §Y[FRA.GetNameDefCap]§! матиме право на північно-східну Суматру."
 INS_fra_treaty_fraside_tt: "Ми офіційно об'єднаємося з §Y[HOL.GetNameDefCap]§! у конфлікті в Ост-Індії. Якщо §Y[HOL.GetNameDefCap]§! переможе, ми матимемо право власності на північно-східну Суматру."

 INSHOL_franco_dutch_accord: "Франко-голландська угода"
 INSHOL_franco_dutch_accord_desc: "Незважаючи на те, що наші солдати краще екіпіровані та організовані, ніж республіканські ополчення, їхня переважна чисельність повернула конфлікт проти нас. Для забезпечення перемоги нам потрібна підтримка ззовні, більша, ніж більшість готова дати. Франція може погодитися втрутитися, якщо ми запропонуємо їй територію в Ост-Індії для розширення їхньої присутності в Тихому океані."
 INSHOL_london_batavia_accord: "Лондонсько-батавійська угода"
 INSHOL_london_batavia_accord_desc: "Незважаючи на те, що наші солдати краще екіпіровані та організовані, ніж республіканські ополчення, їхня переважна чисельність повернула конфлікт проти нас. Для забезпечення перемоги нам потрібна підтримка ззовні, більша, ніж більшість готова дати. [ENG.GetNameDefCap] може бути зацікавлена через свою присутність у Малайї. Можливо, їх вдасться переконати, якщо ми запропонуємо щось натомість?"
 INSHOL_australian_divisions: "Відправка австралійської піхоти на Яву"
 INSHOL_australian_divisions_desc: "Відповідно до Лондонсько-Батавійської угоди, Британія зобов'язана надіслати додаткові дивізії до Ост-Індії через Австралію після нашого запиту, оскільки близькість Австралії до Ост-Індії робить їх ідеальними кандидатами для розміщення військової бази за межами самої Ост-Індії."
 INSHOL_indian_divisions: "Дивізії Британської Індійської армії"
 INSHOL_indian_divisions_desc: "Хоча Британія, швидше за все, не захоче посилати власних людей до Ост-Індії, переконати її надіслати індійські дивізії набагато легше, особливо через їхню близькість до Батавії."
 INSHOL_undermine_the_militias: "Підрив ополчень"
 INSHOL_undermine_the_militias_desc: "ЗМІ перебільшують серйозність цієї ситуації, ополчення — це лише група повсталої молоді, яка намагається досягти чогось недосяжного. Нам не потрібно спрямовувати всі наші ресурси на їх зупинку, ми маємо просто тримати лінію і чекати, поки вони втомляться."
 INSHOL_flag_will_fly_again: "Прапор замайорить знову"
 INSHOL_flag_will_fly_again_desc: "Голландський прапор майорів в Ост-Індії століттями, немає світу, в якому ми б дозволили його спустити. Якщо для збереження нашої коронної колонії потрібно надіслати танки та бомбардувальники, то їх буде надіслано!"
 INSHOL_flag_will_fly_again_tt: "§YПісля закінчення революції дух буде видалено, а зміни правил скасовано.§!"

 # <National Revolution - Escalation>
 INSHOL_mass_mobilization: "Масова мобілізація"
 INSHOL_mass_mobilization_desc: "Ми не зможемо виграти цей конфлікт і розгромити Республіку без добре оснащеної армії. Ми маємо переозброїти Ост-Індію та перенаправити фінансування з цивільних секторів до KNIL."
 INSHOL_batavia_storm_operation: "Штурм Батавії"
 INSHOL_instigate_infighting: "Спровокувати міжусобиці в Республіці"
 INSHOL_ultimatum_to_republic: "Ультиматум Республіці"
 INSHOL_comite_rijkseenheid: "Комітет державної єдності (Comité Rijkseenheid)"
 INSHOL_comite_rijkseenheid_desc: "Прапор в Ост-Індії спускають, але люди просто дивляться, як це відбувається. Ми не можемо цього дозволити, ми маємо переконати адміністрацію Ост-Індії, що голландський народ хоче, щоб революція була зупинена!"

 INSHOL_increase_esclation_placeholder: "Швидка ескалація"
 INSHOL_increase_esclation_placeholder_desc: "Наші ополченці взяли під контроль багато життєво важливих портів, міст і промислових центрів. Ми не будемо продовжувати чекати дій Нідерландів, ми самі закличемо до великого військового наступу!"
 INS_take_batavia_explination_tt: "Якщо ми успішно окупуємо всю Яву, ми зруйнуємо колоніальний уряд зсередини та §Gвиграємо війну§!. Однак, якщо нам не вдасться зробити це протягом §Y730 днів§!, ми §Rзагинемо§!."

 INSHOL_linggadjati_agreement: "Переговори про угоди про припинення вогню"
 INSHOL_linggadjati_agreement_desc: "Вторгнення на Яву виявилося складним, а наша адміністрація стає нестабільною. Ми маємо відступити і діяти від оборони, щоб не ризикувати падінням усієї Республіки. Ми повинні домовитися про локальні припинення вогню з Нідерландами, що дозволить нам реорганізувати наші сили, перш ніж знову зосередитися на Яві."
 INSHOL_increase_esclation_placeholder_tt: "Відкриває §YРішення§! вести переговори щодо локального припинення вогню та §Yзбільшує таймер§! для окупації Яви."

 # <National Revolution - Peace Negotiation>
 INSHOL_seek_foreign_help: "Шукати іноземної допомоги"
 INSHOL_seek_foreign_help_desc: "Ні для кого не секрет, що спроба виграти війну проти сильно індустріалізованої колоніальної держави в якості новоствореної нації без усталеної економіки є майже нездійсненним завданням. Ми маємо звернутися до інших країн, які підтримують нашу справу, щоб дізнатися, чи готові вони нам допомогти."
 INSHOL_renville_agreement: "Ренвільська угода"
 INSHOL_renville_agreement_desc: "Безпрецедентна агресія Нідерландів привернула міжнародну увагу до революції, і все ж Нідерланди продовжують порушувати перемир'я та провокувати нас на реакцію. Ми маємо спробувати зателефонувати [USA.GetNameDef], бо якщо ми переконаємо їх заступитися за Індонезію, Нідерландам не залишиться нічого іншого, як відступити."
 INSHOL_no_compromise: "Ніяких компромісів, ніякої капітуляції"
 INSHOL_no_compromise_desc: "Голландська жадібність, яка змусила їх інвестувати майже виключно в Яву, ігноруючи східні острови, залишила Яву ахіллесовою п'ятою всієї колонії. Це стане їхнім крахом!"
 INSHOL_end_to_bloodshed: "Рішення про дві держави"
 INSHOL_end_to_bloodshed_desc: "Цей конфлікт триває вже занадто довго, з незначним прогресом у будь-якому напрямку, лише забираючи більше життів щодня. Ніхто не хоче, щоб це продовжувалося, настав час поговорити з голландськими лідерами за столом переговорів."
 INSHOL_reorganize_colonies: "Реорганізація колонії"

 INS_we_will_need_another_tt: "Оскільки ми вже контролюємо всю Яву, нам потрібно буде контролювати ще один регіон на додаток до Яви."

 # Industry Branch - New
 INS_centralize_the_state: "Централізація держави"
 INS_centralize_the_state_desc: "Від Суматри до Сулавесі, від Борнео до Банки, наші програми розвитку принесли дороги, фабрики та інституції на території, якими [1058.GetName] колись керував лише номінально. Ці регіони більше не є далекими провінціями. Вони є [INS.GetNameDefCap]."
 INS_centralize_the_state_1_tt: "Необхідні регіони, які є §Yнаціональними§!:"
 INS_centralize_the_state_2_tt: "Необхідні регіони, які є §Yненаціональними§!:"
 INS_fate_of_de_javasche_bank: "[INS_fate_of_de_javasche_bank_scripted_name]"
 INS_fate_of_de_javasche_bank_scripted_name_colony: "Доля De Javasche Bank"
 INS_fate_of_de_javasche_bank_scripted_name_independent: "Доля Bank Indonesia"
 INS_fate_of_de_javasche_bank_desc: "[INS_fate_of_de_javasche_bank_scripted_desc]"
 INS_fate_of_de_javasche_bank_scripted_desc_colony: "Гульден Ост-Індії перебуває у вільному падінні відтоді, як вибухнула депресія, і De Javasche Bank бракує інструментів, щоб зупинити цей спад. Ми повинні вирішити, як стабілізувати нашу валюту, перш ніж залишки довіри інвесторів випаруються остаточно."
 INS_fate_of_de_javasche_bank_scripted_desc_independent: "Ми успадкували валюту в стані кризи. Старий колоніальний гульден уже падав, а перехід на рупію ніяк не стабілізував ринки. Банку Індонезії потрібен чіткий курс від уряду, інакше наша молода економіка постраждає від цього."

 INS_finish_the_bauxite_project: "Завершити проєкт Банка"
 INS_finish_the_bauxite_project_desc: "Тепер, коли нові дороги, порти та залізниці запрацювали по всьому Банка-Белітунгу, геологорозвідувальні групи повідомляють про поклади вольфраму та хрому, які перевершують наші початкові очікування. Ці острови ще доведуть свою повну цінність для республіки."
 INS_australian_contracts: "Австралійські контракти"
 INS_australian_contracts_desc: "Наші запаси каучуку зросли далеко за межі внутрішніх потреб. Австралія, завжди голодна до сировини для забезпечення власної промисловості, є природним торговельним партнером. Закріплення довгострокових контрактів з австралійськими фірмами принесе стабільний дохід і зміцнить наші позиції в регіональній економіці."
 INS_coopereate_with_chinese_businessmen: "Співпраця з китайськими бізнесменами"
 INS_coopereate_with_chinese_businessmen_desc: "Заможний і добре пов'язаний купецький клас здавна сприяв торгівлі по всьому архіпелагу. Замість того, щоб усувати ці налагоджені мережі, ми повинні працювати з ними. Їхній капітал і комерційний досвід можуть виявитися неоціненними для виведення нашої економіки з нинішнього застою."

 INS_oil_decisions_unlock_tt: "Відкриває нові рішення §Y$INS_realign_supply_chains_cat$§! для продажу §YНафти§!."
 INS_negotiate_new_contracts_unlock_tt: "Відкриває нові рішення §Y$INS_realign_supply_chains_cat$§!."
 INS_realign_supply_chains_explain_tt: "Відкриває рішення §Y$INS_realign_supply_chains_cat$§! для продажу ресурсів приватним компаніям в оренду на 2 роки."

 INS_negotiate_new_contracts: "Переговори про нові контракти"
 INS_negotiate_new_contracts_desc: "Наша репутація надійного постачальника, що постійно зростає, відкрила двері, які раніше були зачинені для нас. Нові покупці кружляють навколо, і ми повинні діяти швидко, щоб залучити їх до довгострокових угод, перш ніж наші конкуренти зможуть перехопити ініціативу."
 INS_all_in_on_rubber: "Усе на каучук"
 INS_all_in_on_rubber_desc: "Каучук — це наша найсильніша карта, і ми маємо намір нею зіграти. Кожен доступний акр плантацій буде відданий під вирощування каучуку, а наш експортний апарат буде реорганізовано, щоб переміщати його швидше і дешевше, ніж будь-хто інший в регіоні."
 INS_more_market_resources: "Перепродати Велику Депресію"
 INS_more_market_resources_desc: "Світ може загрузнути в економічній кризі, але криза породжує можливості для тих, хто достатньо сміливий, щоб ними скористатися. Наводнивши ринок нашими товарами за цінами, з якими не зрівняється жоден конкурент, ми гарантуємо, що коли світ відновиться, індонезійські товари вже будуть на кожній полиці та на кожному складі."

 # <Industry Branch - Trade Policy>
 INS_recovering_from_the_great_depression: "Відновлення після Великої депресії"
 INS_recovering_from_the_great_depression_desc: "Велика депресія мала руйнівний вплив на [INS.GetNameDef]. Оскільки наша економіка орієнтована переважно на експорт, протекціонізм у всьому світі підірвав наші сили. Зараз, коли світова торгівля, схоже, готова знову відкритися, ми повинні шукати нові ринки та працювати над відновленням наших старих торговельних шляхів."
 INS_first_come_first_serve: "Хто перший встиг, той перший взяв"
 INS_first_come_first_serve_desc: "Хоча протекціонізм часів Великої депресії слабшає, зростання виробництва та переоцінений гульден залишили голландський експортний ринок у руїнах, оскільки наші старі торговельні партнери на заході звернулися до Південної Америки для задоволення свого попиту. Замість того, щоб переслідувати їх заради нових торговельних угод, ми могли б використати це як можливість для виходу на нові ринки в Азії."
 INS_oil_export: "Збільшення експорту нафти"
 INS_oil_export_desc: "Ми покращимо нафтову інфраструктуру на Суматрі та Калімантані, щоб забезпечити торговельні угоди з нашими новими торговельними партнерами."
 INS_increased_trade_with_japan: "Збільшення торгівлі з Японією"
 INS_increased_trade_with_japan_desc: "[JAP.GetNameDefCap] стає дедалі ціннішим торговельним партнером і жодного разу нас не підвів. Ми повинні домовитися про нові торговельні угоди для подальшого економічного співробітництва між нашими двома країнами та допомогти собі скинути пута Великої депресії. Це може засмутити наших союзників на Заході, особливо Нідерланди. Однак, якщо ми хочемо колись мати право вирішувати власну долю, нам потрібно забезпечити власні торговельні зв'язки."
 INS_asian_trade_investments: "Азійські торговельні інвестиції"
 INS_asian_trade_investments_desc: "Руйнівні наслідки Великої депресії показали нам, наскільки надмірною була наша залежність від наших довгострокових торговельних партнерів на заході. Оскільки наша економіка орієнтована переважно на експорт, зараз як ніколи важливо розвивати та розширювати нові ринки в Південно-Східній Азії, щоб наша економіка не залежала від якоїсь окремої країни."
 INS_asian_trade_investments_tt: "Кожні §Y420§! днів штраф до ринкових ресурсів від §YВеликої депресії§! буде §Gпокращуватися§! на §Y5%§!, доки негативні модифікатори не зникнуть."
 INS_declare_free_trade: "Оголосити вільну торгівлю"
 INS_declare_free_trade_desc: "Ми не повинні орієнтуватися виключно на одну країну, ми дозволимо ринку природним чином приймати найкращі рішення для [INS.GetNameDef]."
 INS_japanese_export_contracts: "Один торговий контракт, щоб правити всіма"
 INS_japanese_export_contracts_desc: "Ми укладемо велику торговельну угоду з [JAP.GetNameDef], продаючи весь каучук у [1049.GetName] та [672.GetName]. Хоча ми продаватимемо його за дуже низькою ціною, нам буде гарантовано, що все буде продано."
 INS_realign_supply_chains: "Переорієнтація ланцюжків постачання"
 INS_realign_supply_chains_desc: "Хоча протекціонізм часів Великої депресії слабшає, зростання виробництва та переоцінений гульден залишили голландський експортний ринок у руїнах, оскільки наші старі торговельні партнери на заході звернулися до Південної Америки для задоволення свого попиту. Ми повинні вжити заходів, щоб переконати наших союзників знову почати торгувати з нами."
 INS_invite_foreign_companies: "Підтримка американських нафтових підприємств"
 INS_invite_foreign_companies_desc: "З 1930 року Standard Oil California працює в нашій країні через свою голландську дочірню компанію Nederlandsche Pacific Petroleum Maatschappij. Їхні дослідження в Ріуві є багатообіцяючими, ми повинні підтримати їхні видобувні операції будь-яким можливим способом — велике відкриття одночасно збільшить наші доходи та заохотить інші міжнародні компанії інвестувати в нашу країну."
 INS_expand_sea_routes: "Розширення морських шляхів"
 INS_expand_sea_routes_desc: "Наша країна багата на природні ресурси, але наша видобувна промисловість занадто спеціалізована, і нам бракує інфраструктури, необхідної для видобутку деяких рідкісних мінералів, таких як хром і вольфрам. Якщо ми хочемо покращити наші можливості військового виробництва, нам потрібно буде імпортувати їх з інших місць. Щоб повною мірою скористатися перевагами нашої торговельної мережі, яка постійно зростає, нам потрібно буде збільшити потужність нашого торговельного флоту."
 INS_ship_contracts: "Забезпечити суднобудівні контракти"
 INS_ship_contracts_desc: "Побудова військово-морського флоту необхідна для підтримки наших торговельних шляхів у разі війни. Ми можемо використовувати наші нові торговельні відносини для отримання військово-морських контрактів."

 # <Industry Branch - Sumatra>
 INS_developing_sumatra: "Розвиток Суматри"
 INS_developing_sumatra_desc: "Суматра — найбагатший на ресурси острів архіпелагу, проте інфраструктура там настільки слабка, що величезна частка видобутих ресурсів навіть не доходить до Батавії. Транспорт покладається на клаптики ґрунтових доріг і незв'язані залізничні лінії, що абсолютно недостатньо для підтримки наших планів щодо острова. Ми не можемо дозволити цьому продовжуватися."
 INS_sumatra_railway: "Суматранська залізниця"
 INS_sumatra_railway_desc: "В рамках наших постійних зусиль із розвитку інфраструктури Суматри нам слід побудувати велику залізницю, що простягнеться від північного Ачеху до найпівденнішого порту Суматри, який дуже швидко з'єднується з Батавією кораблем. Таким чином, ресурси потрібно буде транспортувати лише до найближчої залізничної станції, після чого ми зможемо доставити їх до Батавії за лічені дні."
 INS_develop_borneo: "Розвиток Калімантану"
 INS_develop_borneo_desc: "Калімантан має потенціал для отримання величезних багатств, проте острів розвинений дуже слабо, а його населення потерпає від бідності. Перевезення вантажів значною мірою залежить від численних річок та водних шляхів острова, а будь-який зв'язок на великі відстані ускладнюється відсутністю електроенергії. Прокладаючи лінії електропередач та дороги, ми можемо прокласти шлях для майбутніх досліджень та видобутку ресурсів."
 INS_kalimantan_mic: "Військова промисловість Калімантану"
 INS_kalimantan_mic_desc: "Наші зусилля з розвитку інфраструктури на Калімантані принесли свої плоди. Поширення електрики та зв'язку зблизило нас із громадами, які раніше перебували далеко за межами досяжності уряду. Ми можемо скористатися цією можливістю для задоволення наших потреб у збільшенні військового виробництва, побудувавши нові заводи в регіоні та укомплектувавши їх цією новою робочою силою."
 INS_pontianak_to_balikpapan: "Від Понтіанака до Танджунгселора"
 INS_pontianak_to_balikpapan_desc: "Ідея будівництва залізниці на Калімантані обговорювалася детально, але суворий, здебільшого недосліджений ландшафт у центрі острова робить це складним завданням. Єдине рішення — U-подібна залізниця від узбережжя до узбережжя. Це буде недешево, але в довгостроковій перспективі це окупиться."
 INS_develop_sulawesi: "Розвиток Сулавесі"
 INS_develop_sulawesi_desc: "Сулавесі є центром архіпелагу і тому є важливим стратегічним місцем. Ми повинні побудувати дороги, лінії електропередач та зв'язок, щоб у разі війни його можна було використовувати як військовий вузол."

 # <Industry Branch - Bangka Project>
 INS_the_bangka_project: "Проєкт Банка"
 INS_the_bangka_project_desc: "Острови Банка-Белітунг, хоч і малі, є наріжним каменем індонезійської економіки завдяки покладам бокситів на островах. Нам необхідно побудувати дороги, порти та залізниці на Банка-Белітунгу, щоб ми могли повною мірою скористатися багатими мінеральними ресурсами островів."
 INS_aluminium_factory: "Алюмінієва фабрика Панкалпінанга"
 INS_aluminium_factory_desc: "Наш видобуток сирих бокситів зростає, але відсутність внутрішнього виробництва алюмінію обмежує наші прибутки. Як провінційна столиця островів Банка-Белітунг, Панкалпінанг був би ідеальним місцем для створення власних заводів. Це дозволить нам виключити посередників і максимізувати наші доходи."
 INS_bauxite_export: "Подвоїти експорт бокситів"
 INS_bauxite_export_desc: "Завершення проєкту Банка залишило нас із більшою кількістю сирих бокситів, ніж ми знаємо, що з ними робити. Спроба продати все це була б важкою, але ми могли б запропонувати значно нижчу ціну за боксити, ніж будь-хто інший на ринку, гарантуючи, що кожен грам буде продано. Через величезну кількість бокситів, яку ми можемо продати, це все одно принесе пропорційне зростання прибутку порівняно з нашим поточним експортом."
 INS_tin_mining: "Інвестиції у видобуток олова"
 INS_tin_mining_desc: "Історія видобутку олова на островах Банка-Белітунг передує європейській присутності на архіпелазі. Тому не дивно, що олов'яна промисловість на островах давно потребує модернізації. Модернізація виробничих потужностей є дорогою справою, і наша існуюча олов'яна промисловість не працюватиме деякий час, поки ми її перебудовуємо. Однак існує значний потенціал для довгострокового прибутку."
 in_240_days_tt: "§YЧерез 240 днів:§!\n"
 INS_tin_to_usa: "Продати олово до [USA.GetNameDef]"
 INS_tin_to_usa_desc: "[USA.GetNameDefCap] сповнена корпорацій та урядових установ, що закуповують олово. Тепер, коли у нас є належна видобувна операція, ми маємо можливість отримати великий прибуток."
 INS_tin_to_japan: "Продати олово до [JAP.GetNameDef]"
 INS_tin_to_japan_desc: "[JAP.GetNameDefCap] має багато кораблів, які зараз вважаються застарілими та підлягають заміні, незважаючи на те, що вони ідеально підходять для флоту [INS.GetAdjective]. Ми повинні придбати ці кораблі за гроші від нашого виробництва олова."
 INS_tin_to_japan_tt: "[JAP.GetNameDefCap] відправить нам §Y9§! застарілих есмінців."
 INS_new_bauxite_routes: "Нові бокситові шляхи"
 INS_new_bauxite_routes_desc: "Наша стратегія заниження цін на ринку з метою збільшення обсягів експорту бокситів виявилася успішною, і ми суттєво збільшили наш загальний дохід. Проте ми не повинні зупинятися на досягнутому. Ми повинні продовжувати розширювати наші торговельні мережі, оптимізувати ланцюжки постачання та шукати будь-які інші можливості для максимізації прибутків."
 INS_bangka_bauxite_export_flag: "Завершено фокус §Y$INS_bauxite_export$§!:"
 INS_not_industry: "План на майбутнє"
 INS_not_industry_desc: "Ява — це б'юче серце нашої нації, де проживає більша частина нашого населення та розташований уряд. Перш ніж ми зможемо розпочати серйозну індустріалізацію острова, ми повинні спочатку підготувати ґрунт. Геодезичні дослідження, виділення зон та очищення ділянок гарантують, що коли заводи з'являться, вони будуть побудовані там, де принесуть найбільшу користь."
 INS_construction_focus: "Промисловий бум"
 INS_construction_focus_desc: "Іноземний капітал тече рікою, експортні доходи зростають, і вперше за багато років з'явилися реальні гроші для інвестування у вітчизняну промисловість. Ми повинні ловити момент і будувати, поки умови сприяють нам."

 # <Industry Branch - Java>
 INS_developing_java: "Розширення інфраструктури Яви"
 INS_developing_java_desc: "Ява є найбільш індустріалізованим островом на архіпелазі та джерелом більшої частини нашого багатства. Однак деякі міста, такі як Батавія, стають дедалі перенаселенішими через зростання кількості населення. Ми повинні розширити ці міста новими будинками, комерційними зонами, трамваями, поїздами та заводами, щоб підтримати зростаюче населення."
 INS_prioritize_sugar_economy: "Пріоритет цукрової економіки"
 INS_prioritize_sugar_economy_desc: "Ми повинні скоротити наш урядовий бюджет на промисловий розвиток Батавії; вона і так набагато більш індустріалізована, ніж будь-яке інше місто на архіпелазі. Замість цього ми повинні використати ці гроші для створення багатьох невеликих пальмових плантацій по всій країні. Ці плантації вироблятимуть пальмовий цукор, який є товаром з високим міжнародним попитом."
 INS_all_cards_into_industry: "Усі карти в промисловість"
 INS_all_cards_into_industry_desc: "Індустріалізація мала величезний вплив на економіку [1058.GetName]. Якщо ми індустріалізуємо весь острів з його десятками мільйонів громадян, ми зможемо стати впливовими у глобальному масштабі."
 INS_expand_batavia_technical_institute: "Розширити Технологічний інститут Батавії"
 INS_expand_batavia_technical_institute_desc: "Розширення Технологічного інституту Батавії дозволить більшій кількості студентів здобути освіту та збільшить темпи нашого технологічного розвитку."
 INS_quinine_export: "Більш вигідна угода про хінін"
 INS_quinine_export_desc: "Хінінове бюро в Амстердамі має майже повну монополію на експорт хініну, що є особливо прибутковим, оскільки хінін користується великим попитом у всьому світі як засіб лікування малярії. Бюро отримує більшу частину свого хініну з Ост-Індії. Незважаючи на це, ми отримуємо дуже малу частину прибутку. Ми повинні використати наше виробництво хініну як важіль для ведення переговорів про більш справедливу угоду."
 INS_spend_profits_on_rural: "Витрачати прибутки на розвиток сільських територій"
 INS_spend_profits_on_rural_desc: "Після остаточного узгодження нашої нової угоди про хінін, ми отримуємо можливість використати наш додатковий дохід для розвитку транспортної та комунікаційної інфраструктури в сільській місцевості, прокладаючи шлях для майбутнього промислового розвитку."
 INS_spend_profits_on_urban: "Витрачати прибутки на міський розвиток"
 INS_spend_profits_on_urban_desc: "Після остаточного узгодження нашої нової угоди про хінін, ми отримуємо можливість використати наш додатковий дохід для розширення виробничої промисловості Батавії, що диверсифікує нашу економіку та зменшить нашу залежність від експорту сировини."
 INS_spend_profits_on_military: "Витрачати прибутки на військовий розвиток"
 INS_spend_profits_on_military_desc: "Після остаточного узгодження нашої нової угоди про хінін, ми отримуємо можливість значно покращити нашу армію, витративши наш додатковий дохід на будівництво та обслуговування нових збройових заводів у Джок'якарті та Семаранзі."

 INS_end_to_bloodshed_tt: "Війна закінчиться з новими кордонами, проведеними на основі поточної окупації. Ява, Суматра та Борнео будуть §Yанексовані§! тією стороною, яка наразі має найбільший контроль у цьому регіоні."
