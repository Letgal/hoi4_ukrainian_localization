 ABDA_ship_a_day_modifier_tt: "Змінює §Y$ABDA_supreme_command$§! на:\n §G+10%§! Атака підводних човнів\n §G+10%§! Захист підводних човнів"
 ABDA_keep_trade_open_modifier_tt: "Змінює §Y$ABDA_supreme_command$§! на:\n §G+10%§! Ефективність прикриття\n §G+10%§! Захист прикриття"
 ABDA_unified_naval_command_modifier_tt: "Змінює §Y$ABDA_supreme_command$§! на:\n §G+10%§! Приріст досвіду кораблів"
 ABDA_develop_naval_infrastructure_ast_tt: "[AST.GetName] отримує §Y2 верфі§! у національному регіоні."
 ABDA_develop_naval_infrastructure_ins_tt: "[INS.GetName] отримує §Y2 верфі§! у національному регіоні."
 ABDA_develop_naval_infrastructure_generic_tt: "Залежно від складу §YABDACOM§!, [AST.GetName] та [INS.GetName] можуть отримати по 2 верфі у своїх національних регіонах."
 ABDA_expand_the_command_tt: "Розширює членство в ABDACOM на [SIA.GetName], [NZL.GetName] та [MAL.GetName], якщо вони знаходяться в нашому альянсі, надаючи їм повний модифікатор §Y$ABDA_supreme_command$§! з його поточною силою."
 ABDA_naval_procurement_ins_ships_tt: "[INS.GetName] отримає §Y6 есмінців класу Clemson§!, переданих з [USA.GetAdjective] резервних флотів."
 ABDA_naval_procurement_hol_ships_tt: "[HOL.GetName] отримає §Y6 есмінців класу Clemson§!, переданих з [USA.GetAdjective] резервних флотів."
 ABDA_naval_procurement_ast_ships_tt: "[AST.GetName] отримає §Y6 есмінців класу Clemson§!, переданих з [USA.GetAdjective] резервних флотів."
 ABDA_naval_procurement_generic_tt: "Залежно від складу §YABDACOM§!, [INS.GetNameDef], [HOL.GetNameDef] та [AST.GetNameDef] можуть отримати по §Y6 есмінців класу Clemson§!, переданих з [USA.GetAdjective] резервних флотів."
