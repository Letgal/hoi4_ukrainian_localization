 SIA_release_contigency_funds_tt: "Модифікує §Y$idea_SIA_contingency_funds$§! на\n"
 SIA_release_contigency_funds_tt2: "протягом §Y[?var:SIA_contingency_funds]§! місяців. По завершенні фонди зникнуть. Чим довше ми збираємо кошти в мирний час, тим довше фонд діятиме у воєнний час."
