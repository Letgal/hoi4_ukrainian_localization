 HOL_recall_conrad_helfrich: "Відкликати Конрада Гелфріха з Ост-Індії"
 HOL_recall_conrad_helfrich_desc: "У ці скрутні часи ми повинні ставити батьківщину понад усе. Конрад Гелфріх, як найкращий адмірал Королівського флоту Нідерландів, має повернутися до Нідерландів."
 INS_is_taking_volksraad: "Зараз приймає закон у Фольксрааді"
 INS_volksraad_cat: "Фольксраад"
 INS_volksraad_cat_desc: "Народна рада, відома нідерландською як Фольксраад, була заснована у 1918 році як спроба принести демократію в Ост-Індію в рамках впровадження так званої «Етичної політики». Місця займають як нідерландські, так і індонезійські чиновники, обрані різними шляхами. Хоча Нідерланди зберігають безумовне право вето, Фольксраад може подавати пропозиції та законопроєкти на розгляд уряду."
 INS_volksraad_allow_language_in_schools: "Дозволити індонезійську мову в школах"
 INS_volksraad_allow_language_in_schools_desc: "Доступ до вищої освіти в Ост-Індії значною мірою обмежений нідерландцями та заможними класами індонезійців, які розмовляють нідерландською, оскільки це єдина мова, якою ведеться викладання у вищих навчальних закладах. Поточна пропозиція у Фольксрааді щодо відкриття шкіл з індонезійською мовою навчання чекає на голосування Генерал-губернатора."
 INS_volksraad_allow_language_in_government: "Дозволити індонезійську мову в уряді"
 INS_volksraad_allow_language_in_government_desc: "Державні посади в Ост-Індії, включно з Фольксраадом, вимагають вільного володіння нідерландською мовою, що змусило багатьох членів Фольксрааду, особливо представників корінних громад, поставити під сумнів легітимність цієї демократії. Вони підготували пропозицію, яка наполягає на тому, щоб урядові посади за можливості могли обіймати люди, які розмовляють індонезійською."
 INS_volksraad_remove_education_quotas: "Скасувати систему квот на освіту"
 INS_volksraad_remove_education_quotas_desc: "Система освіти в Ост-Індії наразі функціонує за системою квот, згідно з якою має бути прийнята певна кількість індонезійських студентів і певна кількість нідерландських студентів. Це викликало суперечки у Фольксрааді через поширену думку, що система несправедливо перекошена на користь нідерландців. Хоча ми могли б дозволити Фольксрааду роками сперечатися про реформування системи, можливо, варто скасувати систему квот взагалі."
 INS_volksraad_reduce_rubber_export_tax: "Знизити податок на приватний експорт каучуку"
 INS_volksraad_reduce_rubber_export_tax_desc: "Наразі існує надзвичайно високий податок на приватні компанії, що експортують каучук, що дозволяє нам утримувати монополію на ринку. Однак це призвело до економічного застою в деяких регіонах через неможливість роботи приватних плантацій. На момент впровадження це вважалося доцільним, але міжнародний протекціонізм часів Великої депресії зробив нашу економіку експорту каучуку набагато менш прибутковою. Можливо, варто знизити податок, щоб стимулювати економіку."
 INS_volksraad_knil_rank_limit: "Прийняти антидискримінаційні закони для військових звань"
 INS_volksraad_knil_rank_limit_desc: "Хоча немає офіційного правила, яке б заважало корінним індонезійцям просуватися по службі в KNIL, існує неписане правило, яке забороняє це, обмежуючи навіть найуспішніших військовослужбовців званням полковника. Кілька партій у Фольксрааді чинять тиск на уряд, вимагаючи визнати зусилля успішних індонезійських офіцерів."
 INS_volksraad_legalize_displaying_flag: "Легалізувати демонстрацію червоно-білого прапора"
 INS_volksraad_legalize_displaying_flag_desc: "Публічна демонстрація червоно-білого прапора «Індонезії» наразі є незаконною через його зв'язки з націоналістичними, антиколоніальними організаціями. Легалізація його демонстрації, ймовірно, стала б демонстрацією нашої готовності до співпраці та зупинила б триваючу радикалізацію націоналістів по всьому архіпелагу."
 INS_volksraad_education_subsidies_for_indonesians: "Відкрити субсидії на освіту для не-нідерландських жителів"
 INS_volksraad_education_subsidies_for_indonesians_desc: "У Фольксрааді тривають дебати щодо субсидій та стипендій, які надаються нідерландським студентам в Ост-Індії. Кілька представників корінних громад у Фольксрааді стверджують, що цю систему слід поширити на будь-кого зі студентів, незалежно від походження. Це принесло б нам прихильність населення, хоча й коштувало б недешево."
 INS_volksraad_indonesian_national_language: "Зробити індонезійську мову офіційною державною мовою"
 INS_volksraad_indonesian_national_language_desc: "Індонезійська мова стала спільною мовою в багатьох частинах архіпелагу, долаючи мовні бар'єри між кількома культурами. Оскільки тепер індонезійська мова дозволена в освіті та урядових структурах, багато представників Фольксрааду звернулися з петицією про її юридичне визнання офіційною мовою колонії нарівні з нідерландською."
 INS_volksraad_official_flag: "Офіційно затвердити індонезійський прапор"
 indonesia_volksraad_official_flag_effect_tt: "Наш прапор буде змінено на червоно-білий."
 INS_volksraad_official_flag_desc: "Пропозиції у Фольксрааді щодо надання автономії врешті-решт увінчалися успіхом, і те, що ще кілька років тому називалося Нідерландською Ост-Індією, тепер є Домініоном Індонезія. Наш прапор має бути змінений відповідно до цих змін."
