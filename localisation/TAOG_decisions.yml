 INS_win_condition_base_republic_warning: "Знищити Ост-Індію"
 INS_win_condition_base_republic_warning_desc: "Ми повинні продовжувати боротися, вербувати цивільних і дбати про те, щоб вогонь у душі кожного індонезійця продовжував палати. Як тільки ми повалимо адміністрацію Ост-Індії, [HOL.GetNameDef] не матиме іншого вибору, окрім як здатися."
 INS_win_condition_base_republic_real: "Знищити Ост-Індію"
 INS_win_condition_base_republic_real_desc: "Ми повинні продовжувати боротися, вербувати цивільних і дбати про те, щоб вогонь у душі кожного індонезійця продовжував палати. Як тільки ми повалимо адміністрацію Ост-Індії, [HOL.GetNameDef] не матиме іншого вибору, окрім як здатися."
