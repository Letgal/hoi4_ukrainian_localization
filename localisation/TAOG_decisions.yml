 INS_escalate_the_conflict: "Ескалювати конфлікт"
 INS_escalate_the_conflict_desc: "Ми організуємо заворушення та сутички з ворожими силами, щоб посилити напруженість та ескалацію, закладаючи основу для того, щоб пізніші, більш жорсткі операції зазнали меншої прискіпливості з боку міжнародної спільноти."
 INS_escalate_the_conflict_HOL: "$INS_escalate_the_conflict$"
 INS_escalate_the_conflict_HOL_desc: "$INS_escalate_the_conflict_desc$"
 INS_deescalate_the_conflict: "Запросити міжнародне посередництво"
 INS_deescalate_the_conflict_2: "Наказати про припинення вогню"
 INS_deescalate_the_conflict_desc: "Нідерландці не вестимуть з нами сумлінних переговорів. Для них ми залишаємося повстанцями, незручністю, яку потрібно придушити, а не нацією, з якою варто рахуватися. Але великі держави світу — це зовсім інша справа, і Гаага не може так просто відмахнутися від них. Ми звернемося до міжнародної спільноти з проханням про посередництво, і нехай іноземний тиск змусить зробити те, чого не може наш власний голос."
 INS_deescalate_the_conflict_2_desc: "Наші рейди зробили свою справу. Колоніальний гарнізон знає межі нашого впливу, а Гаага знає, що ми не залякані. Проте кожен удар дає Нідерландам новий привід відправляти більше людей і кораблів, а ми не готові до відкритої війни. Нашим командирам буде передано наказ утриматися від вогню. Наступний удар буде завдано тоді, коли скажемо ми, а не тоді, коли нідерландці підштовхнуть нас до цього."

