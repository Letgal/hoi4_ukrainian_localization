 INS_revolution_war_HOL_desc: "Ці повстанці діють уже занадто довго. Занадто багато грошей і військових ресурсів було витрачено на протидію операціям ополчення, але вони продовжують розширюватися. Ми більше не можемо чекай, тотальна війна — єдиний шлях уперед."
