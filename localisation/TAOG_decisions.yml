 INS_national_revolution_cat: "Національна революція в Індонезії"
 INS_national_revolution_cat_desc: "Після 350 років нідерландської тиранії ми взяли справу у свої руки й проголосили незалежність. Нідерланди не визнають нашу владу, продовжуючи правити Ост-Індією як своєю колонією та ставлячись до нас як до злочинців.\n\nМи повинні продовжувати брати під контроль нові регіони та важливі міста і повалити нідерландський уряд зсередини. Однак нам слід бути обережними, щоб не діяти занадто агресивно без ретельного планування, оскільки стрімка ескалація з нашого боку може спровокувати військові дії Нідерландів."
 INS_national_revolution_cat_map: "Влаштувати відволікаючі повстання"

 INS_national_revolution_dutch_cat: "Революційні загони ополчення в Ост-Індії"
 INS_national_revolution_dutch_cat_desc: "Революціонери в Ост-Індії незаконно проголосили незалежність і за допомогою сил ополчення взяли під контроль деякі регіони. Попри всі наші зусилля, ми не змогли відновити контроль у цих регіонах через величезну кількість присутніх там сил ополчення.\n\nНам потрібно зупинити їх, перш ніж вони захоплять більше міст і ще більше дестабілізують адміністрацію Ост-Індії. Хоча це і крайній захід, військова сила може знадобитися, якщо вони продовжуватимуть діяти подібним чином."
 INS_HOL_revolution_not_going_well_tt: "§RБез Батавії ми не зможемо керувати Ост-Індією, і у нас не залишиться іншого вибору, окрім як домовитися про мирну угоду з революціонерами.§!"

 INS_gradual_escalation_republic: "Поступова ескалація"
 INS_gradual_escalation_HOL: "Поступова ескалація"
 INS_gradual_escalation_republic_desc: "Нідерландські заходи у відповідь ставали все жорсткішими після кожного нашого рейду, і їхні патрулі просуваються в райони, які вони покинули місяці тому. Наші командири повідомляють про запеклі бої в місцях, які давно вважалися умиротвореними, а наші втрати зростають швидше, ніж вербувальники встигають їх замінити. Конфлікт поширився на провінції, де минулого року було тихо."
 INS_gradual_escalation_HOL_desc: "Звіти з наших резидентур погіршуються з кожним тижнем. Повстанці завдають ударів у районах, де, як вважалося, вони не діють, а військове командування в Батавії наполягає на застосуванні більш жорстких заходів, ніж будь-коли раніше. У Гаазі тих, хто колись закликав до терпіння, стає менше на кожному засіданні кабінету міністрів."
 INS_national_revolution_republic_win_ins_tt: "[INS.GetAdjective] республіканські загони ополчення встановлять §Gде-факто контроль§! над регіоном, і конфлікт закінчиться §Gперемогою Республіки§!."
 INS_national_revolution_republic_win_hol_tt: "[INS.GetAdjective] республіканські загони ополчення встановлять §Rде-факто контроль§! над регіоном, і конфлікт закінчиться §Rперемогою Республіки§!."

 INS_national_revolution_dutch_cat_map: "Переглянути регіони, окуповані ополченням"

 INS_take_batavia: "Захопити контроль над Явою"
 INS_take_batavia_desc: "Нідерландська жадібність, яка змусила їх інвестувати майже виключно в Яву, ігноруючи східні острови, перетворила Яву на ахіллесову п'яту всієї колонії. Це стане їхнім крахом! Ми повинні кинути наші сили на штурм Яви і знищити нідерландські мережі зв'язку та постачання, унеможлививши роботу адміністрації Ост-Індії."
 INS_hold_batavia_HOL: "Утримати Яву"
 INS_hold_batavia_HOL_desc: "Республіканські сили розпочали операцію з передислокації більшої частини своїх військ на Яву, намагаючись взяти під контроль увесь острів. Ми повинні продовжувати чинити опір, їхня операція ризикована, і вона дає нам можливість повалити їхній уряд у разі їхньої невдачі."

 INS_militias_moestopo_mission: "Мустопо вимагає підвищення за свої зусилля"
 INS_militias_pki_uprising_mission: "Комуністичне повстання неминуче"

 INS_pacific_revolution_cat: "Тихоокеанська революція"
 INS_instigate_in_country: "Спровокувати революцію в [FROM.GetName]"
 INS_instigate_in_country_desc: "Наша революція не закінчилася, коли останнього колоніального солдата було вигнано з [ROOT.GetAdjective] землі. Робітники та селяни [FROM.GetName] страждають під тим самим ярмом, яке ми скинули, і тепер вони дивляться на нас як на доказ того, що гнобителя можна перемогти. Ми зашлемо до них наших агітаторів, будемо розповсюджувати листівки, фінансувати їхні профспілки та роздмухувати полум'я невдоволення, поки не дозріють умови для революції."

 INS_launch_revolution: "Заклик до революції"
 INS_launch_revolution_desc: "Умови в [FROM.GetName] дозріли. Наші агенти повідомляють про зростання заворушень на фабриках і полях, а місцеві партійні осередки готові діяти. Настал час закликати робітників і селян [FROM.GetName] піднятися і захопити те, що належить їм по праву."

 INS_anti_colonialist_bonus: "Поширювати антиколоніальні настрої в [FROM.GetName]"
 INS_anti_colonialist_bonus_desc: "Народ [FROM.GetName] працює на благо іноземного господаря, змушений служити не своїм інтересам. Ми нагадаємо їм, що підкорення — це вибір, і що їхні господарі не такі сильні, як прикидаються."

 INS_revolutionary_sentiment: "Співпрацювати з [FROM.GetAdjective] революціонерами"
 INS_revolutionary_sentiment_desc: "У [FROM.GetName] є ті, хто вже самостійно взявся за справу. Їм бракує організації та ресурсів, але не переконань. Координуючи свої дії з цими групами, ми можемо прискорити крах існуючого порядку, навіть якщо викликана цим нестабільність ускладнить управління країною в короткостроковій перспективі."

 INS_arm_militias: "Озброїти місцеве [FROM.GetAdjective] ополчення"
 INS_arm_militias_desc: "Листівки та промови можуть просунути революцію лише до певної межі. Коли настане момент, наші товариші в [FROM.GetName] повинні мати можливість битися. Надлишки зброї та припасів мають бути таємно переправлені прихильним до нас загонам ополчення, щоб сили реакції зіткнулися з озброєним населенням, а не з беззахисним."
 INS_arm_militias_tt: "Якщо почнеться громадянська війна, комуністи стартуватимуть із додатковими дивізіями."

 INS_propoganda_mission: "Поширювати комунізм у [FROM.GetName]"
 INS_propoganda_mission_desc: "Партійні організатори мають бути направлені по всій території [FROM.GetName] для створення гуртків читання, вербування серед профспілок та донесення ідей революції до сіл. Насіння, яке ми сіємо сьогодні, досить скоро принесе плоди."

 INS_abandon_mission: "Покинути місію"
 INS_abandon_mission_desc: "Наші ресурси не безмежні, а боротьба в [FROM.GetNameDef] вимагає більшого, ніж ми можемо собі дозволити зараз. Ми відкличемо наших агентів і перенаправимо наші зусилля туди, де вони потрібні найбільше."

