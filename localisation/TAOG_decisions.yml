 INS_revolution_planning_hq: "Створити революційний штаб у [FROM.GetName]"
 INS_revolution_planning_hq_desc: "Ми створимо наш штаб ополчення у [FROM.GetName], який буде функціонувати як наше центральне командування базами ополчення по всьому архіпелагу. Наш штаб і навколишня територія будуть пріоритетними в місіях інфільтрації та перебуватимуть під нашим твердим контролем."
 INS_revolution_planning_hq_tt: "Побудовано не більше §Y3§! революційних штабів"
 INS_revolution_planning_hq_DONE: "Революційний штаб"
 INS_revolution_planning_hq_DONE_desc: "Це наш революційний штаб, куди звітують наші загони ополчення. Цей регіон буде під нашим контролем, як тільки ми проголосимо незалежність."
