 INS_soetardjo_petition: "Петиція Сутарджо очікує на затвердження"
 INS_soetardjo_petition_desc: "Конференція круглого столу, до якої закликав Сутарджо, відбулася, завершившись висновком, що [INS.GetNameDef] має відповідати низці економічних вимог для забезпечення самодостатності. Ми повинні продемонструвати чіткий прогрес на шляху до цих цілей, інакше [HOL.GetNameDef] зрештою скасує це рішення, щоб зберегти статус-кво."
 INS_soetardjo_petition_refresh_tt: "Повторно активує місію: §YПетиція Сутарджо очікує на затвердження§! тривалістю §Y120 днів§!."
 INS_soetardjo_pending: "Фольксраад обговорює петицію Сутарджо про автономію"
 INS_soetardjo_pending_desc: "Сутарджо — член Фольксрааду, відомий як лідер мирного націоналістичного руху. Зараз він організовує петицію з проханням надати [INS.GetNameDef] більшу автономію та організувати конференцію круглого столу між нідерландськими та індонезійськими представниками, щоб обговорити прагнення індонезійців стати автономними у складі нідерландської співдружності. Ця петиція наразі обговорюється у Фольксрааді. Коли ці дебати завершаться, ми маємо вирішити, як реагувати, оскільки наслідки петиції мають величезне значення."

