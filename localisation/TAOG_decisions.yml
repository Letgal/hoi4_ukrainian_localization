 INS_can_raid_here_HOL: "Регіон під загрозою рейду"
 INS_can_raid_here_HOL_tt: "Цей регіон є потенційною ціллю сухопутного рейду ополчення Республіки. У разі успіху регіон буде відібрано у нас. Щоб захистити регіон від рейдів, ми можемо:\n$success_modifier_INS_has_influence_mod_counterplay$\n$success_modifier_INS_defense_modifier_counterplay$\n$success_modifier_INS_naval_dominance_modifier_counterplay$\n- Збільшити §YПеревагу в повітрі§!\n- Зменшити розвіддані для ворогів\n- Зменшити опір у регіоні"

 INS_war_escalation_text: "£generic_war_escalation_text_icon Рівень ескалації: §Y[?INS.INS_war_escalation_level]§!"
 INS_war_escalation_level_tt: "§YПоточна ескалація§!\n\nРівень ескалації зростає з часом, а також коли ополчення §Yокупує нові регіони§!, а [HOL.GetNameDef] вживає заходів для протидії діяльності ополчення. Якщо ситуація загостриться сильніше, вона може перерости в §Rтотальну війну§!."
 INS_war_escalation_1_tt: "§Y[INS.GetName]§!: Розблоковує сухопутні рейди"
 INS_war_escalation_2_tt: "§Y[INS.GetName]§!: Розблоковує рішення наказати про припинення вогню"
 INS_war_escalation_3_tt: "§Y[HOL.GetName]§!: Розблоковує фокуси для запиту на залучення Британії чи Франції"
 INS_war_escalation_4_tt: "§Y[HOL.GetName]§!: Розблоковує рішення про оголошення війни (з важкими штрафами через протидію міжнародної спільноти)\n§Y[INS.GetName]§!: Розблоковує рішення про запит міжнародного посередництва для деескалації"
 INS_war_escalation_5_tt: "§Y[INS.GetName]§!: Битва за Сурабаю"
 INS_war_escalation_6_tt: "Немає ефектів"
 INS_war_escalation_7_tt: "§Y[HOL.GetName]§!: Рішення про оголошення війни більше не накладає штрафів\n§Y[INS.GetName]§!: Розблоковує фокус на оголошення війни"
 INS_war_escalation_8_tt: "§Y[INS.GetName]§!: Розблоковує фокус на запуск кампанії інфільтрації на Яві. §RЦе може призвести до передчасної перемоги Індонезії.§!\n§Y[INS.GetName]§!: Невдалий замах на життя Сукарно"
