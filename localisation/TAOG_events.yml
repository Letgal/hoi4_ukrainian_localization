### INS - Political Events
 INS_political_events.1.t: "Новий генерал-губернатор"
 INS_political_events.1.desc: "П'ятирічний термін [INS.GetLeader] добігає кінця, і тому ми повинні обрати відповідного лідера на його місце. Королева Вільгельміна порекомендувала Алідіуса Тьярду ван Старкенборга Стахауера, який показав великі перспективи як надзвичайний посол і повноважний міністр."
 INS_political_events.1.a: "Як бажає королева."
 INS_political_events.1.b: "[INS.GetLeader] добре впорався, він має відслужити ще один термін."
 INS_political_events.2.t: "[FROM.GetName] вимагає прав на [721.GetName]"
 INS_political_events.2.desc: "Новий республіканський уряд у колишній Індії оголосив весь архіпелаг своєю територією. [FROM.GetLeader] надіслав нам офіційну вимогу відмовитися від [721.GetName], погрожуючи військовими діями у разі відмови."
 INS_political_events.2.a: "Добре, це не варте інциденту."
 INS_political_events.2.b: "Абсолютно ні!"
 INS_political_events.3.t: "[FROM.GetName] погоджується відмовитися від [721.GetName]"
 INS_political_events.3.desc: "Як і очікувалося, [FROM.GetLeader] погодився на наші вимоги і почав виведення військ з [721.GetName]. Сили TKR увійшли в регіон разом із кількома урядовими посланцями. Сам [INS.GetLeader] виступив із промовою в Ділі, проголосивши свободу від колоніального впливу."
 INS_political_events.3.a: "Чудово!"
 INS_political_events.4.t: "[FROM.GetName] відмовляється віддавати [721.GetName]"
 INS_political_events.4.desc: "Переговори з [FROM.GetName] пройшли не дуже добре. [FROM.GetLeader] відмовився віддавати [721.GetName] з будь-яких причин, достроково завершивши зустріч."
 INS_political_events.4.a: "Тоді це війна."

 INS_political_events.5.t: "Загальні вибори в Індонезії"
 INS_political_events.5.desc: "Сьогодні історична віха для Індонезії. З офіційним завершенням революції прем'єр-міністр [INS.GetLeader] оголосив, що Індонезія проведе свої перші вільні та демократичні вибори. Результат цих виборів матиме тривалий вплив на Індонезію."
 INS_political_events.5.a: "Сутан Шарір довів нашу країну до цього моменту, він вестиме нас далі!"
 INS_political_events.5.b: "Амір Шаріфуддін є справедливим компромісом між соціалістами та націоналістами."
 INS_political_events.5.c: "Мохаммад Хатта розпочав революцію, і він її завершить."

 INS_political_events.6.t: "Наші приготування приносять плоди"
 INS_political_events.6.desc: "З початком революції наші партизани, які проникли в адміністрацію Індії, більше не потребують діяти в таємниці і почнуть виконувати свої диверсійні місії до того, як Нідерланди встигнуть відреагувати."
 INS_political_events.6.a: "Ми повинні продовжувати діяти швидко."

 INS_political_events.7.t: "Петиція Сутарджо"
 INS_political_events.7.desc: "Петиція Фольксрааду, організована Сутарджо, яка вимагає проведення круглого столу між голландськими та індонезійськими представниками для обговорення прагнення Індонезії до автономії, завершила внутрішнє обговорення, і петиція надійшла на затвердження генерал-губернатору. Хоча багато радників наполягають на тому, що статус-кво має бути збережено, і тому на петицію слід накласти вето, не можна заперечувати, що націоналістичні рухи стають лише сильнішими та радикальнішими. Якщо ми продовжимо відмовляти у кожному мирному проханні про автономію, націоналісти можуть натомість почати випробовувати більш насильницькі альтернативи."
 INS_political_events.7.a: "Ми повинні почати переговори, щоб уникнути неминучої громадянської війни."
 INS_political_events.7.b: "Статус-кво має продовжуватися."
 INS_political_events.7.c: "Можливо, націоналісти мають рацію?"

 INS_political_events.8.t: "Окупація військами [?event_target:INS_invasion_event_invader.GetAdjective] неминуча"
 INS_political_events.8.desc: "Солдати з [?event_target:INS_invasion_event_invader.GetName] прибули до [?event_target:INS_invasion_event_invaded_state.GetName], і наші солдати в цьому районі, значно поступаючись чисельністю, отримали наказ розпочати повну військову евакуацію [?event_target:INS_invasion_event_invaded_state.GetName]. Сили [?event_target:INS_invasion_event_invader.GetAdjective] продовжують просуватися в Індії, і наші шанси уникнути окупації виглядають похмуро."
 INS_political_events.8.a: "Ми заарештуємо націоналістів і будемо захищати наш дім до смерті!"

 INS_political_events.9.t: "Індонезійці проголошують незалежність"
 INS_political_events.9.desc: "Оскільки [JAP.GetNameDef] почали виводити свої війська з Ост-Індії, ми відправили солдатів до Батавії, щоб відновити колоніальний уряд. Однак наші солдати виявили, що політичний ландшафт в Індії значно змінився з часів окупації. Ще до того, як наші війська дісталися Батавії, [INS.GetLeader] вже підписав декларацію незалежності, проголосивши Республіку Індонезія незалежною нацією, з шокуючою підтримкою громадськості."
 INS_political_events.9.a: "Вводьте танки!"
 INS_political_events.9.b: "Це безнадійно, більше боїв нам не потрібно. Нам слід зосередитися на відбудові батьківщини."

 INS_political_events.11.t: "[HOL.GetNameDefCap] визнає суверенітет Індонезії"
 INS_political_events.11.desc: "Після проголошення незалежності наші ополченці негайно вирушили захищати нашу територію від голландського вторгнення, якого ми очікували. Однак, на подив багатьох, [HOL.GetLeader] оголосив, що не буде закликати до вторгнення, натомість надавши пріоритет відбудові голландської батьківщини та уникненню подальшого конфлікту."
 INS_political_events.11.a: "Несподівано, але вітається."

 INS_political_events.12.t: "Зустріч з індонезійськими націоналістами"
 INS_political_events.12.desc: "Наші війська висадилися в [?event_target:INS_invasion_event_invaded_state.GetName], і перемога на індонезійському фронті неминуча. Нам потрібно вирішити, як ми будемо окупувати Індонезію. Хоча пряма окупація дасть нам необхідні ресурси, це буде дорого і складно. Ми провели переговори з Сукарно, провідним революціонером, і розробили план, згідно з яким ми створимо індонезійську маріонеткову державу, офіційно очолювану частково Сукарно, але під нашим командуванням. Це заспокоїть індонезійських мирних жителів і буде набагато дешевше, ніж повна окупація."
 INS_political_events.12.a: "Ми повинні продовжувати переговори з Сукарно"
 INS_political_events.12.b: "Ми не зацікавлені у співпраці з революціонерами."

 INS_political_events.13.t: "Окупація військами [?event_target:INS_invasion_event_invader.GetAdjective] неминуча"
 INS_political_events.13.desc: "Солдати з [?event_target:INS_invasion_event_invader.GetName] прибули до [?event_target:INS_invasion_event_invaded_state.GetName], і наші солдати в цьому районі, значно поступаючись чисельністю, отримали наказ розпочати повну військову евакуацію [?event_target:INS_invasion_event_invaded_state.GetName]. Сили [?event_target:INS_invasion_event_invader.GetAdjective] продовжують просуватися в Індії, і наші шанси уникнути окупації виглядають похмуро. Крім того, наші шпигуни повідомляють, що [?event_target:INS_invasion_event_invader.GetLeader] вів переговори з Сукарно та іншими націоналістичними лідерами, маючи на меті створити індонезійську маріонеткову державу на чолі з Сукарно в рамках Сфери співпроцвітання."
 INS_political_events.13.a: "Ми заарештуємо націоналістів і будемо захищати наш дім до смерті!"
 INS_political_events.13.b: "Це небезпечно, але, можливо, це реальний шанс стати незалежними?"
 INS_peta_explain_tt: "Ми зможемо використати хаос окупації, щоб проголосити повну незалежність, якщо [JAP.GetName] відкинуть назад."
 INS_peta_explain_tt_jap: "§R[INS.GetName] може залишатися лояльною до нас, але якщо ми почнемо втрачати контроль над територією, вони можуть розкрити наш блеф і проголосити незалежність§!."

 INS_political_events.14.t: "Націоналістичних лідерів заарештовано"
 INS_political_events.14.desc: "Сукарно, а також кілька інших провідних революціонерів в Індонезії були заарештовані голландською військовою поліцією до того, як ми змогли встановити маріонетковий режим."
 INS_political_events.14.a: "Шкода, він був би цінним союзником."

 INS_political_events.15.t: "Захисники Батьківщини"
 INS_political_events.15.desc: "Переговори з Сукарно завершилися, і маріонетковий режим в Індонезії працює. Сукарно використав свої зв'язки разом з нашою військовою присутністю, щоб дестабілізувати голландський уряд і встановити де-факто контроль над архіпелагом."
 INS_political_events.15.a: "Ми не лише забезпечили себе дешевими ресурсами, ми забезпечили собі цінного союзника."

 INS_political_events.16.t: "Окупація військами [?event_target:INS_invasion_event_invader.GetAdjective] Ост-Індії"
 INS_political_events.16.desc: "Сили [?event_target:INS_invasion_event_invader.GetAdjective] в Індії співпрацювали з індонезійськими націоналістами для дестабілізації нашої колоніальної адміністрації і повністю окупували Індію. Голландські прапори були спущені і замінені індонезійськими, а місцеві жителі Індії, здається, приймають окупантів [?event_target:INS_invasion_event_invader.GetAdjective]. Для нашої колоніальної імперії все виглядає не дуже добре."
 INS_political_events.16.a: "Вони виграли битву, але не виграли війну."

 INS_political_events.17.t: "[INS.GetName] проголошує незалежність"
 INS_political_events.17.desc: "До Імператорської Генеральної штаб-квартири дійшли звістки з Батавії. Сукарно та його кліка, підняті нашими власними руками для управління островами від імені Імператора, проголосили Республіку [FROM.GetAdjective] у відповідь на наші неодноразові територіальні втрати, вважаючи, що наші сили занадто розпорошені, щоб щось з цим зробити."
 INS_political_events.17.a: "На жаль, вони можуть мати рацію."

 INS_political_events.18.t: "Тан Малака повертається до Індонезії"
 INS_political_events.18.desc: "Тан Малака, індонезійський комуніст, який служив ці останні роки як довірений радник нашого уряду, оголосив про свій негайний від'їзд. Оскільки [INS.GetNameDef] тепер є вільною республікою, він має намір нарешті повернутися до країни, на яку він востаннє ступав як утікач більше двох десятиліть тому. Він дякує нам за наданий йому притулок і свободу продовжувати свою роботу, і каже лише, що його місце тепер вдома."
 INS_political_events.18.a: "Побажаємо йому удачі."

 INS_political_events.19.t: "[HOL.GetName] відкликає адмірала Гелфріха"
 INS_political_events.19.desc: "До [1058.GetName] дійшли звістки, що адмірала Конрада Гелфріха, командувача нашими військово-морськими силами і найздібнішого офіцера, який у нас є в цих водах, наказано повернути додому. Гаага посилається на нагальні потреби в метрополії і не дає жодних подальших пояснень. Його від'їзд залишає архіпелаг слабо захищеним у момент, коли наші позиції тут далеко не є безпечними, і кажуть, що в кают-компанії в Сурабаї панують похмурі настрої."
 INS_political_events.19.a: "Похмурий день для флоту"

### INS - Industrial Events
 INS_industrial_events.4.t: "Перерозподіл бюджету в [FROM.FROM.GetName]"
 INS_industrial_events.4.desc: "Закривши каучукові плантації в [FROM.FROM.GetName], ми звільнили місце в бюджеті для нових промислових проєктів у регіоні."
 INS_industrial_events.4.a: "Ми побудуємо нафтові свердловини в [FROM.FROM.GetName]"
 INS_industrial_events.4.b: "Нам слід відкрити алюмінієвий завод у [FROM.FROM.GetName]"
 INS_industrial_events.4.c: "Нам слід шукати ресурси, виробництва яких нам не вистачає"
 INS_industrial_events.4.d: "Ми можемо відкрити вугільні шахти в [FROM.FROM.GetName]"

 INS_industrial_events.5.t: "[INS_industrial_events_5_t_scripted]"
 INS_industrial_events_5_t_colonial: "Доля De Javasche Bank"
 INS_industrial_events_5_t_independent: "Доля Bank Indonesia"
 INS_industrial_events.5.desc: "[INS_industrial_events_5_desc_scripted]"
 INS_industrial_events_5_desc_colonial: "Резерви De Javasche Bank впали до найнижчої точки за десятиліття. За гульден купують менше з кожним місяцем, і власники плантацій вимагають оплати в іноземній валюті. Наші фінансові радники погоджуються, що Банк сам по собі не може повернути назад спад, але вони різко розходяться в думках щодо засобів правового захисту."
 INS_industrial_events_5_desc_independent: "Bank Indonesia повідомив, що рупія втратила майже п'яту частину своєї вартості лише за останній квартал. Торговці рисом у Сурабаї почали відверто відмовлятися від неї на користь іноземних банкнот. Наш міністр фінансів наполягає, що валюту можна врятувати, але тільки якщо ми діятимемо рішуче і швидко."
 INS_industrial_events.5.a: "Нам слід спробувати зміцнити гульден, а не замінювати його."
 INS_industrial_events.5.b: "Ми прив'яжемо індійський гульден до голландського гульдена."
 INS_industrial_events.5.c: "Ми прив'яжемо індійський гульден до долара США."

 INS_industrial_events.6.t: "Більш вигідна угода"
 INS_industrial_events.6.desc: "Хінне бюро прийняло наші умови. Оскільки малярія спустошує половину тропіків, а замінника хініну не видно, у них було мало вибору. Нова угода гарантує нам значно більшу частку прибутку від кожного грама хініну, який покидає наші береги. Тепер питання в тому, куди спрямувати цей несподіваний прибуток."
 INS_industrial_events.6.a: "Інвестувати в наші міста."
 INS_industrial_events.6.b: "Розвивати віддалені острови."
 INS_industrial_events.6.c: "Зміцнювати нашу військову промисловість."

 # Rubber shipment dispatched
 INS_industrial_events.28.t: "Партія каучуку відправлена"
 INS_industrial_events.28.desc: "Конвої завантажили останній каучук і вийшли в море. Наші покупці отримають те, за що заплатили, а в наших книгах буде відображена узгоджена компенсація в належний час. Протягом наступних двох років витрати на цю транзакцію будуть на наших балансах, як нагадування про те, чого вимагає від нас Депресія."
 INS_industrial_events.28.a: "Прийнято."
 INS_industrial_events.28.b: "Організувати ще одну партію."

 # Oil shipment dispatched
 INS_industrial_events.36.t: "Партія нафти відправлена"
 INS_industrial_events.36.desc: "Танкери покинули наші нафтопереробні заводи, їхні трюми прямують до портів покупця. Компенсація узгоджена і буде отримана в повному обсязі, хоча тягар продажу тиснутиме на нашу економіку ще два роки. Такі умови пропонує нам світ у ці важкі роки."
 INS_industrial_events.36.a: "Прийнято."
 INS_industrial_events.36.b: "Організувати ще одну партію."

### INS - Volksraad
 INS_volksraad_events.2.t: "[HOL.GetLeader] наклав вето на петицію Фольксрааду."
 INS_volksraad_events.2.desc: "Хоча петиція була схвалена [INS.GetLeader], на неї було накладено вето після розгляду [HOL.GetLeader], і тому ми не зможемо продовжити імплементацію в цей час."
 INS_volksraad_events.2.a: "Можливо, ми спробуємо ще раз у майбутньому з ратифікованою петицією."
 # Generic/Reused
 INS_volksraad_events.10.t: "Пропозиція у Фольксрааді дозволити індонезійську мову в школах"
 INS_volksraad_events.10.desc: "[INS.GetLeader] схвалив петицію Фольксрааду щодо сприяння створенню індонезійськомовних шкіл та університетів у [INS.GetNameDef], і її було відправлено [HOL.GetLeader] на остаточне затвердження."
 INS_volksraad_events.10.a: "Фольксраад виконує своє призначення."
 INS_volksraad_events.10.b: "Абсолютно ні. Накласти вето!"
 INS_volksraad_events.11.t: "Індонезійськомовна освіта буде запроваджена."
 INS_volksraad_events.11.desc: "Петиція була підписана [HOL.GetLeader] і тепер є офіційно обов'язковою. Імплементація петиції розпочнеться незабаром після узгодження остаточних деталей."
 INS_volksraad_events.11.a: "Фольксраад виконує своє призначення."
 # Individual laws
 INS_volksraad_events.20.t: "Пропозиція у Фольксрааді дозволити індонезійську мову в уряді"
 INS_volksraad_events.20.desc: "Урядові посади в Індії, включно з Фольксраадом, вимагають вільного володіння голландською мовою, що змусило багатьох членів Фольксрааду, особливо представників місцевих громад, поставити під сумнів дійсність її демократії. Вони внесли пропозицію, яка наполягає на тому, що урядові посади мають обіймати індонезійськомовні особи, коли це можливо."
 INS_volksraad_events.21.t: "Індонезійська мова тепер дозволена в уряді!"
 INS_volksraad_events.21.desc: "Петиція була підписана [HOL.GetLeader] і тепер є офіційно обов'язковою. Імплементація петиції розпочнеться незабаром після узгодження остаточних деталей."
 INS_volksraad_events.30.t: "Пропозиція у Фольксрааді скасувати систему квот на освіту"
 INS_volksraad_events.30.desc: "[INS.GetLeader] схвалив петицію Фольксрааду про скасування системи квот на освіту в [INS.GetNameDef], щоб покласти край тривалим суперечкам у Фольксрааді щодо її впровадження та справедливості. Її було відправлено [HOL.GetLeader] на остаточне затвердження."
 INS_volksraad_events.31.t: "Систему квот на освіту скасовано."
 INS_volksraad_events.31.desc: "Петиція була підписана [HOL.GetLeader] і тепер є офіційно обов'язковою. Імплементація петиції розпочнеться незабаром після узгодження остаточних деталей."
 INS_volksraad_events.40.t: "Пропозиція у Фольксрааді зменшити експортний податок на каучук"
 INS_volksraad_events.40.desc: "[INS.GetLeader] підписав і схвалив петицію Фольксрааду про зниження високих податків, накладених на приватні каучукові плантації. Ці податки історично дозволяли мати дуже прибуткову урядову монополію на каучук, однак міжнародний протекціонізм зробив цю систему набагато менш прибутковою. [INS.GetLeader] заявив, що він більше не вірить, що податки компенсують економічні наслідки, які вони викликають."
 INS_volksraad_events.40.a: "[INS.GetLeader] має рацію."
 INS_volksraad_events.40.b: "Податки залишаться."
 INS_volksraad_events.41.t: "Приватний податок на експорт каучуку було зменшено."
 INS_volksraad_events.41.desc: "Петиція була підписана [HOL.GetLeader] і тепер є офіційно обов'язковою. Імплементація петиції розпочнеться незабаром після узгодження остаточних деталей."
 INS_volksraad_events.60.t: "Пропозиція у Фольксрааді зняти неписаний ліміт на звання для індонезійських офіцерів"
 INS_volksraad_events.60.desc: "[INS.GetLeader] схвалив петицію Фольксрааду про зняття неписаного правила, яке обмежує звання, що можуть мати офіцери KNIL не голландського походження, і підвищення індонезійських офіцерів, які вважаються недооціненими за свої досягнення. Петицію було відправлено [HOL.GetLeader] на остаточне затвердження."
 INS_volksraad_events.61.t: "Невидима стеля звань для генералів [INS.GetAdjective] знята."
 INS_volksraad_events.61.desc: "Петиція була підписана [HOL.GetLeader] і тепер є офіційно обов'язковою. Імплементація петиції розпочнеться незабаром після узгодження остаточних деталей."
 INS_volksraad_events.70.t: "Пропозиція у Фольксрааді легалізувати публічне демонстрування націоналістичних прапорів та символіки"
 INS_volksraad_events.70.desc: "[INS.GetLeader] схвалив петицію Фольксрааду про зняття обмежень на публічне демонстрування націоналістичних прапорів та символіки в публічних місцях у [INS.GetNameDef], значною мірою для того, щоб зменшити радикалізацію багатьох молодих націоналістів. [INS.GetLeader] наполягає на тому, що ми повинні зайняти оборонну позицію в цьому питанні, співпрацюючи з мирними націоналістичними лідерами, водночас викорінюючи революційні рухи, однак рішення зрештою залишається за нами."
 INS_volksraad_events.71.t: "Червоно-білий прапор більше не є нелегальним для демонстрації!"
 INS_volksraad_events.71.desc: "Петиція була підписана [HOL.GetLeader] і тепер є офіційно обов'язковою. Імплементація петиції розпочнеться незабаром після узгодження остаточних деталей."
 INS_volksraad_events.100.t: "Пропозиція у Фольксрааді дозволити освітні субсидії для резидентів не голландського походження"
 INS_volksraad_events.100.desc: "[INS.GetLeader] схвалив петицію Фольксрааду про дозвіл резидентам не голландського походження [INS.GetNameDef] подавати заявки на отримання освітніх субсидій. Петицію було відправлено [HOL.GetLeader] на остаточне затвердження."
 INS_volksraad_events.101.t: "Представники [INS.GetAdjective] тепер можуть подавати заявки на освітні субсидії"
 INS_volksraad_events.101.desc: "Петиція була підписана [HOL.GetLeader] і тепер є офіційно обов'язковою. Імплементація петиції розпочнеться незабаром після узгодження остаточних деталей."

### INS - Dutch Interaction Events
 INS_dutch_events.1.t: "[INS.GetNameDefCap] вимагає командування нашим флотом"
 INS_dutch_events.1.desc: "Після падіння нашої батьківщини [INS.GetNameDef] звернулася до нас із проханням передати командування нашими військово-морськими силами до [INS.GetNameDef]. Вони стверджують, що об'єднане командування дозволить краще координувати дії в цей безпрецедентний час."
 INS_dutch_events.1.a: "Якщо це зміцнить справу, ми повинні поступитися."
 INS_dutch_events.1.b: "Наші кораблі підпорядковуватимуться лише Гаазі."

 INS_dutch_events.2.t: "[HOL.GetNameDefCap] приймає нашу пропозицію щодо командування флотом"
 INS_dutch_events.2.desc: "[HOL.GetNameDefCap] прийняли нашу пропозицію дозволити нам взяти на себе командування об'єднаними військово-морськими силами. Перехід відбувається гладко, і офіцери як [HOL.GetAdjective], так і [INS.GetAdjective] працюють пліч-о-пліч, щоб зміцнити наші позиції в Тихому океані."
 INS_dutch_events.2.a: "Разом ми втримаємо Тихий океан."

 INS_dutch_events.3.t: "[HOL.GetNameDefCap] відхиляє нашу пропозицію щодо командування флотом"
 INS_dutch_events.3.desc: "[HOL.GetNameDefCap] відхилили нашу пропозицію щодо об'єднаного військово-морського командування, посилаючись на матеріально-технічні та адміністративні проблеми. Хоча це і розчаровує, наша співпраця продовжується через інші канали військових зусиль."
 INS_dutch_events.3.a: "Ми знайдемо інший шлях посилити наш військово-морський вплив."

 INS_dutch_events.4.t: "[HOL.GetNameDefCap] засновує Військово-морську програму [HOL.GetName]-[INS.GetName]"
 INS_dutch_events.4.desc: "[HOL.GetNameDefCap] оголосили про створення Військово-морської програми [HOL.GetName]-[INS.GetName], спільної ініціативи з реорганізації та розширення наших морських сил. Експертиза [HOL.GetAdjective] та робоча сила [INS.GetAdjective] разом сформують основу нової тихоокеанської оборонної мережі."
 INS_dutch_events.4.a: "Твердий крок до взаємного виживання."


### INS - Netherlands–Indonesia Union Events
 INS_union_events.1.t: "[HOL.GetNameDefCap] вимагає перенесення уряду до [1058.GetName]"
 INS_union_events.1.desc: "Зі втратою батьківщини, [HOL.GetNameDef] повідомили нас, що їхній уряд і королівський двір переїдуть до [1058.GetName]. Вони пишуть про необхідність, безперервність і потребу зберегти Королівство живим там, де все ще майорить прапор."
 INS_union_events.1.a: "Війна триватиме з [1058.GetName]."
 INS_union_events.1.b: "Ким вони себе уявляють! Це не що інше, як спроба відновити колоніальне панування!"

 INS_union_events.2.t: "[INS.GetNameDefCap] приймає пропозицію про переїзд"
 INS_union_events.2.desc: "[INS.GetNameDefCap] погодилися прийняти наш уряд у вигнанні в [1058.GetName]. Триває підготовка до переїзду, і обидві адміністрації координують інтеграцію офісів і персоналу. Разом ми понесемо факел Королівства вперед зі Сходу."
 INS_union_events.2.a: "Єдиний фронт проти наших спільних ворогів."

 INS_union_events.3.t: "[INS.GetNameDefCap] відхиляє пропозицію про переїзд"
 INS_union_events.3.desc: "[INS.GetNameDefCap] категорично відмовилися від нашого прохання переїхати до [1058.GetName]. [INS.GetLeader] заявив, що ми не маємо права вимагати такого рівня допомоги, коли їхні сили і так занадто розпорошені."
 INS_union_events.3.a: "Здається, вони забули, чий прапор досі нас об'єднує."

 INS_union_events.4.t: "[HOL.GetNameDefCap] переміщує збройні сили до [1058.GetName]"
 INS_union_events.4.desc: "Прибули перші транспорти з батьківщини. Кораблі переповнені офіцерами, солдатами та залишками наших арсеналів. Як і очікувалося, деякі конвої не дійшли до порту. Те, що вціліло, сформує кістяк наших сил у [1058.GetName]."
 INS_union_events.4.a: "Достатньо, щоб прапор майорів."

 # INS proposed union
 INS_union_events.5.t: "[INS.GetNameDefCap] пропонує Нідерландсько-Індонезійський союз"
 INS_union_events.5.desc: "Світові зрозуміло, що війна складається не на нашу користь. Наша країна впала, і наша база операцій перемістилася на схід. Міністри в [INS.GetName] надіслали нам пропозицію сформувати спільну союзну державу на чолі з королевою Вільгельміною, щоб гарантувати максимально можливу співпрацю. Хоча, здається, ніхто не в захваті від цієї пропозиції, це може бути нашим ключем до виживання."
 INS_union_events.5.a: "Це ризик, на який ми повинні піти. Хай живе Королева!"
 INS_union_events.5.b: "Ми не можемо на це погодитися."

 INS_union_events.6.t: "[HOL.GetNameDefCap] приймає пропозицію союзу"
 INS_union_events.6.desc: "Після термінових дебатів у кабінеті міністрів, [HOL.GetLeader] схвалив пропозицію [INS.GetAdjective]. Указ короткий і без церемоній. Наші уряди відтепер діятимуть як єдине ціле під Короною до кінця війни."
 INS_union_events.6.a: "Історична угода для обох націй."

 INS_union_events.7.t: "[HOL.GetNameDefCap] відхиляє пропозицію союзу"
 INS_union_events.7.desc: "Рада в [HOL.GetNameDef] відхилила пропозицію про спільний союз. Їхнє послання тверде, співпраця триватиме, але суверенітет не буде спільним."
 INS_union_events.7.a: "Навряд чи це все одно б спрацювало."

 # HOL proposed union
 INS_union_events.8.t: "[HOL.GetNameDefCap] пропонує Нідерландсько-Індонезійський союз"
 INS_union_events.8.desc: "Світові зрозуміло, що війна складається не на нашу користь. [HOL.GetNameDef] впали, і їхня база операцій перемістилася на схід. Лідери [HOL.GetAdjective] надіслали нам пропозицію сформувати спільну союзну державу на чолі з королевою Вільгельміною, щоб гарантувати максимально можливу співпрацю. Хоча, здається, ніхто не в захваті від цієї пропозиції, це може бути нашим ключем до виживання."
 INS_union_events.8.a: "Це має бути зроблено."
 INS_union_events.8.b: "Це не що інше, як спроба відновити колоніальне панування."

 INS_union_events.9.t: "[INS.GetNameDefCap] приймає пропозицію союзу"
 INS_union_events.9.desc: "[INS.GetNameDefCap] погодилися на нашу пропозицію. Незрозуміло, чим це обернеться, але ми повинні зосередитися на військових зусиллях."
 INS_union_events.9.a: "Якщо ми хочемо вистояти, ми повинні вистояти разом."

 INS_union_events.10.t: "[INS.GetNameDefCap] відхиляє пропозицію союзу"
 INS_union_events.10.desc: "[INS.GetNameDefCap] відхилили пропозицію про союз. Люди і лідери [INS.GetAdjective] не бачать у цьому довгострокової перспективи і виступають проти будь-яких пропозицій щодо відмови від влади."
 INS_union_events.10.a: "Навряд чи це все одно б спрацювало."

 # Flags
 INS_exile_accepted_flag: "Приймає [HOL.GetNameDef] у вигнанні"
 INS_hey_btw_you_are_gonna_die_just_know_that_yeah_tt: "§RЦе завершить гру для вас.§!"

 # Revolution events
 INS_revolution_events.1.t: "[HOL.GetNameDefCap] діє, щоб розтрощити Республіку"
 INS_revolution_events.1.desc: "Як і очікувалося, голландський уряд відреагував на нашу вимогу незалежності, надіславши солдатів до [1058.GetName] і розповсюджуючи антиреспубліканську пропаганду через засоби масової інформації."
 INS_revolution_events.1.a: "Ми повинні діяти швидко."

 INS_revolution_events.2.t: "[HOL.GetNameDefCap] просить про додаткову допомогу"
 INS_revolution_events.2.desc: "[HOL.GetLeader] скликав екстрену зустріч з нашими лідерами, вимагаючи надати подальшу допомогу у відвоюванні Індії, аж до безпосереднього вступу в конфлікт. [HOL.GetLeader] заявив, що ситуація жахлива, і голландські сили не здатні відкинути революційні ополчення. [HOL.GetLeader] обіцяє, що якщо ми їм допоможемо, нам віддадуть Борнео як плату."
 INS_revolution_events.2.a: "Ми зробимо це за Борнео."
 INS_revolution_events.2.b: "Ми не зацікавлені."

 INS_revolution_events.3.t: "[ENG.GetNameDefCap] погоджується на Лондонсько-Батавську угоду"
 INS_revolution_events.3.desc: "[ENG.GetNameDefCap] погодилися безпосередньо вступити в конфлікт, надіславши кілька дивізій воювати в Батавії. Хоча нам доведеться відмовитися від Борнео, це сильно схиляє шанси на нашу користь."
 INS_revolution_events.3.a: "Борнео буде необхідною жертвою."

 INS_revolution_events.4.t: "[ENG.GetNameDefCap] відхиляє Лондонсько-Батавську угоду"
 INS_revolution_events.4.desc: "[ENG.GetNameDefCap] відмовилися від будь-якої подальшої допомоги в конфлікті, незважаючи на терміновість і запропоновану винагороду. [ENG.GetLeader] заявив, що хоча в їхніх найкращих інтересах, щоб ми зберегли нашу колоніальну імперію, ризик глобальної ескалації після їхнього втручання занадто високий, і що нам доведеться вирішувати це самостійно."
 INS_revolution_events.4.a: "Це виглядає не дуже добре."

 INS_revolution_events.5.t: "[HOL.GetNameDefCap] просить нашої допомоги"
 INS_revolution_events.5.desc: "Революціонери в Голландській Ост-Індії проголосили незалежність від [HOL.GetNameDef] і окупували великі міста. [HOL.GetLeader] терміново звернувся до нас, просячи допомогти їм військово, поки вони готують вторгнення."
 INS_revolution_events.5.a: "Якщо революціонери досягнуть успіху, громадяни в наших колоніях можуть надихнутися зробити те саме."
 INS_revolution_events.5.b: "Ми не зацікавлені."

 INS_revolution_events.6.t: "[ENG.GetNameDefCap] погоджується допомогти нам"
 INS_revolution_events.6.desc: "[ENG.GetNameDefCap] погодилися відправити добровольчі війська та спорядження до [1058.GetName], щоб допомогти нам повернути контроль над Індією."
 INS_revolution_events.6.a: "Це буде легко."

 INS_revolution_events.7.t: "[ENG.GetNameDefCap] відмовляється допомогти нам"
 INS_revolution_events.7.desc: "[ENG.GetNameDefCap] відмовилися допомогти нам відновити контроль над Індією, наполягаючи, що Індія — не їхня турбота, незважаючи на їхню близькість до конфлікту. Нам доведеться переозброювати KNIL самостійно."
 INS_revolution_events.7.a: "Це неприйнятно!"

 INS_revolution_events.8.t: "Революційні ополчення плетуть змови в Індії"
 INS_revolution_events.8.desc: "Наша колоніальна поліція в Ост-Індії заарештувала і допитала кількох членів зростаючого революційного руху в Індонезії. Здається, вони намагаються встановити військову присутність, щоб підготуватися до початку національної кампанії за незалежність. Ми ще не знаємо напевно, але вони можуть готувати збройну революцію."
 INS_revolution_events.8.a: "Ми повинні уважно стежити."
 INS_revolution_events.9.t: "Декларація незалежності Індонезії"
 INS_revolution_events.9.desc: "Сьогодні на Яві виступив [INS.GetLeader], проголосивши незалежність новоствореної Республіки Індонезія. Хоча ми не визнаємо цю нову республіку, їхні ополченці окупували територію, і наша поліція не в змозі контролювати ці райони. Якщо ми не поставимося до цієї ситуації серйозно, вона може перетворитися на тотальну війну."
 INS_revolution_events.9.a: "Неприйнятно!"
 INS_revolution_events.9.b: "Це не варте зусиль, якщо вони так сильно хочуть незалежності, то нехай так і буде."


 #INS_revolution_events.10.t: ""
 #INS_revolution_events.10.desc: ""
 #INS_revolution_events.10.a: ""
 INS_revolution_events.11.t: "Військові сили Індії успішно зупинили кампанію ополчення"
 INS_revolution_events.11.desc: "Команда республіканських ополченців розпочала військову операцію з окупації [?event_target:INS_temp_occupied_state.GetName]. Наші хоробрі солдати в Індії успішно зуміли витіснити сили ополчення, і ми зберігаємо повний контроль над регіоном."
 INS_revolution_events.11.a: "Ще одна перемога для [HOL.GetNameDef]."
 INS_revolution_events.12.t: "Ополченці намагаються окупувати [?event_target:INS_temp_occupied_state.GetName]"
 INS_revolution_events.12.desc: "Команда республіканських ополченців розпочала військову операцію з окупації [?event_target:INS_temp_occupied_state.GetName]. Нашій поліції та солдатам зрештою вдалося стримати ситуацію, але ситуація викликала невдоволення в [?event_target:INS_temp_occupied_state.GetName], причому багато цивільних підтримують ополченців і публічно виступають проти уряду [HOL.GetAdjective]."
 INS_revolution_events.12.a: "Ми не можемо дозволити цьому загостритися."
 INS_revolution_events.14.t: "Ополченці окупують [?event_target:INS_temp_occupied_state.GetName]"
 INS_revolution_events.14.desc: "Незважаючи на всі зусилля нашої колоніальної поліції та солдатів, республіканські ополченці успішно розпочали військову операцію з окупації [?event_target:INS_temp_occupied_state.GetName]. Наша поліція та солдати були змушені евакуюватися і оголосили про неможливість керувати регіоном через опір ополчення. Якщо ми дозволимо ополченцям і далі помикати нами, ми ризикуємо втратити нашу велику колонію назавжди."
 INS_revolution_events.14.a: "Це обурливо!"
 INS_revolution_no_effect_tt: "Немає ефектів"

 INS_revolution_events.19.t: "Мирні переговори в Індії"
 INS_revolution_events.19.desc: "[HOL.GetLeader] був викликаний на зустріч із [INS.GetLeader] для обговорення потенційної мирної угоди. [INS.GetLeader] заявив, що було втрачено занадто багато життів, і запропонував рішення про дві держави, де кордони будуть збережені такими, якими вони є зараз, з невеликими коригуваннями, і щоб бойові дії припинилися назавжди."
 INS_revolution_events.19.a: "Ми повинні погодитися. Занадто багато життів вже втрачено."
 INS_revolution_events.19.b: "Якщо ви так сильно хочете миру, то можете здатися!"

 INS_revolution_events.20.t: "[HOL.GetNameDefCap] погоджується на рішення про дві держави!"
 INS_revolution_events.20.desc: "[INS.GetLeader] повернувся із зустрічі з [HOL.GetLeader] з гарними новинами. Обидві сторони погодили рішення про дві держави, і ми негайно почнемо переміщувати наші війська відповідно до нових кордонів. Хоча ніхто не щасливий, що нам довелося залишити наших співвітчизників-індонезійців позаду, рішення припинити бойові дії зрештою є найкращим."
 INS_revolution_events.20.a: "Кровопролиття нарешті закінчиться."

 INS_revolution_events.21.t: "[HOL.GetNameDefCap] відмовляється припиняти бойові дії"
 INS_revolution_events.21.desc: "Зустріч [INS.GetLeader] з [HOL.GetLeader] пішла не за планом, обидві сторони помітно розлютилися і відмовилися йти на компроміс, що призвело до дострокового завершення зустрічі."
 INS_revolution_events.21.a: "Скільки ще життів має бути втрачено?"

 INS_revolution_events.22.t: "[HOL.GetNameDefCap] просить нашої допомоги"
 INS_revolution_events.22.desc: "[HOL.GetLeader] закликав до зустрічі з [FRA.GetLeader] в Амстердамі для обговорення поточної ситуації в Індії. Під час зустрічі [HOL.GetLeader] пояснив, як революціонери почали озброювати ополчення такими темпами, з якими голландська армія не може зрівнятися, і що [HOL.GetNameDef] ризикує втратити свою колоніальну гегемонію. [HOL.GetLeader.GetHeShe] попросив(ла), щоб ми формально приєдналися до конфлікту на боці голландців і надіслали дивізії до Батавії, щоб допомогти відвоювати Індію. В обмін ми отримаємо право на північно-східну Суматру, коли порядок буде відновлено."
 INS_revolution_events.22.a: "Хоча допомога буде дорого коштувати, Суматра цілком може того вартувати."
 INS_revolution_events.22.b: "Це забагато вимагати від нас."

 INS_revolution_events.23.t: "[FRA.GetNameDefCap] погоджується допомогти нам!"
 INS_revolution_events.23.desc: "[FRA.GetNameDefCap] відгукнулися на наш заклик про допомогу і відправили багато французьких дивізій до Батавії, щоб негайно нам допомогти."
 INS_revolution_events.23.a: "Тепер шанси на нашій стороні."

 INS_revolution_events.24.t: "[FRA.GetNameDefCap] відмовляється допомогти."
 INS_revolution_events.24.desc: "[FRA.GetNameDefCap] відмовилися допомогти нам з революцією, незважаючи на терміновість. Ми повинні почати швидко переозброюватися, інакше незабаром ми опинимося в меншості."
 INS_revolution_events.24.a: "Це виглядає не дуже добре."

 INS_revolution_events.25.t: "Кінець війни в Індонезії"
 INS_revolution_events.25.desc: "Сили [HOL.GetAdjective] знищили головні бази ополчення і повалили республіканський уряд. Республіканська еліта та командири були заарештовані, а уряд Індії відновлює свої операції на колишній території республіки. Як і було обіцяно за наш внесок, погоджену територію було передано нам."
 INS_revolution_events.25.a: "Чудово!"

 INS_revolution_events.26.t: "Кінець війни в Індонезії"
 INS_revolution_events.26.desc: "Сили [HOL.GetAdjective] та республіканські ополченці воювали набагато довше, ніж будь-яка зі сторін очікувала, і [HOL.GetLeader] погодився підписати мирну угоду, яка передбачає рішення про дві держави. Однак, оскільки ми все ще виконали свою частину угоди, [HOL.GetLeader] підтвердив, що нам усе одно буде надано територію, яка була нам обіцяна."
 INS_revolution_events.26.a: "Цікавий розвиток подій."

 INS_revolution_events.27.t: "Кінець війни в Індонезії"
 INS_revolution_events.27.desc: "Сили [HOL.GetAdjective] та республіканські ополченці воювали набагато довше, ніж будь-яка зі сторін очікувала, і незважаючи на зусилля [HOL.GetNameDef] і наше власне військове втручання, величезна кількість сил ополчення та партизанський характер їхньої армії призвели до того, що конфлікт зайшов у глухий кут, з сильною перевагою республіканців. Таким чином, [HOL.GetLeader] сьогодні оголосив, що [HOL.GetLeader.GetHeShe] підписав(ла) мирну угоду з Республікою, нав'язуючи рішення про дві держави на користь республіканців. Те, що залишилося від Індії, є оболонкою її колишньої слави. [HOL.GetLeader] заявив, що оскільки конфлікт закінчився поразкою, він не зможе надати нам обіцяну територію за наші військові внески."
 INS_revolution_events.27.a: "Це божевілля!"

 INS_revolution_events.28.t: "Падіння Індії"
 INS_revolution_events.28.desc: "Незважаючи на великі військові витрати, здійснені [HOL.GetNameDef], і наш власний безпосередній внесок у конфлікт, величезна кількість ополченців в Індії зуміла розгромити наші сили і окупувала всі великі міста, поваливши голландську адміністрацію і змусивши капітулювати."
 INS_revolution_events.28.a: "Але нам обіцяли територію!"

 INS_revolution_events.29.t: "Падіння Індії"
 INS_revolution_events.29.desc: "Незважаючи на всі наші зусилля, революціонери в Індії взяли під контроль наші великі міста і знищили колоніальний уряд зсередини. Наші генерали були захоплені, а наші лінії зв'язку перерізані. У нас немає іншого вибору, окрім як визнати нашу поразку."
 INS_revolution_events.29.a: "Це трагедія."

 INS_revolution_events.30.t: "[INS.GetLeader] пропонує локальну угоду про припинення вогню"
 INS_revolution_events.30.desc: "[INS.GetLeader] запропонував локальне припинення вогню в [FROM.GetName], пообіцявши вивести свої війська з [FROM.GetName], якщо ми погодимося, дозволивши нашим військам відновити контроль над регіоном. Однак це за умови, що ми тимчасово відкладемо наші великі військові операції, давши революціонерам час на планування."
 INS_revolution_events.30.a: "Ми погодимося на це."
 INS_revolution_events.30.b: "Ми відмовляємося, ми повернемо [FROM.GetName] силою!"

 INS_revolution_events.31.t: "[HOL.GetNameDefCap] погоджується на припинення вогню в [FROM.GetName]"
 INS_revolution_events.31.desc: "Переговори про припинення вогню пройшли добре, і [HOL.GetLeader] погодився на наші умови. Ми наказали командирам ополчення в [FROM.GetName] негайно вивести свої війська."
 INS_revolution_events.31.a: "Сподіваємося, вони виконають свою частину угоди."

 INS_revolution_events.32.t: "[HOL.GetNameDefCap] відмовляється від припинення вогню"
 INS_revolution_events.32.desc: "Переговори про припинення вогню пішли не за планом, і [HOL.GetLeader] відмовився підписати угоду та перервав переговори до того, як можна було знайти компроміс."
 INS_revolution_events.32.a: "Це неприйнятно!"

 INS_revolution_events.33.t: "[INS.GetNameDefCap] просить про посередництво"
 INS_revolution_events.33.desc: "Індонезійські республіканці офіційно попросили нашої допомоги в укладенні угоди з голландцями. Наші радники в регіоні повідомляють, що ситуація швидко погіршується, і що тривалі голландські військові операції ризикують загнати націоналістів в обійми Рад. Нідерланди є цінним союзником у Європі, але ми не можемо ігнорувати політичні реалії в Південно-Східній Азії. Якщо Індонезія впаде перед комунізмом через те, що ми стояли осторонь, це буде нашою провиною."
 INS_revolution_events.33.a: "Відправте посередників."
 INS_revolution_events.33.b: "Ми не можемо ризикувати нашими відносинами з голландцями."

 INS_revolution_events.34.t: "[FROM.GetNameDefCap] погоджується на посередництво"
 INS_revolution_events.34.desc: "Вашингтон погодився виступити посередником між нашим урядом і голландцями. Американські посланці вже в дорозі, і буде запропоновано формальне припинення вогню. Це величезна можливість. За підтримки найпотужнішої держави світу голландцям буде набагато складніше зволікати або вдаватися до сили. Ми повинні триматися твердо за столом і дозволити американцям робити те, що вони вміють найкраще."
 INS_revolution_events.34.a: "Будемо сподіватися, що голландці прислухаються до голосу розуму."

 INS_revolution_events.35.t: "[USA.GetNameDefCap] оголошує про посередництво"
 INS_revolution_events.35.desc: "Американці втрутилися в індонезійське питання. Вашингтон стверджує, що діє як нейтральний посередник, але наслідки очевидні. Якщо ми не зможемо вирішити цей конфлікт на їхнє задоволення, вони використають свій значний вплив проти нас. Наші переговорники повинні діяти обережно. Американська прихильність — це не те, чим ми можемо дозволити собі розкидатися."
 INS_revolution_events.35.a: "Ми вирішимо це на власних умовах."

 INS_revolution_events.36.t: "[FROM.GetNameDefCap] відмовляється втручатися"
 INS_revolution_events.36.desc: "Американці відхилили наше прохання про посередництво. Вашингтон вирішив підтримати своїх європейських союзників, а не підтримувати нашу боротьбу за самовизначення. Ми залишилися самі. Це гіркий удар, але революція почалася не тому, що ми очікували, що іноземні держави подарують нам свободу."
 INS_revolution_events.36.a: "Ми виграємо цю війну без них."

 INS_revolution_events.37.t: "[USA.GetNameDefCap] висуває ультиматум"
 INS_revolution_events.37.desc: "Американці втратили терпіння. Вашингтон висунув ультиматум, вимагаючи негайного припинення всіх військових операцій в Індонезії та визнання індонезійського суверенітету. Погроза ледь завуальована. Наша репутація в міжнародному співтоваристві не переживе публічного розриву з американцями, і наша економіка не зможе поглинути наслідки. Наші генерали наполягають, що кампанію все ще можна виграти, але якою ціною?"
 INS_revolution_events.37.a: "У нас немає іншого вибору, окрім як підкоритися."
 INS_revolution_events.37.b: "Індонезія наша. Ми не поступимося."

 INS_revolution_events.38.t: "Голландці поступаються"
 INS_revolution_events.38.desc: "Все скінчено. Голландський уряд прийняв американський ультиматум і визнав наш суверенітет. Триста п'ятдесят років колоніального панування завершилися не лише на полі бою, але й за столом переговорів за підтримки найвеличнішої держави світу. Республіка наша, по-справжньому і повністю, нарешті."
 INS_revolution_events.38.a: "Мердека!"

 INS_revolution_events.39.t: "Голландці відмовляються"
 INS_revolution_events.39.desc: "Всупереч усім очікуванням, голландці відхилили американський ультиматум. Їхні генерали, мабуть, вірять, що зможуть виграти цю війну до того, як Вашингтон почне діяти. Вони помиляються. Тепер, коли американці відкрито віддані нашій справі, баланс сил рішуче змінився. Хай приходять. Ми більше не воюємо самі."
 INS_revolution_events.39.a: "Світ стоїть з нами."

 INS_revolution_events.40.t: "Голландці приймають наші умови"
 INS_revolution_events.40.desc: "Гаага прийняла наш ультиматум. Голландські війська в Індонезії складуть зброю, і суверенітет буде передано Індонезійській республіці. Це задовільне завершення неприємного епізоду. Нашим інтересам у регіоні тепер набагато краще служить стабільна, незалежна Індонезія, ніж підтримка колоніального підприємства, яке голландці більше не могли підтримувати."
 INS_revolution_events.40.a: "Розумний результат."

 INS_revolution_events.41.t: "Голландці кидають нам виклик"
 INS_revolution_events.41.desc: "Гаага категорично відхилила наш ультиматум. Голландські війська в Індонезії продовжують свої операції у відкритій непокорі американським вимогам. Це надзвичайна помилка. Нідерланди не можуть вести колоніальну війну в Азії і водночас залежати від американської допомоги в Європі. Вони змусили нас діяти."
 INS_revolution_events.41.a: "Хай буде так."

 INS_revolution_events.42.t: "Останній кидок кісток"
 INS_revolution_events.42.desc: "Звіти від наших розвідувальних служб у Батавії описують підготовку ворога, подібної до якої ми ніколи не бачили від республіканців. Схоже, вони готують операцію з дестабілізації, щоб штурмувати Яву і знищити всю нашу інфраструктуру зв'язку, ефективно гарантуючи свою перемогу. Однак ця операція вкрай ризикована і вимагає переміщення майже всіх їхніх ресурсів на неї. Наші генерали оцінюють, що вони можуть утримувати цю позицію лише близько двох років і не зможуть легко відступити. Якщо ми стримаємо їх достатньо довго, ми зможемо розчавити їхній уряд і революцію, як перестиглий помідор."
 INS_revolution_events.42.a: "Так починається остання битва."

 INS_revolution_events.43.t: "База ополчення в [FROM.GetName] була створена"
 INS_revolution_events.43.desc: "Наші зусилля в [FROM.GetName] були успішними, і наші місцеві лідери ополчення підтвердили, що вони готові діяти, коли настане час."
 INS_revolution_events.43.a: "Ми повинні продовжувати наші зусилля."

 # Chaos Events
 INS_chaos_events.1.t: "Битва в Сурабаї"
 INS_chaos_events.1.desc: "Після проголошення незалежності влада в Сурабаї стала нестабільною. Сьогодні група голландських лоялістів підняла старий колоніальний прапор на будівлі колишнього готелю Yamato. Місцеві юнаки-пемуда штурмували будівлю, зняли прапори і підняли натомість червоно-білий індонезійський прапор. Інцидент переріс у жорстокі, неорганізовані бої."
 INS_chaos_events.1.a: "Так і треба!"
 INS_chaos_events.1.b: "Накажіть припинити вогонь, ми не можемо ризикувати ескалацією."

 INS_chaos_events.2.t: "Соціалістичні партії об'єднуються"
 INS_chaos_events.2.desc: "Дві найбільші соціалістичні партії Індонезії, очолювані Аміром Шаріфуддіном і Сутаном Шаріром, сьогодні оголосили про об'єднання, утворивши об'єднану Соціалістичну партію Індонезії. Це значно підвищує політичний вплив партії, потенційно ставлячи під загрозу нашу адміністрацію."
 INS_chaos_events.2.a: "Дозволити."
 INS_chaos_events.2.b: "Немає часу на політику, оголосіть воєнний стан!"

 INS_chaos_events.3.t: "Невдалий замах на життя Сукарно"
 INS_chaos_events.3.desc: "Сьогодні було здійснено замах на життя Сукарно голландським солдатом, який вистрілив у машину Сукарно. На щастя, Сукарно не було в транспортному засобі, однак його шофер був важко поранений. Хоча ця спроба була невдалою, зрозуміло, що це буде не остання спроба, як з боку голландських солдатів, так і індонезійської опозиції."
 INS_chaos_events.3.a: "Ми повинні відновити порядок!"

 INS_chaos_events.4.t: "Вбивство Сукарно"
 INS_chaos_events.4.desc: "Трагічний день спіткав Індонезію сьогодні. Сукарно зіткнувся з ще однією спробою вбивства, цього разу успішною. Ми не повинні дозволити, щоб з цього вийшла криза наступництва, порядок має бути відновлено швидко, інакше республіка розвалиться."
 INS_chaos_events.4.a: "Віце-президент Хатта візьме владу."
 INS_chaos_events.4.b: "Соціалістична партія візьме владу."
 INS_chaos_events.4.c: "Скасувати республіку, Тан Малака приведе нас до перемоги!"

 # Loyalist Events
 INS_loyalist_events.1.t: "[INS.GetLeader] вимагає переведення Анрі Вінкельмана"
 INS_loyalist_events.1.desc: "[INS.GetLeader] зв'язався з нами щодо поточних конфліктів у всьому світі та небезпечного становища, в якому опинилася [INS.GetNameDef]. [INS.GetLeader] запропонував офіційно перевести Анрі Вінкельмана, колишнього командувача Королівською армією Нідерландської Ост-Індії, назад до [INS.GetNameDef], щоб забезпечити безпеку колонії."
 INS_loyalist_events.1.a: "Ми організуємо його негайне переведення."
 INS_loyalist_events.1.b: "Анрі Вінкельман потрібен на батьківщині."
 INS_loyalist_events.2.t: "[HOL.GetLeader] погоджується перевести Анрі Вінкельмана."
 INS_loyalist_events.2.desc: "[INS.GetLeader] повернувся з [HOL.GetNameDef], де він зустрівся з [HOL.GetLeader]. Зустріч пройшла добре, [HOL.GetLeader] визнав ситуацію і погодився на негайне переведення Вінкельмана. Анрі Вінкельман прямує до [1058.GetName], де чекатиме на наші накази."
 INS_loyalist_events.2.a: "Це буде дуже корисно."
 INS_loyalist_events.3.t: "[HOL.GetLeader] відмовляється перевести Анрі Вінкельмана"
 INS_loyalist_events.3.desc: "[INS.GetLeader] повернувся з [HOL.GetNameDef], де він зустрівся з [HOL.GetLeader]. На жаль, Анрі Вінкельман не буде відправлений до Індії, і нам доведеться захищатися без нього."
 INS_loyalist_events.3.a: "Ми повинні поспішно придумати новий план."

 INS_henri_winkelman_tt: "Переведення Анрі Вінкельмана відхилено"

 # MALAYA CHAIN - Independent Malaya

 INS_loyalist_events.4.t: "[FROM.GetNameDefCap] пропонує об'єднання"
 INS_loyalist_events.4.desc: "Делегація [FROM.GetAdjective] прибула до [ROOT.Capital.GetCapitalVictoryPointName] з пропозицією про об'єднання. Вони вказують на спільну малайську спадщину наших народів і зазначають, що кордони між нашими націями були встановлені європейськими колоніальними адміністраторами, а не народами, які населяють ці землі. Пропозиція передбачає розпуск обох урядів і реформування в єдину державу."
 INS_loyalist_events.4.a: "Ми приймаємо пропозицію."
 INS_loyalist_events.4.b: "Ми повинні відмовитися."

 INS_loyalist_events.5.t: "[FROM.GetNameDefCap] приймає об'єднання"
 INS_loyalist_events.5.desc: "Наші дипломати повернулися з [FROM.Capital.GetCapitalVictoryPointName] з чудовими новинами. Уряд [FROM.GetAdjective] прийняв нашу пропозицію, і їхні офіційні особи вже вживають заходів щодо інтеграції їхніх територій до нашої адміністрації."
 INS_loyalist_events.5.a: "Разом ми сильніші!"

 INS_loyalist_events.6.t: "[FROM.GetNameDefCap] відхиляє об'єднання"
 INS_loyalist_events.6.desc: "Наші дипломати повернулися з [FROM.Capital.GetCapitalVictoryPointName] з порожніми руками. Уряд [FROM.GetAdjective] не побажав розглядати цю пропозицію. Причин було названо мало, і нашу делегацію відправили додому, обмежившись ввічливими формальностями."
 INS_loyalist_events.6.a: "Це їхня втрата."

 # MALAYA CHAIN - Subject Malaya (Overlord receives)

 INS_loyalist_events.7.t: "[FROM.GetNameDefCap] вимагає референдум у [MAL.GetName]"
 INS_loyalist_events.7.desc: "[FROM.GetNameDefCap] офіційно попросили нас дозволити референдум у [MAL.GetName] з питання об'єднання з їхньою державою. Їхній посол був відвертим щодо ймовірного результату, заявивши, що малайський народ по обидва боки кордону вважає себе однією нацією. Дозвіл на голосування майже напевно означав би втрату [MAL.GetName]."
 INS_loyalist_events.7.a: "Нехай вирішує народ."
 INS_loyalist_events.7.b: "Ми цього не дозволимо."

 # MALAYA CHAIN - Subject Malaya (MAL receives after overlord agrees)

 INS_loyalist_events.8.t: "[FROM.GetNameDefCap] схвалює референдум про об'єднання"
 INS_loyalist_events.8.desc: "Наш сюзерен надав [FROM.FROM.GetNameDef] дозвіл провести референдум у нашій країні. Агітатори [FROM.FROM.GetAdjective] прибули у великій кількості, і голосування має розпочатися протягом місяця. Питання, поставлене перед нашим народом, просте. Ми хочемо приєднатися до [FROM.FROM.GetNameDef], чи ми хочемо залишитися такими, якими ми є?"
 INS_loyalist_events.8.a: "Ми приєднаємося до них."
 INS_loyalist_events.8.b: "Ми краще залишимося."

 # MALAYA CHAIN - Overlord informed of MAL's choice

 INS_loyalist_events.9.t: "[FROM.GetNameDefCap] голосує проти об'єднання"
 INS_loyalist_events.9.desc: "Референдум у [FROM.GetName] завершився. Народ [FROM.GetAdjective] проголосував за те, щоб залишитися під нашим управлінням. Агітатори [FROM.FROM.GetAdjective] поїхали."
 INS_loyalist_events.9.a: "Як і очікувалося."

 INS_loyalist_events.10.t: "[FROM.GetNameDefCap] голосує за об'єднання"
 INS_loyalist_events.10.desc: "Референдум у [FROM.GetName] завершився рішучим голосуванням на користь об'єднання з [FROM.FROM.GetNameDef]. Наші адміністратори в регіоні повідомляють, що результат був очікуваним. Ми зобов'язані його визнати."
 INS_loyalist_events.10.a: "Ми дали слово."

 # MALAYA CHAIN - INS receives result

 INS_loyalist_events.11.t: "Малайський референдум успішний"
 INS_loyalist_events.11.desc: "Народ [MAL.GetName] проголосував за приєднання до нашої нації. Офіційні особи [MAL.GetAdjective] співпрацюють з нашою адміністрацією, щоб розпочати передачу повноважень. На карті малайського світу буде на один кордон менше."
 INS_loyalist_events.11.a: "Ласкаво просимо додому."

 INS_loyalist_events.12.t: "Малайське об'єднання відхилено"
 INS_loyalist_events.12.desc: "Наша пропозиція про об'єднання з [MAL.GetName] була відхилена. Уряд [MAL.GetAdjective], або ті, хто стоїть над ним, вирішили відмовитися. Нам доведеться повернутися до цього питання в більш сприятливий час."
 INS_loyalist_events.12.a: "Ми цього не забудемо."

 INS_loyalist_events.13.t: "[FROM.GetNameDefCap] пропонує компроміс щодо Сінгапуру"
 INS_loyalist_events.13.desc: "Уряд [FROM.GetAdjective] звернувся до нас із пропозицією щодо Сінгапуру. Вони вимагають суверенітету над островом, посилаючись на його місце в малайському світі. Натомість вони готові гарантувати наш постійний доступ до порту, його військових об'єктів і всіх прав на видобуток ресурсів, що діють наразі."
 INS_loyalist_events.13.a: "Справедлива домовленість."
 INS_loyalist_events.13.b: "Сінгапур не продається."

 INS_loyalist_events.14.t: "Компроміс щодо Сінгапуру прийнято"
 INS_loyalist_events.14.desc: "Угоду прийнято. Сінгапур буде передано під наш контроль, тоді як колишні контролери збережуть свій комерційний та військовий доступ до порту. Наш прапор тепер майорить над однією з найважливіших гаваней в Азії."
 INS_loyalist_events.14.a: "Протоки наші."

 INS_loyalist_events.15.t: "Компроміс щодо Сінгапуру відхилено"
 INS_loyalist_events.15.desc: "Наша пропозиція була відхилена. Контролери Сінгапуру не бажають розлучатися з островом на будь-яких умовах. Ми запропонували їм все, крім збереження суверенітету, і цього було недостатньо."
 INS_loyalist_events.15.a: "Хай буде так."

 INS_loyalist_events.16.t: "[FROM.GetNameDefCap] вимагає передачі Цейлону"
 INS_loyalist_events.16.desc: "Уряд [FROM.GetAdjective] зробив офіційний запит на передачу Цейлону. Їхні дипломати посилаються на давні торговельні та етнічні зв'язки між островом і малайським світом. Відверто кажучи, претензія є слабкою, але [FROM.GetNameDef] стали настільки могутніми, що такі прохання потрібно розглядати серйозно."
 INS_loyalist_events.16.a: "Дуже добре, нехай забирають."
 INS_loyalist_events.16.b: "Цейлон залишиться під нашим контролем."

 INS_loyalist_events.17.t: "Цейлон передано"
 INS_loyalist_events.17.desc: "Передача Цейлону завершена. Наша адміністрація почала переміщення чиновників на острів, і передача пройшла без інцидентів. Тепер ми утримуємо позиції по обидва боки протоки."
 INS_loyalist_events.17.a: "Відмінно."

 INS_loyalist_events.18.t: "Запит щодо Цейлону відхилено"
 INS_loyalist_events.18.desc: "Наш запит на передачу Цейлону був відхилений. Нинішні контролери не мають наміру розлучатися з островом, і наші дипломати повідомляють, що подальше обговорення цього питання було б марним."
 INS_loyalist_events.18.a: "Можливо, іншим разом."

 INS_loyalist_events.19.t: "[FROM.GetNameDefCap] вимагає референдум у Папуа"
 INS_loyalist_events.19.desc: "[FROM.GetNameDefCap] вимагає, щоб ми дозволили провести референдум у східному Папуа. На боці [FROM.GetAdjective] через джунглі прокладені нові дороги, клініки укомплектовані державними лікарями, а школи навчають місцевими мовами. На нашому боці останній губернатор відвідував Порт-Морсбі двічі за три роки. Послу [FROM.GetAdjective] не потрібно було говорити набагато більше."
 INS_loyalist_events.19.a: "Нехай проводять своє голосування."
 INS_loyalist_events.19.b: "Ми цього не дозволимо."

 INS_loyalist_events.20.t: "Референдум у Папуа схвалено"
 INS_loyalist_events.20.desc: "Австралійці погодилися провести референдум. Кожен округ у східному Папуа дав однаковий результат. Наші інвестиції в західну половину острова говорили голосніше, ніж будь-який передвиборчий плакат."
 INS_loyalist_events.20.a: "Острів нарешті цілий."

 INS_loyalist_events.21.t: "Референдум у Папуа відхилено"
 INS_loyalist_events.21.desc: "Австралійці відмовилися. Їхній губернатор у Порт-Морсбі зробив заяву, назвавши це прохання образою суверенітету Австралії. З самим папуаським народом не консультувалися."
 INS_loyalist_events.21.a: "Ми запам'ятаємо це."

 INS_loyalist_events.22.t: "[FROM.GetNameDefCap] вимагає Східний Тимор"
 INS_loyalist_events.22.desc: "Уряд [FROM.GetAdjective] висунув офіційну вимогу здати Східний Тимор. Їхній посол зазначив, що наш гарнізон там налічує менше двохсот чоловік, і що Лісабон роками майже нічого не виділяв цій території. Потім він запитав, за що саме ми думаємо, що тримаємося."
 INS_loyalist_events.22.a: "Це не варте того, щоб за це битися."
 INS_loyalist_events.22.b: "Тимор наш і таким залишиться."

 INS_loyalist_events.23.t: "Східний Тимор здано"
 INS_loyalist_events.23.desc: "Контролери Східного Тимору почали виводити свій гарнізон і згортати колоніальну адміністрацію. Весь острів незабаром буде під владою [INS.GetAdjective]."
 INS_loyalist_events.23.a: "Так і має бути."

 INS_loyalist_events.24.t: "Вимогу щодо Східного Тимору відхилено"
 INS_loyalist_events.24.desc: "Колоніальний губернатор у Ділі особисто написав, щоб відхилити нашу вимогу, наполягаючи на тому, що Східний Тимор залишається суверенною територією його уряду. Наш генеральний штаб розробив плани на випадок надзвичайних ситуацій, якщо кабінет міністрів побажає розглядати це питання далі."
 INS_loyalist_events.24.a: "Почати приготування."

 INS_loyalist_events.25.t: "[FROM.GetNameDefCap] пропонує об'єднання"
 INS_loyalist_events.25.desc: "Делегація [FROM.GetAdjective] прибула з пропозицією про об'єднання наших двох республік. Вони стверджують, що наші народи поділяють спільне австронезійське коріння, набагато давніше, ніж колоніальні кордони, які нас розділяють, і що єдина держава, що охоплює архіпелаг, стала б головною силою в Південно-Східній Азії. Згода означала б розпуск нашого уряду та інтеграцію в їхній."
 INS_loyalist_events.25.a: "Ми згодні."
 INS_loyalist_events.25.b: "Ми занадто важко боролися за цю республіку."

 INS_loyalist_events.26.t: "[FROM.GetNameDefCap] приймає об'єднання"
 INS_loyalist_events.26.desc: "Уряд [FROM.GetAdjective] прийняв нашу пропозицію. Їхні офіційні особи вже координують з нашими початок процесу інтеграції. Від Ачеха до Лусона, від Борнео до Мінданао, наша нація тепер охоплює всю широту Малайського архіпелагу."
 INS_loyalist_events.26.a: "Починається нова ера."

 INS_loyalist_events.27.t: "[FROM.GetNameDefCap] відхиляє об'єднання"
 INS_loyalist_events.27.desc: "Уряд [FROM.GetAdjective] відмовився. Їхня власна боротьба за незалежність занадто недавня і занадто дорога для них, щоб передати свій суверенітет іншій державі. Пропозиція була відкладена."
 INS_loyalist_events.27.a: "Шкода."

 INS_loyalist_events.28.t: "[FROM.GetNameDefCap] вимагає референдум у [PHI.GetName]"
 INS_loyalist_events.28.desc: "[FROM.GetNameDefCap] офіційно попросили, щоб ми дозволили провести референдум у [PHI.GetName] з питання об'єднання. Їхні дипломати наголошують на спільному австронезійському походженні обох народів і штучному характері колоніальних кордонів, що їх розділяють. Якщо голосування відбудеться, результат, ймовірно, буде на користь [FROM.GetNameDef]."
 INS_loyalist_events.28.a: "Народ повинен мати своє слово."
 INS_loyalist_events.28.b: "Про це не може бути й мови."

 INS_loyalist_events.29.t: "Референдум про об'єднання схвалено"
 INS_loyalist_events.29.desc: "[FROM.FROM.GetNameDefCap] запропонували об'єднання наших двох націй на основі спільної австронезійської спадщини. Наш сюзерен дав їм дозвіл провести референдум з цього питання, і агітатори [FROM.FROM.GetAdjective] вже почали прибувати. Результат визначить, чи наша республіка приєднається до [FROM.FROM.GetNameDef], чи продовжить своє існування в нинішньому статусі."
 INS_loyalist_events.29.a: "Це цікава пропозиція."
 INS_loyalist_events.29.b: "Абсолютно ні."

 INS_loyalist_events.30.t: "[FROM.GetNameDefCap] голосує проти об'єднання"
 INS_loyalist_events.30.desc: "Скриньки для голосування були підраховані, і агітатори [FROM.FROM.GetAdjective] відправлені геть. Народ [FROM.GetAdjective] проголосував за те, щоб залишитися. Незалежність, здається, все ще має значення в [FROM.Capital.GetCapitalVictoryPointName]."
 INS_loyalist_events.30.a: "На цьому все."

 INS_loyalist_events.31.t: "[FROM.GetNameDefCap] голосує за об'єднання"
 INS_loyalist_events.31.desc: "Скриньки для голосування були підраховані. Народ [FROM.GetAdjective] обрав [FROM.FROM.GetNameDef] замість нас, і розрив був немалий. Наші адміністратори вже отримують інструкції розпочати передачу."
 INS_loyalist_events.31.a: "Народ сказав своє слово."

 INS_loyalist_events.32.t: "[PHI.GetNameDefCap] голосує за об'єднання"
 INS_loyalist_events.32.desc: "Референдум [PHI.GetAdjective] завершився на нашу користь. Їхній уряд прийняв результат і розпочав контакти з нашим міністерством закордонних справ для організації передачі повноважень."
 INS_loyalist_events.32.a: "Нарешті разом."

 INS_loyalist_events.33.t: "[PHI.GetNameDefCap] відмовляється від об'єднання"
 INS_loyalist_events.33.desc: "Уряд [PHI.GetAdjective] відхилив нашу пропозицію про об'єднання. Їхній парламент відхилив її без другого читання. Ми запропонували їм місце у найвеличнішій нації Південно-Східної Азії, а вони плюнули на це."
 INS_loyalist_events.33.a: "Невдача, не більше."

 INS_communist_events.6.t: "Агенти [FROM.GetAdjective] ведуть агітацію в [ROOT.GetName]"
 INS_communist_events.6.desc: "Наші розвідувальні служби підтвердили те, що ми давно підозрювали. [FROM.GetNameDefCap] проводить постійну кампанію підривної діяльності в межах наших кордонів, фінансуючи радикальні осередки, розповсюджуючи крамольні брошури та організовуючи страйки серед робітників. Їхні агенти вкорінилися в профспілках і сільських кооперативах, і тепер відкрито закликають до повалення нашого уряду. Ситуація досягла критичної точки, і ми повинні діяти рішуче, перш ніж вона вийде з-під нашого контролю."
 INS_communist_events.6.a: "Цього не можна терпіти!"

 INS_communist_events.7.t: "Комуністична диверсія в [FROM.GetName]"
 INS_communist_events.7.desc: "Тривожні звіти надійшли до нас із [FROM.FROM.GetName]. Агенти, які діють від імені [FROM.GetNameDef], розпалюють революційні настрої серед місцевого населення, використовуючи невдоволення нашою адміністрацією для створення підтримки комуністичного перевороту. Якщо цього не зупинити, [FROM.FROM.GetNameDef] може бути повністю втрачений для радикалів, і гниль цілком може поширитися далі на наші інші володіння."
 INS_communist_events.7.a: "Ми повинні викорінити це, поки воно не поширилося!"

 INS_communist_events.8.t: "Пропаганда [FROM.GetAdjective] циркулює в [ROOT.GetName]"
 INS_communist_events.8.desc: "Брошури та листівки походження [FROM.GetAdjective] з'являються на наших фабриках, ринках та в університетах з дедалі більшою частотою. Вони проповідують євангеліє класової боротьби і обіцяють визволення через революцію, і наша поліція повідомляє, що вони знаходять сприйнятливу аудиторію серед невдоволених. Матеріал грубий, але ефективний, і його поширення не має ознак уповільнення."
 INS_communist_events.8.a: "З'ясуйте, хто розповсюджує цей бруд!"

 ## Call for Revolution - Main Event (sent to target) ##

 INS_communist_events.1.t: "Революція в [ROOT.GetName]"
 INS_communist_events.1.desc: "Ситуація погіршилася безповоротно. Місяці агітації [FROM.GetAdjective] зробили свою справу, і комуністичний рух у [ROOT.GetName] більше не можна стримати звичайними заходами. Загальні страйки паралізували міста, озброєні партизани панують над цілими провінціями, а уряд [FROM.GetAdjective] кинув усю свою вагу на підтримку революціонерів. Наші сили безпеки розпорошені, і їхня лояльність більше не є певною. Ми повинні вирішити зараз, чи боротися за виживання держави, чи прийняти неминуче до того, як проллється більше крові."
 INS_communist_events.1.a: "Зберіть армію. Ми не підемо тихо."
 INS_communist_events.1.b: "Подальший опір лише принесе загибель нашому народу."
 INS_communist_events.1.c: "Можливо, якщо ми надамо їм місце за столом, ми все ще зможемо це контролювати."

 ## Civil War Chosen - sent to Indonesia ##

 INS_communist_events.2.t: "[FROM.GetNameDefCap] обирає боротьбу"
 INS_communist_events.2.desc: "Уряд у [FROM.GetName] відмовився здатися і наказав своїм збройним силам придушити революційний рух силою. Наші товариші там вже займають позиції та захоплюють ключові опорні пункти. Боротьба не буде короткою, але народ [FROM.GetName] зробив свій вибір, і ми подбаємо щоб вони не залишилися самі."
 INS_communist_events.2.a: "Революція крокує вперед."

 ## Surrender - sent to Indonesia ##

 INS_communist_events.3.t: "[FROM.GetNameDefCap] впала"
 INS_communist_events.3.desc: "Старий уряд у [FROM.GetName] капітулював. Зіткнувшись із повним масштабом революційного руху та певним знанням того, що за ним стоїть [ROOT.GetNameDef], вони не бачили іншого шляху вперед, окрім підкорення. Влада була передана місцевій комуністичній партії, і новий уряд вже почав звертатися до нас за керівництвом. Ще одна нація була звільнена від хватки старого порядку."
 INS_communist_events.3.a: "Велика перемога для трудящих усього світу."

 ## Civil War in Subject - sent to overlord ##

 INS_communist_events.4.t: "Громадянська війна спалахує в [FROM.GetName]"
 INS_communist_events.4.desc: "Комуністичні революціонери, озброєні та організовані за підтримки [FROM.FROM.GetNameDef], підняли відкрите повстання в [FROM.GetName]. Колоніальна адміністрація втратила контроль над великими ділянками території, і губернатор повідомляє, що місцевий гарнізон не може відновити порядок без підкріплення."
 INS_communist_events.4.a: "Надішліть війська. [FROM.GetName] наша!"

 ## Subject Surrendered - sent to overlord ##

 INS_communist_events.5.t: "[FROM.GetName] втрачено для комуністів"
 INS_communist_events.5.desc: "Адміністрація в [FROM.GetName] здалася комуністичним повстанцям без бою. Губернатор і його співробітники були заарештовані, наш прапор спущено, а натомість проголошено революційний уряд. Все це організовано [FROM.FROM.GetNameDef] та їхніми агентами, які місяцями працювали над підривом нашого авторитету там. Це не що інше, як крадіжка, і вона не залишиться без відповіді."
 INS_communist_events.5.a: "Це неподобство!"

 # Cooperate with Revolutionaries (sent to target)
 INS_communist_events.9.t: "Офіцери [FROM.GetAdjective] помічені на зустрічі з дисидентами"
 INS_communist_events.9.desc: "Оперативники [FROM.GetAdjective] були помічені в компанії відомих агітаторів і лідерів бойовиків по всій країні. Студентські організатори, які колись роздавали листівки на кутках вулиць, тепер проводять зустрічі за закритими дверима з людьми, що мають дипломатичні документи [FROM.GetAdjective]. Заборонені видання друкуються швидше, ніж поліція встигає їх конфіскувати, а протести, які колись згасали за один день, тепер зупиняють роботу цілих районів на дні. Ці комуністи щодня вчаться організовуватися в більші групи, якщо ми не діятимемо швидко, ми можемо втратити над ними контроль."
 INS_communist_events.9.a: "Викорініть цих іноземних агентів негайно!"

 # Spread Anti-Colonialist Sentiment (sent to subject target)
 INS_communist_events.10.t: "Риторика [FROM.GetAdjective] набирає обертів"
 INS_communist_events.10.desc: "Брошури [FROM.GetAdjective] циркулюють у казармах і на державній службі, і зусилля з конфіскації мало допомогли зупинити цю хвилю. Вони говорять про звільнені нації, про народи, які скинули своїх колоніальних губернаторів і побудували щось своє. Це було б легше придушити, якби ці настрої не здавалися правдивими. Навіть лояльні чиновники почали тихо запитувати, чи служить наша нинішня домовленість нашому народу, чи лише нашим господарям."
 INS_communist_events.10.a: "Ми повинні діяти обережно."

