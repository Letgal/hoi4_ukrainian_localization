 sp_nuclear_scientist_xp_generic_reward: "Нові пізнання"
 sp_nuclear_generic_industry_tech_reward: "Технологічні здобутки"
 sp_nuclear_generic_industry_tech_reward_desc: "Під час роботи над проєктом наші інженери зробили кілька нових винаходів, які з великою ймовірністю можуть бути адаптовані для використання і в інших сферах."
