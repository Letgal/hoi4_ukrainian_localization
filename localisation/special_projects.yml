# Nuclear Reactor
 sp_nuclear_reactor_radioactive_leak_stabilized_reward: "Радіоактивний витік: під контролем"
 sp_nuclear_reactor_radioactive_leak_stabilized_reward_desc: "На жаль, під час роботи з реактором стався серйозний інцидент. Завдяки швидкому реагуванню персоналу пошкодження було локалізовано, і команда змогла отримати цінні дані з інциденту."
 sp_nuclear_reactor_minor_explosion_reward: "Малий вибух, без поранень"
 sp_nuclear_reactor_minor_explosion_reward_desc: "Під час роботи над останньою ітерацією прототипу ядерного реактора стався невеликий інцидент. Стався невеликий вибух, який пошкодив частину лабораторії, але пожежу, що виникла, вдалося легко загасити. Після того, як лабораторію буде відремонтовано, роботи зможуть продовжитися за планом, лише з невеликою затримкою."
 sp_nuclear_reactor_tested_reward: "Перше успішне випробування ядерного реактора"
 sp_nuclear_reactor_tested_reward_desc: "Наш перший ядерний реактор успішно пройшов випробування, довівши можливість контрольованого поділу ядер. Цей прорив обіцяє нову еру виробництва енергії, а може й набагато більше."
 sp_nuclear_reactor_tested_reward_public: "Публічно оспівати це досягнення"
 nuclear_reactor_tested_reward_classify: "Поки що зберегти інформацію засекреченою"
 sp_nuclear_reactor_tested_reward_public_tt: "Інші країни можуть отримати з цього вигоду."
 sp_nuclear_reactor_tested_tech_bonus: "Отримано інформацію про ядерні випробування"
 sp_commercial_nuclear_reactor_concerns_reward: "Занепокоєння ядерною безпекою"
 sp_commercial_nuclear_reactor_concerns_reward_desc: "[Character.GetName] вислови[Character.GetVerbGendEndA_RU] занепокоєння відсутністю фільтрів у градирнях наших нових реакторів. [Character.GetSheHeCap] наполягає на тому, що фільтри необхідно додати, щоби запобігти викиду радіації з реактора в разі аварії. Інженери тим часом стверджують, що це значно затримає реалізацію проєкту."
