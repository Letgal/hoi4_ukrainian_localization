 sp_air_intercontinental_bomber: "Міжконтинентальний бомбардувальник"
 sp_air_intercontinental_bomber_desc: "Величезний літак, навантажений бомбами та пальним, розроблений спеціально для далеких висотних польотів, що дає йому можливість перетинати океани та континенти."
