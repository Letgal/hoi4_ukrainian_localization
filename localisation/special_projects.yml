 sp_nuclear_scientist_xp_generic_reward_desc: "TODO_TA"
 sp_nuclear_minor_progress_generic_reward: "Малий прорив"
 sp_nuclear_minor_progress_generic_reward_desc: "Під час роботи над останнім прототипом наші вчені зробили кілька дійсно проривних відкриттів. Їхні знахідки значно поглибили наші знання та дослідження в цій галузі."
 sp_nuclear_generic_electronics_tech_reward: "Технологічні інновації"
 sp_nuclear_generic_electronics_tech_reward_desc: "Під час останньої ітерації проєкту було отримано значні пізнання. Сподіваємося, ми зможемо застосувати їх на практиці, що дозволить нам прискорити дослідження в суміжних галузях."
 sp_nuclear_generic_reward_option_electronics_tech_bonus_name: "Удосконалені дослідження електроніки" # (&)
 sp_nuclear_war_support_generic_reward: "Підтримка громадськості"
 sp_nuclear_war_support_generic_reward_desc: "Успішне випробування, а також пов'язане з ним жорстко контрольоване висвітлення в ЗМІ призвело до розуміння громадськістю того, що ми наближаємося до розробки якоїсь суперзброї, яка може бути використана для перемоги над усіма ворогами."
 sp_nuclear_major_political_interference_generic_reward: "Значне політичне втручання"
 sp_nuclear_major_political_interference_generic_reward_desc: "Проєкт «[SpecialProject.GetName]» опинився під посиленою увагою та втручанням із боку політичних лідерів, що спричинило затримки та, можливо, змусило змінити керівництво проєкту. [Character.GetName] лютує з цього приводу. Нам потрібно вирішити ці політичні проблеми, щоби продовжити роботу над проєктом."
 sp_nuclear_major_political_interference_generic_reward_option_keep: "[(Character?.GetName:'CAP_SCIENTIST)] залишиться"
 sp_nuclear_major_political_interference_generic_reward_option_fire: "[(Character?.GetName:'CAP_SCIENTIST)] піде"

 sp_nuclear_bomb_theoretical_breakthrough_generic_reward: "Теоретичний прорив"
 sp_nuclear_bomb_theoretical_breakthrough_generic_reward_desc: "[Character.GetName] зумі[Character.GetVerbGendEndA_RU] вирішити складну теоретичну задачу під час роботи з останнім прототипом. Це дозволило оптимізувати конструкцію бомби, що зробить її менш складною у виробництві."

 sp_nuclear_bomb_critical_mass_generic_reward: "Експеримент із критичною масою пішов не за планом"
 sp_nuclear_bomb_critical_mass_generic_reward_desc: "Критична аварія сталася під час експериментів із визначення критичної маси, що призвело до радіаційного опромінення та жертв серед ключового персоналу."

 sp_nuclear_bomb_information_leak_reward: "Витік інформації"
 sp_nuclear_bomb_information_leak_reward_desc: "Один з працівників проєкту «[SpecialProject.GetName]», ймовірно, зливав інформацію іноземним агентам. Чи було це навмисно чи ні, поки що невідомо. Так само важко визначити, якої шкоди це завдало проєкту."
