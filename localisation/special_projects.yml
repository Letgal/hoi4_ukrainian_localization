 sp_air_bouncing_bomb: "Стрибуча бомба"
 sp_air_bouncing_bomb_desc: "Бомба, яка може стрибати та відскакувати від водної поверхні, може стати ідеальним інструментом для прориву захисних споруд гребель, а також може виявитися корисною в інших ситуаціях."
