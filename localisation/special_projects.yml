 sp_naval_cruiser_submarine: "Підводний крейсер"
 sp_naval_cruiser_submarine_desc: "Підводний човен із великою дальністю плавання, призначений для подолання великих відстаней без підтримки, був би ідеальним для нападу на ворожі кораблі."
 sp_naval_cruiser_submarine_free_design: "Підводний крейсер"

 sp_naval_nuclear_submarine: "Ядерний підводний човен"
 USA_sp_naval_nuclear_submarine: "Програма «USS Nautilus»"
 ENG_sp_naval_nuclear_submarine: "Програма «HMS Dreadnought»"
 SOV_sp_naval_nuclear_submarine: "Проєкт «627» К-3"
 sp_naval_nuclear_submarine_desc: "Ми цілком можемо зробити ядерні двигуни достатньо малими, щоб умістити їх на спеціалізованому підводному човні, зробити судно безшумним і забезпечити йому надзвичайну дальність плавання."
 sp_naval_nuclear_submarine_free_design: "Ядерний підводний човен"

 sp_naval_rocket_launching_submarine: "Ракетний підводний човен"
 SOV_sp_naval_rocket_launching_submarine: "Проект 611" # sic! (це рос. назва)
 PRC_sp_naval_rocket_launching_submarine: "Тип 094 «Цзінь»"
 sp_naval_rocket_launching_submarine_desc:0 "Оснастивши наші підводні човни ракетами та системами запуску, ми зможемо вражати стратегічні цілі ворога в будь-якому місці без попередження." # (@!)

 sp_naval_torpedo_cruiser: "Торпедний крейсер"
 sp_naval_torpedo_cruiser_desc:0 "Ми можемо завдати значної шкоди найважливішим і найдорожчим кораблям наших ворогів, використовуючи торпедні крейсери, відповідно до концепції минулого століття — jeune école." # (@!)
 JAP_sp_naval_torpedo_cruiser: "Інтеграція «Довгого списа» з крейсерами"
 sp_naval_torpedo_cruiser_free_design: "Торпедний крейсер"

 sp_naval_fleet_submarine: "Ескадрений підводний човен"
 sp_naval_fleet_submarine_desc:0 "Підводний човен дальнього плавання, здатний виконувати функції супроводу флоту, але без недоліків, притаманних конструкції попередніх крейсерських підводних човнів." # (@!)
 sp_naval_fleet_submarine_free_design: "Ескадрений підводний човен"

 sp_naval_super_heavy_battleship: "Надважкий лінкор"
 sp_naval_super_heavy_battleship_desc:0 "Хоча в останні роки морська гонка озброєнь стала більш різноманітною, важко заперечувати велич лінкорів і потенціал для створення ще більших гігантів." # (@!)
 JAP_sp_naval_super_heavy_battleship: "Лінкор класу «Yamato»"
 USA_sp_naval_super_heavy_battleship: "Лінкор класу «Montana»"
 ENG_sp_naval_super_heavy_battleship: "Лінкор класу «Jellicoe»"
 POL_sp_naval_super_heavy_battleship: "Лінкор класу «Orkan»"
 sp_naval_super_heavy_battleship_tt: "Додати технологію: §YНадважкий корпус§!"
 sp_naval_super_heavy_battleship_free_design: "Надважкий лінкор"

 sp_naval_nuclear_missile_submarine: "Підводний човен із ядерними ракетами"
 RAJ_sp_naval_nuclear_missile_submarine: "Підводний човен класу «Arihant»"
 FRA_sp_naval_nuclear_missile_submarine: "Підводний човен класу «Triomphant»"
 USA_sp_naval_nuclear_missile_submarine: "Підводний човен класу «George Washington»"
 KOR_sp_naval_nuclear_missile_submarine: "Підводний човен «KSS-III»"
 ENG_sp_naval_nuclear_missile_submarine: "Підводний човен класу «Resolution»"
 sp_naval_nuclear_missile_submarine_desc:0 "Якщо ми зможемо спливти на поверхню, випустити ракету з ядерним зарядом, а потім знову зануритися, наш потенціал першого удару стане практично необмеженим." # (@!)

 sp_naval_modern_battleship: "Сучасний лінкор"
 POL_sp_naval_modern_battleship: "Лінкор класу «Huragan»"
 sp_naval_modern_battleship_desc:0 "Інші можуть вважати, що майбутнє морських боїв буде належати авіаносцям, але ми тут, щоб переконати їх у тому, що вони помиляються." # (@!)
 sp_naval_modern_battleship_free_design: "Сучасний лінкор"

 sp_naval_midget_submarine: "Карликовий підводний човен"
 sp_naval_midget_submarine_desc:0 "У наших ВМС існує ніша для легких, дешевих і універсальних підводних човнів, які можна використовувати для будь-яких цілей — від саботажу в портах до нападів на конвої." # (@!)
 sp_naval_midget_submarine_free_design: "Карликовий підводний човен"
 JAP_sp_naval_midget_submarine: "Підводний човен класу «Kō-hyōteki»"

 sp_naval_nuclear_torpedo: "Ядерна торпеда"
 sp_naval_nuclear_torpedo_desc:0 "З появою тактичних боєголовок низької потужності, торпеди великої дальності з такими боєголовками теоретично можуть бути встановлені на будь-якому звичайному підводному човні." # (@!)

 sp_naval_modern_carrier: "Сучасний авіаносець"
 sp_naval_modern_carrier_desc:0 "Завдяки останнім досягненням у галузі суднобудування ми змогли побудувати нове покоління авіаносців, які значно відрізняються за розмірами та можливостями." # (@!)
 sp_naval_modern_carrier_free_design: "Сучасний авіаносець"

 sp_naval_anechoic_tiles: "Звукопоглинаюче покриття" # інак. Безлунне (без луни́)
 sp_naval_anechoic_tiles_desc:0 "Це спеціальне гумове покриття для підводних човнів, яке містить невеликі порожнини між собою, зменшує ризик виявлення ворожими сонарами." # (@!)
 sp_naval_anechoic_tiles_non_mtg_tt: "Відмикає величину поліпшення «Непомітність» для підводних човнів 6 і 7." # (&)

 sp_naval_aip_engine: "Повітрянонезалежний рушій"
 sp_naval_aip_engine_desc:0 "Нова система руху, яка може усунути недолік підводних човнів, що потребують спливання на поверхню для підзарядки акумуляторів та поповнення запасів кисню." # (@!)
 sp_naval_aip_engine_non_mtg_tt: "Відмикає величину поліпшення «Двигун» для підводних човнів 6 і 7." # (&)

 sp_naval_ice_carrier: "Пайкеритовий авіаносець"
 sp_naval_ice_carrier_desc:0 "Щоб забезпечити свою перевагу в повітрі над величезними океанами, нам потрібні авіаносці, які могли б зберігати і запускати не тільки палубні літаки, а й звичайні літаки дальньої дії." # (@)
 sp_naval_ice_carrier_free_design: "Пайкеритовий авіаносець"
 ENG_sp_naval_ice_carrier: "Проєкт «Habakkuk»"
 USA_sp_naval_ice_carrier: "Проєкт «Habakkuk»"
 CAN_sp_naval_ice_carrier: "Проєкт «Habakkuk»"

 sp_naval_underway_replenishment: "Поповнення в морі"
 sp_naval_underway_replenishment_desc:0 "Постачання ВМС, що знаходяться далеко від своїх баз, завжди було обмежуючим фактором. Оскільки наші флоти діють на надзвичайних відстанях, нам потрібно розробити нові методи постачання." # (@!)

 sp_naval_proximity_fuze: "Дистанційний запальник"
 sp_naval_proximity_fuze_desc:0 "Завдяки вдосконаленій і більш надійній радіотехнології ми можемо розробити новий тип детонаторів, які вибухатимуть, просто перебуваючи поблизу цілі, і пошкоджуватимуть її." # (@!)

 sp_naval_support_ships: "Судна підтримки" # але support_ship має «еорабель»
 sp_naval_support_ships_desc:0 "Support Ships will help maintain our superiority at sea, by keeping our fleets afloat and effective even during prolonged deployments." # (!)

 sp_naval_escort_carrier: "Ескортний авіаносець"
 sp_naval_escort_carrier_desc:0 "To safeguard our supply lines, we want to develop smaller, more economical carriers, providing cost-effective air cover and anti-submarine capabilities across oceans." # (!)
 sp_naval_escort_carrier_free_design: "Ескортний авіаносець"

 sp_naval_submarine_carrier: "Підводний авіаносець"
 sp_naval_submarine_carrier_desc:0 "We are looking to develop a new kind of submarine, capable of storing and launching multiple planes, to carry out missions beyond aerial reconaissance." # (!)
 sp_naval_submarine_carrier_free_design: "Підводний авіаносець"
 JAP_sp_naval_submarine_carrier: "$sp_naval_submarine_carrier$ класу «I-400»"

#################################
  ## NAVAL PROTOTYPE REWARDS ###
#################################
 sp_naval_cruiser_submarine_unique_reward_a:0 "Рейдерський протокол" # (@VZ)
 sp_naval_cruiser_submarine_unique_reward_a_desc:0 "Безсилля Лондонських морських договорів зробило будь-які реальні обмеження на палубне озброєння підводних човнів неважливими. Проте залишається питання: чи варто нам віддати перевагу показному озброєнню перед тактичною дальністю?"
 sp_naval_cruiser_submarine_preference_a:0 "Гнучкість операцій"
 sp_naval_cruiser_submarine_preference_b:0 "Озброєння"

 sp_naval_fleet_submarine_unique_reward_a:0 "Конструкторські принципи"
 sp_naval_fleet_submarine_unique_reward_a_desc:0 "Ми маємо знати, на чому зосередити зусилля під час проєктування нового типу далекохідних підводних човнів. Чи мають наші підводні човни бути безшумними й смертоносними мисливцями, чи ми прагнемо зробити їх надійнішими та стійкішими до загроз?"
 sp_naval_fleet_submarine_preference_a:0 "Атакувальний потенціал"
 sp_naval_fleet_submarine_preference_b:0 "Міцніша конструкція"

 sp_naval_nuclear_submarine_unique_reward_a:0 "Питання витрат"
 sp_naval_nuclear_submarine_unique_reward_a_desc:0 "Оскільки ми працюємо над абсолютно новим типом підводних човнів, зростає занепокоєння, що вартість будівництва судна зрештою виявиться завеликою. Як нам діяти далі з проєктом?"
 sp_naval_nuclear_submarine_preference_a:0 "Зекономити"
 sp_naval_nuclear_submarine_preference_b:0 "Поточні плани"
 sp_naval_nuclear_submarine_preference_c:0 "Найвища якість"

 sp_naval_rocket_launching_submarine_unique_reward_a:0 "Питання доставки корисного навантаження"
 sp_naval_rocket_launching_submarine_unique_reward_a_desc:0 "Нам потрібно відповісти на нагальне питання: який спосіб найкраще гарантуватиме, що випущені з підводних човнів ракети дістануться наших ворогів?"
 sp_naval_rocket_launching_submarine_preference_a:0 "Дальність"
 sp_naval_rocket_launching_submarine_preference_b:0 "Надійність"
 sp_naval_rocket_launching_submarine_preference_c:0 "Непомітність"

 sp_naval_nuclear_missile_submarine_unique_reward_a:0 "Уникнення переслідування"
 sp_naval_nuclear_missile_submarine_unique_reward_a_desc:0 "Якщо інформація про наш планований ядерний удар дійде до противників, вони розпочнуть масштабне полювання на наші атомні підводні ракетоносці. Аби сховатися від переслідувачів, ми мусимо..."
 sp_naval_nuclear_missile_submarine_preference_a:0 "Залягти на дно"
 sp_naval_nuclear_missile_submarine_preference_b:0 "Зберігати спокій"
 sp_naval_nuclear_missile_submarine_preference_c:0 "Витримати шторм"

 sp_naval_nuclear_torpedo_unique_reward_a:0 "Новий курс торпеди"
 sp_naval_nuclear_torpedo_unique_reward_a_desc:0 "Оскільки розробка ядерних торпед наближається до фінальної мети проєкту, ми маємо прагнути..."
 sp_naval_nuclear_torpedo_preference_a:0 "Потужні боєголовки"
 sp_naval_nuclear_torpedo_preference_b:0 "Безпечніші сховища"

 sp_naval_midget_submarine_unique_reward_a:0 "Вмістити більше"
 sp_naval_midget_submarine_unique_reward_a_desc:0 "Ми зрозуміли, що потенційно можемо спеціалізувати окремі вузли наших карликових підводних човнів, хоча це й вимагатиме певних компромісів."
 sp_naval_midget_submarine_preference_a:0 "Трохи непомітніші"
 sp_naval_midget_submarine_preference_b:0 "Трохи менш схильні до вибухів"
 sp_naval_midget_submarine_preference_c:0 "Трохи більша дальність"


 sp_naval_aip_engine_unique_reward_a:0 "Окремі покращення"
 sp_naval_aip_engine_unique_reward_a_desc:0 "Наші вчені, які працюють над цією технологією, поділилися результатами з колегами, що вдосконалюють традиційніші двигуни. Не варто завчасно тішити себе надіями, адже отримані покращення навряд чи будуть приголомшливими."
 sp_naval_aip_engine_preference_a:0 "Тихіші двигуни"
 sp_naval_aip_engine_preference_b:0 "Швидші двигуни"
 sp_naval_aip_engine_preference_c:0 "Економічніші двигуни"

 sp_naval_anechoic_tiles_unique_reward_a:0 "Новий досвід: конструкція корпусу підводного човна"
 sp_naval_anechoic_tiles_unique_reward_a_desc:0 "Під час розробки протигідролокаційного покриття ми з'ясували, що отримані знання можна застосувати у будівництві звичайних підводних човнів для посилення скритності або для деякого заощадження коштів зі збереженням поточного рівня помітності."
 sp_naval_anechoic_tiles_preference_a:0 "Агресивне патрулювання"
 sp_naval_anechoic_tiles_preference_b:0 "Зниження акустичної помітності"
 sp_naval_anechoic_tiles_preference_c:0 "Здешевлення корпусу"

 sp_naval_torpedo_cruiser_unique_reward_a:0 "Другий шанс: торпедний крейсер"
 sp_naval_torpedo_cruiser_unique_reward_a_desc:0 "З відродженням старої концепції торпедного крейсера ми маємо ухвалити важливе рішення щодо його ролі у флоті: чи варто зосередитися на їхній сильній стороні — торпедах, чи вирішити їхню головну проблему — боротьбу з есмінцями?"
 sp_naval_torpedo_cruiser_preference_a:0 "Сила: торпеди"
 sp_naval_torpedo_cruiser_preference_b:0 "Слабкість: есмінці"

 sp_naval_super_heavy_battleship_unique_reward_a:0 "Питання пріоритетів: напад"
 sp_naval_super_heavy_battleship_unique_reward_a_desc:0 "Проєктування нового класу лінкорів дає нам змогу зосередити зусилля на вдосконаленні здатності домінувати в морському бою. Що слід обрати пріоритетом?"
 sp_naval_super_heavy_battleship_preference_a_a:0 "Важкі гармати"
 sp_naval_super_heavy_battleship_preference_b_a:0 "Швидкість"
 sp_naval_super_heavy_battleship_preference_c_a:0 "Легкі гармати"
 sp_naval_super_heavy_battleship_unique_reward_b:0 "Питання пріоритетів: захист"
 sp_naval_super_heavy_battleship_unique_reward_b_desc:0 "Вищі військово-морські командири поставили перед нами нездійсненне завдання: зробити цей корабель практично невразливим. І хоча це неможливо, ми принаймні спробуємо наблизитися до цієї мети. Що цього разу стане нашим пріоритетом?"
 sp_naval_super_heavy_battleship_preference_a_b:0 "Посилені броня та корпус"
 sp_naval_super_heavy_battleship_preference_b_b:0 "Зенітна артилерія"
 sp_naval_super_heavy_battleship_preference_c_b:0 "Протиторпедний захист"

 sp_naval_modern_battleship_unique_reward_a:0 "Сучасний лінкор: надія"
 sp_naval_modern_battleship_unique_reward_a_desc:0 "Поки багато хто стверджує, що ера лінкорів минула, ми все ще віримо в них. Цей корабель має шанс стати нашою новою надією. На якому аспекті слід зосередитися, щоб утілити цю мрію в життя?"
 sp_naval_modern_battleship_preference_a_a:0 "Чиста вогнева міць"
 sp_naval_modern_battleship_preference_b_a:0 "Маневреність"
 sp_naval_modern_battleship_preference_c_a:0 "Точність"
 sp_naval_modern_battleship_unique_reward_b:0 "Сучасний лінкор завдає удару у відповідь!"
 sp_naval_modern_battleship_unique_reward_b_desc:0 "Щоб довести нашу правоту та втримати позиції, нам доведеться витримувати удари ворога. Що варто покращити, аби ми могли відповісти тим, хто наважиться стати на нашому шляху?"
 sp_naval_modern_battleship_preference_a_b:0 "Міцність конструкції"
 sp_naval_modern_battleship_preference_b_b:0 "Протиповітряна оборона"
 sp_naval_modern_battleship_preference_c_b:0 "Протиторпедний захист"

 sp_naval_modern_carrier_unique_reward_a:0 "Сучасний авіаносець: призначення"
 sp_naval_modern_carrier_unique_reward_a_desc:0 "З новим поколінням авіаносців ми можемо зосередитися на певних аспектах корабля, щоб краще відповідати нашим потребам. На чому саме слід сконцентрувати зусилля?"
 sp_naval_modern_carrier_preference_a_a:0 "Ситуаційна обізнаність"
 sp_naval_modern_carrier_preference_b_a:0 "Швидкість і всепогодність"
 sp_naval_modern_carrier_preference_c_a:0 "Стримування легких сил"
 sp_naval_modern_carrier_unique_reward_b:0 "Сучасний авіаносець: безпека"
 sp_naval_modern_carrier_unique_reward_b_desc:0 "Авіаносці є беззаперечними володарями морських битв, однак ми маємо забезпечити їм належний захист та безпеку. Що повинно стати нашою головною турботою?"
 sp_naval_modern_carrier_preference_a_b:0 "Ворожа артилерія"
 sp_naval_modern_carrier_preference_b_b:0 "Ворожа авіація"
 sp_naval_modern_carrier_preference_c_b:0 "Ворожі торпеди"

 sp_naval_ice_carrier_unique_reward_a:0 "Зміцнення крижаного авіаносця"
 sp_naval_ice_carrier_unique_reward_a_desc:0 "Вкладаючи величезну кількість часу в будівництво цього гігантського авіаносця, ми маємо бути впевнені, що забезпечуємо йому найкращий захист. Що становить найбільшу загрозу?"
 sp_naval_ice_carrier_preference_a:0 "Сили природи"
 sp_naval_ice_carrier_preference_b:0 "Ворожі сили"

 sp_naval_underway_replenishment_unique_reward_a:0 "Масштаби поповнення запасів"
 sp_naval_underway_replenishment_unique_reward_a_desc:0 "Поки ми працюємо над тим, щоб система поповнення запасів на ходу діяла максимально безперебійно, нам потрібно ухвалити ще одне рішення: чи хочемо ми змінити наші початкові розрахунки?"
 sp_naval_underway_replenishment_preference_a:0 "Більша дальність"
 sp_naval_underway_replenishment_preference_b:0 "Менше залучення конвоїв"
 sp_naval_underway_replenishment_preference_c:0 "Знайти баланс"

 sp_naval_proximity_fuzes_unique_reward_a:0 "Продуктивність чи ефективність"
 sp_naval_proximity_fuzes_unique_reward_a_desc:0 "Неконтактні підривники значно зменшують кількість снарядів, необхідних для ураження ворожої авіації. Готуючись застосувати їх у наших мобільних підрозділах протиповітряної оборони, ми можемо скоригувати обсяг постачання боєприпасів, зберігаючи очікуваний щоденний коефіцієнт влучань."
 sp_naval_proximity_fuzes_preference_a:0 "Скоригувати постачання боєприпасів"
 sp_naval_proximity_fuzes_preference_b:0 "Зберегти поточний обсяг боєприпасів"

 sp_naval_support_ships_unique_reward_a:0 "Auxiliary Ships - Support Focus" # (!)
 sp_naval_support_ships_unique_reward_a_desc:0 "While the value of support ships is not in dispute, we need to decide what their operational focus shall be: focused replenishment of a small number of ships, or generalized topping-up of the whole fleet's stores."
 sp_naval_support_ships_preference_a_a:0 "Needs of the few"
 sp_naval_support_ships_preference_b_a:0 "Find the balance"
 sp_naval_support_ships_preference_c_a:0 "Needs of the many"
 sp_naval_support_ships_unique_reward_b:0 "Auxiliary Ships - Repair Efforts"
 sp_naval_support_ships_unique_reward_b_desc:0 "The key question for our repair ship organization: either a larger number of small repair crews, able to service a great number of ships slowly, or a smaller number of more lavishly equipped crews that can repair fewer ships more comprehensively."
 sp_naval_support_ships_preference_a_b:0 "Wider Coverage"
 sp_naval_support_ships_preference_b_b:0 "Find the balance"
 sp_naval_support_ships_preference_c_b:0 "Concentrated Efforts"

 sp_naval_submarine_carrier_unique_reward_a:0 "Improving Submersible Carriers"
 sp_naval_submarine_carrier_unique_reward_a_desc:0 "Our submarine carriers push the limits of naval engineering, and cannot be equally strong in every area. Shall we prioritize range, hull strength, or stealth?"
 sp_naval_submarine_carrier_preference_a:0 "Extended Range"
 sp_naval_submarine_carrier_preference_b:0 "Reinforced Structure"
 sp_naval_submarine_carrier_preference_c:0 "Reduced Visibility"

 sp_naval_escort_carrier_unique_reward_a:0 "Escort Design Drafts"
 sp_naval_escort_carrier_unique_reward_a_desc:0 "The escort carrier attempts to cram a lot of capability in to a quite small hull. We need to choose between an emphasis on range, durability, or speed."
 sp_naval_escort_carrier_preference_a_a:0 "Operational Range"
 sp_naval_escort_carrier_preference_b_a:0 "Stronger Hull"
 sp_naval_escort_carrier_preference_c_a:0 "Higher Speed"
 sp_naval_escort_carrier_unique_reward_b:0 "Spotting Priorities"
 sp_naval_escort_carrier_unique_reward_b_desc:0 "An escort carrier's air group is necessarily limited in size. Shall they specialize in antisubmarine warfare, or spotting surface targets, or adopt a generalized, multi-role approach?"
 sp_naval_escort_carrier_preference_a_b:0 "Submarines"
 sp_naval_escort_carrier_preference_b_b:0 "No preferences"
 sp_naval_escort_carrier_preference_c_b:0 "Surface Ships"

