### РИСИ ###
 scientist_trait_genius: "Геніальність"
 scientist_trait_genius_desc: "Прозорливий розум, який розсуває межі науки і технологій, впроваджуючи безпрецедентні інновації. Це талант, який з'являється лише раз на покоління."
 scientist_trait_gifted_engineer: "Обдарований інженер"
 scientist_trait_gifted_engineer_desc: "Від природи здібний інженер, вправний у вирішенні складних технічних завдань у найрізноманітніших галузях."
 scientist_trait_brilliant_theorist: "Блискучий теоретик"
 scientist_trait_brilliant_theorist_desc: "Майстер абстрактних концепцій і теорій, здатний зробити революцію у військовій стратегії та наукових дослідженнях."
 scientist_trait_bright: "Кмітливість"
 scientist_trait_bright_desc: "Кмітливий, швидко мислячий науковець, який чудово засвоює нові концепції й ефективно їх застосовує."
 scientist_trait_fast_learner: "Швидко навчається"
 scientist_trait_fast_learner_desc: "Швидко підлаштовується під нові виклики, навчається швидше від однолітків і досягає успіхів у різних наукових галузях."
 scientist_trait_resourceful: "Винахідливість"
 scientist_trait_resourceful_desc: "Завжди знаходить творчі рішення, навіть коли ресурси обмежені або ситуація складна."
 scientist_trait_schrodingers_trait: "Риса Шрьодинґера"
 scientist_trait_schrodingers_trait_tt: "$MODIFIER_SCIENTIST_XP_GAIN_FACTOR$: §G+10%§!\n$MODIFIER_SCIENTIST_XP_GAIN_FACTOR$: §R-10%§!"
 scientist_trait_schrodingers_trait_desc: "Перш ніж спостерігач відкриє коробку, хвильова функція, що описує цю рису, формує суперпозицію станів «добре» і «зле»."

 scientist_trait_aircraft_specialist: "Спеціаліст із літаків"
 scientist_trait_aircraft_specialist_desc: "Спеціаліст із аеродинаміки та проєктування літальних апаратів, здатний розробляти чудові планери, двигуни та конструкції, здатні домінувати в небі."
 scientist_trait_rocketry_specialist: "Спеціаліст із ракет"
 scientist_trait_rocketry_specialist_desc: "Спеціалізується на ракетних технологіях, зосереджуючися на принципах руху у програмах балістичних і керованих ракет."
 scientist_trait_electronics_specialist: "Спеціаліст із електроніки"
 scientist_trait_electronics_specialist_desc: "Спеціалізується на комунікаційних, радіолокаційних та обчислювальних системах, необхідних для сучасної війни."
 scientist_trait_helicopter_expert: "Експерт із вертольотів"
 scientist_trait_helicopter_expert_desc: "Піонер у галузі гвинтокрилих літальних апаратів, спеціалізувався на механіці вертикального польоту, гвинтових системах і ранніх моделях вертольотів."
 scientist_trait_jet_expert: "Експерт із реактивних технологій"
 scientist_trait_jet_expert_desc: "Авторитетний фахівець із реактивного руху, просуває дослідження ранніх реактивних двигунів і їхнє застосування у військових літальних апаратах."
 scientist_trait_bombs_expert: "Експерт із бомб"
 scientist_trait_bombs_expert_desc: "Має досвід розробки вибухових пристроїв і високоточних бомб, які можуть бути використані в нових вдосконалених стратегіях повітряних бомбардувань."
 scientist_trait_guidance_systems_expert: "Експерт із систем наведення"
 scientist_trait_guidance_systems_expert_desc: "Експерт із раннього розвитку технологій наведення, має досвід удосконалення систем управління безпілотними вибуховими пристроями великої дальності."
 scientist_trait_armored_specialist: "Спеціаліст із бронетехніки"
 scientist_trait_armored_specialist_desc: "Досвідчений інженер, що спеціалізується на проєктуванні та вдосконаленні танків та іншої броньованої техніки."
 scientist_trait_artillery_specialist: "Спеціаліст із артилерії"
 scientist_trait_artillery_specialist_desc: "Фахівець із артилерійських систем із досвідом вдосконалення вогневих засобів великої дальності та великокаліберних гармат."
 scientist_trait_submarine_specialist: "Спеціаліст із підводних човнів"
 scientist_trait_submarine_specialist_desc: "Фахівець із підводної війни, зосереджений на розробці нових технологій підводних човнів для поліпшення їхньої ролі у таємних військово-морських операціях."
 scientist_trait_surface_ship_specialist: "Спеціаліст із поверхневих кораблів"
 scientist_trait_surface_ship_specialist_desc: "Спеціалізується на проєктуванні, розробці та розгортанні великих надводних військових кораблів, а також на дослідженні нових технологій для оснащення військових суден."
 scientist_trait_nuclear_specialist: "Спеціаліст із ядерних технологій"
 scientist_trait_nuclear_specialist_desc: "Фізик на передовій атомних досліджень, глибоко занурений у вивчення ядерного поділу та ланцюгових реакцій."
 scientist_trait_nuclear_warfare_expert: "Експерт із ядерної війни"
 scientist_trait_nuclear_warfare_expert_desc: "Експерт із практичного застосування ядерної фізики до розробки зброї, спеціалізується на теорії, що лежить в основі розробки атомної бомби."
 scientist_trait_nuclear_power_expert: "Експерт із ядерної енергетики"
 scientist_trait_nuclear_power_expert_desc: "Провідний фахівець у галузі ядерної фізики, знавець ядерного розщеплення з акцентом на виробництво електроенергії."

### ПОДІЇ ###
 # Ядерні проєкти
 sp_nuclear_project_events.1.t: "Витік інформації"
 sp_nuclear_project_events.1.desc: "Зовсім випадково нашим агентам у державі [FROM.GetNameDef] вдалося роздобути інформацію про проєкт, який, вочевидь, є таємним. Працівник, який брав участь у розробці секретної зброї, атомної бомби, розповів про свою роботу на невеликій вечірці, де також був присутній один з наших агентів."
 sp_nuclear_project_events.1.a: "Це може виявитися корисним."

### СТАРІ, СКАСОВАНІ РЯДКИ (вже перекладені) ###
 sp_land_generic_reward_scientist_xp_1_desc:0 "[Character.GetName] досягає прориву, прискорюючи прогрес і закріплюючи за собою роль першопрохідця у створенні передового озброєння. З кожним відкриттям [Character.GetHerHis] інженерна майстерність зростає, формуючи майбутнє військових технологій." # (@VZ)
 sp_land_generic_reward_option_scientist_xp:0 "Знання — це сила!"
 sp_land_generic_reward_option_scientist_xp_desc:0 "[Character.GetName] досягає прориву, прискорюючи прогрес і закріплюючи за собою роль першопрохідця у створенні передового озброєння."
 sp_land_generic_reward_army_xp_1_desc:0 "[Character.GetName] проводить зустріч із групою військових офіцерів для обговорення потенціалу проєкту «[SpecialProject.GetName]», отримуючи важливі відомості щодо використання нової технології в сухопутній війні. Ця співпраця посилила наші військові можливості, гарантуючи готовність до майбутніх боїв."
 sp_land_generic_reward_option_army_xp_desc:0 "[Character.GetName] проводить зустріч із групою військових офіцерів для обговорення потенціалу проєкту «[SpecialProject.GetName]», отримуючи важливі відомості щодо використання нової технології в сухопутній війні. Ця співпраця посилила наші військові можливості, гарантуючи готовність до майбутніх боїв."
 sp_land_generic_reward_major_progress_1_desc:0 "[Character.GetName] здійснює великий прорив, що значно просуває проєкт уперед, підтверджує [Character.GetHerHis] авторитет і надихає дослідницьку групу. Завдяки цьому прогресу проєкт наближається до мети, увічнюючи ім'я [Character.GetName] як новатора."
 sp_land_generic_reward_option_major_breakthrough_desc:0 "[Character.GetName] здійснює великий прорив, що значно просуває проєкт уперед, підтверджує [Character.GetHerHis] авторитет і надихає дослідницьку групу. Завдяки цьому прогресу проєкт наближається до мети, увічнюючи ім'я [Character.GetName] як новатора."
 sp_land_generic_reward_test_failure_1_desc:0 "Під час випробувань сталася незначна невдача, яка виявила неочікувані вади в прототипі [Character.GetName]. Ця прикрість змушує переглянути підхід і вдосконалити методи. Попри тимчасову затримку, здобутий досвід у довгостроковій перспективі зробить проєкт надійнішим і стійкішим."
 sp_land_generic_reward_option_test_failure_desc:0 "Під час випробувань сталася незначна невдача, яка виявила неочікувані вади в прототипі [Character.GetName]. Ця прикрість змушує переглянути підхід і вдосконалити методи. Попри тимчасову затримку, здобутий досвід у довгостроковій перспективі зробить проєкт надійнішим і стійкішим."
 sp_land_generic_reward_armor_tech_1_desc:0 "Останні розробки в проєкті «[SpecialProject.GetName]» під керівництвом [Character.GetName] уможливили значний прогрес у суміжних галузях. Ці відкриття докорінно змінюють військові спроможності, торуючи шлях до ефективніших і грізніших стратегій сухопутної війни."
 sp_land_generic_reward_option_armor_tech_desc:0 "Останні розробки в проєкті «[SpecialProject.GetName]» під керівництвом [Character.GetName] уможливили значний прогрес у суміжних галузях. Ці відкриття докорінно змінюють військові спроможності, торуючи шлях до ефективніших і грізніших стратегій сухопутної війни."
 sp_land_generic_reward_armor_bonus_1_desc:0 "Очолюючи передові дослідження, [Character.GetName] представляє революційні відкриття в галузі нових сплавів, які змінять танкову броню. Ці знахідки обіцяють значні зрушення в бронетанковій війні, демонструючи ключову роль науковця у формуванні її майбутнього."
 sp_land_generic_reward_option_armor_bonus_desc:0 "Впровадити цей новий сплав у наші виробничі лінії."
 sp_land_generic_reward_engine_bonus_1_desc:0 "Останні доопрацювання експериментального двигуна для прототипу «[SpecialProject.GetName]» призвели до значного покращення загальної продуктивності танкових двигунів. Ретельна праця [Character.GetName] та [Character.GetHerHis] команди розширила межі інженерії, обіцяючи розширені можливості в разі впровадження цих інновацій у наші серійні танкові двигуни."
 sp_land_generic_reward_option_engine_bonus_desc:0 "Розпочати виробництво цих вдосконалених двигунів!"
 sp_land_generic_reward_resource_scarcity_desc:0 "Команда [Character.GetName] стикається з нестачею критично важливих матеріалів для розробки проєкту «[SpecialProject.GetName]», що змушує [Character.GetHerHim] шукати альтернативні джерела постачання та розробляти нові методи виробництва для задоволення потреб."
 sp_land_generic_reward_option_resource_scarcity_desc:0 "Команда [Character.GetName] стикається з нестачею критично важливих матеріалів для розробки проєкту «[SpecialProject.GetName]», що змушує [Character.GetHerHim] шукати альтернативні джерела постачання та розробляти нові методи виробництва для задоволення потреб."
 sp_land_reward_multi_charge_large_caliber_gun_successful_test_firing_desc:0 "Гармата проєкту «[SpecialProject.GetName]» щойно успішно завершила знакові випробувальні стрільби, продемонструвавши вражаючу дальність і точність. Це досягнення підняло бойовий дух дослідницької групи та привернуло увагу вищого керівництва, надавши проєкту нового імпульсу та оптимізму щодо його успіху."
 sp_land_reward_option_multi_charge_large_caliber_gun_successful_test_firing_desc:0 "Гармата проєкту «[SpecialProject.GetName]» щойно успішно завершила знакові випробувальні стрільби, продемонструвавши вражаючу дальність і точність. Це досягнення підняло бойовий дух дослідницької групи та привернуло увагу вищого керівництва, надавши проєкту нового імпульсу та оптимізму щодо його успіху."
 sp_land_reward_multi_charge_large_caliber_gun_test_failure_desc:0 "Під час вирішального випробування катастрофічний вибух сколихнув полігон, знищивши гармату та завдавши значних руйнувань прилеглій інфраструктурі. Команда [Character.GetName] з'ясовує причини вибуху та ліквідує наслідки інциденту, зокрема пильну увагу громадськості та ймовірні затримки в графіку проєкту."
 sp_land_reward_option_multi_charge_large_caliber_gun_test_failure_desc:0 "Під час вирішального випробування катастрофічний вибух сколихнув полігон, знищивши гармату та завдавши значних руйнувань прилеглій інфраструктурі. Команда [Character.GetName] мусила з'ясовувати причини вибуху та ліквідувати наслідки інциденту, зокрема пильну увагу громадськості та ймовірні затримки в графіку проєкту."
 sp_land_reward_multi_charge_large_caliber_gun_breakthrough_in_propulsion_technology_desc:0 "[Character.GetName] робить важливий прорив у технології метальних зарядів, значно підвищуючи швидкість і потужність снарядів проєкту «[SpecialProject.GetName]». Це досягнення відкриває нові можливості для підвищення ефективності зброї на полі бою та прискорює завершення проєкту."
 sp_land_reward_option_multi_charge_large_caliber_gun_breakthrough_in_propulsion_technology_desc:0 "[Character.GetName] робить важливий прорив у технології метальних зарядів, значно підвищуючи швидкість і потужність снарядів проєкту «[SpecialProject.GetName]». Це досягнення відкрило нові можливості для підвищення ефективності зброї на полі бою та прискорило завершення проєкту."
 sp_naval_generic_failure_nuclear_accident:0 "Локалізована ядерна аварія"
