 sp_nuclear_engines: "Ядерні двигуни"
 sp_nuclear_engines_desc: "Двигуни, які можуть працювати вічно, — без потреби в дозаправці. Така є обіцянка атомної енергії. Обіцянка, до виконання якої, за словами наших інженерів, ми дуже близькі."
