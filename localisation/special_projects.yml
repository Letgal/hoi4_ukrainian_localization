 sp_air_mothership_aircraft: "Літак-матка"
 sp_air_mothership_aircraft_desc: "Масивний літак, який несе винищувачі в бій, забезпечуючи глибокі супровідні місії на територію противника — воістину повелитель небесного рою."

 sp_air_jet_engine: "Реактивний двигун"
 JAP_sp_air_jet_engine: "Ishikawajima Ne-20"
 sp_air_jet_engine_desc: "Реактивні двигуни набагато потужніші за гвинтові, що потенційно може призвести до революції в дизайні літаків і започаткувати нову еру в авіабудуванні."

 sp_air_axial_jet_engine: "Осьовий реактивний двигун"
 sp_air_axial_jet_engine_desc: "Перші розроблені реактивні двигуни можуть стискати повітря лише до певної міри. Можливо, можна буде встановити кілька компресорів послідовно, щоб іще більше збільшити тягу."

 sp_air_supersonic_jet: "Надзвуковий реактивний двигун"
 sp_air_supersonic_jet_desc: "Здобутки в технології реактивних двигунів прокладають шлях до літаків, здатних досягати швидкості 1 маха та долати звуковий бар'єр."

 sp_air_helicopter: "Вертоліт"
 sp_air_helicopter_desc: "Розробка вертольота з його унікальною здатністю зависати на місці може забезпечити критично важливу тактичну перевагу у військових операціях."
