 sp_land_reward_stronghold_network_leadership_approach: "Підхід до лідерства"
 sp_land_reward_stronghold_network_leadership_approach_desc: "У міру просування проєкту [Character.GetName], провідний науковець, мусить вирішити, наскільки [Character.GetSheHe] залучиться до повсякденних операцій. [Character.GetSheHeCap] може вибрати нагляд за будівництвом безпосередньо в полі, забезпечуючи точне виконання, або залишитися в офісі, зосередившися на стратегії та плануванні."
 sp_land_reward_option_stronghold_network_leadership_approach_oversee_work_personally: "Наглядати за роботою особисто"
 sp_land_reward_option_stronghold_network_leadership_approach_office_planning: "Офісне планування"
 sp_land_reward_stronghold_network_breakthrough_in_concrete_reinforcement_01: "Прорив в армуванні бетону"
 sp_land_reward_stronghold_network_breakthrough_in_concrete_reinforcement_01_desc: "Один із молодших інженерів відкрив новий метод армування, який можна застосувати до стандартних фортифікацій. Задокументувавши його зараз, наші науковці та інженери можуть отримати перевагу в майбутніх дослідженнях."
 sp_land_reward_option_stronghold_network_breakthrough_in_concrete_reinforcement_01_apply_and_document_discovery: "Застосувати та задокументувати відкриття"
 sp_land_reward_option_stronghold_network_breakthrough_in_concrete_reinforcement_01_use_in_current_project: "Використати в поточному проєкті"
 sp_land_reward_stronghold_network_breakthrough_in_concrete_reinforcement_02: "$sp_land_reward_stronghold_network_breakthrough_in_concrete_reinforcement_01$"
 sp_land_reward_stronghold_network_breakthrough_in_concrete_reinforcement_02_desc: "Новий метод армування, відкритий одним із молодших інженерів, був переданий зовнішній дослідницькій групі на подальшу оцінку. Хоча результати все ще вивчаються, цей метод можна застосувати в поточному проєкті, якщо він буде визнаний придатним."
 sp_land_reward_option_stronghold_network_collapse_01: "Обвал під час риття тунелю"
 sp_land_reward_option_stronghold_network_collapse_01_desc: "Тунель під одним із головних бункерів несподівано обвалився, внаслідок чого під завалами опинилися кілька робітників і провідний науковець, [Character.GetName], який керував роботами. Необхідно вжити екстрених заходів для порятунку персоналу, але інцидент вже призвів до затримки загального прогресу."
 sp_land_reward_option_stronghold_network_collapse_01_prioritize_scientist: "Виділити зусилля на нашого провідного науковця"
 sp_land_reward_option_stronghold_network_collapse_01_prioritize_safety: "Виділити зусилля на безпеку робітників"
 sp_land_reward_option_stronghold_network_collapse_01_continue_without_delay: "Продовжити без затримок"
 sp_land_reward_option_stronghold_network_collapse_02: "$sp_land_reward_option_stronghold_network_collapse_01$"
 sp_land_reward_option_stronghold_network_collapse_02_desc: "Тунель під одним із головних бункерів несподівано обвалився, заваливши кількох робітників і зупинивши будівництво. Необхідно вжити екстрених заходів, щоби вирішити ситуацію та безпечно витягти застряглий персонал, але інцидент уже спричинив затримку в загальному прогресі."

