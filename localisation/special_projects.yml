 sp_land_reward_land_cruiser_ammunition: "Рішення щодо зберігання набоїв"
 sp_land_reward_land_cruiser_ammunition_desc: "Під час випробувань проєкту «[SpecialProject.GetName]» виникли побоювання щодо безпечного зберігання та перевезення великокаліберних набоїв, оскільки стандартні стелажі не могли безпечно витримати вагу вибухонебезпечних боєголовок. Було запропоновано нову систему зберігання набоїв із використанням посилених перегородок і гідравлічних навантажувачів, що дозволяє безпечніше поводитися з набоями та швидше завантажувати їх у бойових умовах."
