 sp_land_reward_option_land_cruiser_chassis_reinforce_bonus_name: "Зміцнене шасі"
 sp_land_reward_option_land_cruiser_chassis_lighter_materials: "Використати легші матеріали"
 sp_land_reward_option_land_cruiser_chassis_lighter_materials_bonus_name: "Легші матеріали для шасі"
 sp_land_reward_land_cruiser_engine: "Потужність двигуна недостатня"
 sp_land_reward_land_cruiser_engine_desc: "Перші випробування проєкту «[SpecialProject.GetName]» показали, що масивна рама прототипу створює навантаження на двигун, що робить техніку повільною та неповороткою. Команда пропонує два варіанти: розробити новий, потужніший двигун або спробувати модифікувати існуючий, щоби збільшити його потужність, але з ризиком виходу з ладу."
 sp_land_reward_option_land_cruiser_engine_leave: "Залишити як є"
 sp_land_reward_option_land_cruiser_engine_modify: "Змінити поточний двигун"
 sp_land_reward_option_land_cruiser_engine_modify_bonus_name: "Поліпшений двигун"
 sp_land_reward_option_land_cruiser_engine_new: "Розробити новий двигун"
 sp_land_reward_option_land_cruiser_engine_new_bonus_name: "Перероблений двигун"
 sp_land_reward_land_cruiser_turret: "Складний баштовий механізм"
 sp_land_reward_land_cruiser_turret_desc: "Величезна конструкція з декількома баштами викликає серйозні проблеми з вирівнюванням і прицілюванням, що затримує інтеграцію зброї. Команда інженерів рекомендує спростити компонування башт для підвищення надійності, але це зменшить заплановану вогневу потужність проєкту «[SpecialProject.GetName]»."
 sp_land_reward_option_land_cruiser_turret_original: "Зберегти первісний дизайн"
 sp_land_reward_option_land_cruiser_turret_simplify: "Спростити дизайн башт"
 sp_land_reward_option_land_cruiser_turret_simplify_bonus_name: "Спрощений дизайн башт"
 sp_land_reward_option_land_cruiser_turret_redesign: "Переробити баштовий механізм"
 sp_land_reward_option_land_cruiser_turret_redesign_bonus_name: "Перероблений баштовий механізм"
 sp_land_reward_land_cruiser_track: "Несправність ходової системи"
 sp_land_reward_land_cruiser_track_desc: "Вага техніки перевантажила ходову систему, що призвело до постійних поломок під час випробувань проєкту «[SpecialProject.GetName]». Варіанти — посилити гусениці, що вимагатиме значної переробки, або зменшити броню транспортного засобу, щоби зменшити навантаження."
 sp_land_reward_option_land_cruiser_track_current: "Продовжити з поточною системою"
 sp_land_reward_option_land_cruiser_track_reduce_armor: "Зменшити броньоване покриття"
 sp_land_reward_option_land_cruiser_track_reduce_armor_bonus_name: "Зменшене броньоване покриття"
 sp_land_reward_option_land_cruiser_track_reinforce_track: "Зміцнити ходову систему"
 sp_land_reward_option_land_cruiser_track_reinforce_track_bonus_name: "Зміцнена ходова система"
 sp_land_reward_land_cruiser_communication: "Проблема системи зв'язку"
 sp_land_reward_land_cruiser_communication_desc: "Величезні розміри техніки проєкту «[SpecialProject.GetName]» вимагають складну систему внутрішнього зв'язку для координації роботи екіпажу. Поточна система виявляється недостатньою: накази затримуються або губляться. Команда пропонує переробити внутрішню схему, щоби поліпшити потік комунікації, або встановити досконалішу, але ще неперевірену систему."
 sp_land_reward_option_land_cruiser_communication_current: "Залишити поточну систему"
 sp_land_reward_option_land_cruiser_communication_new: "Установити нову, досконалішу систему"
 sp_land_reward_option_land_cruiser_communication_new_bonus_name: "Удосконалена система комунікації"
 sp_land_reward_option_land_cruiser_communication_redesign: "Перероблена внутрішня схема"
 sp_land_reward_option_land_cruiser_communication_redesign_bonus_name: "Перероблена система комунікації"
 sp_land_reward_land_cruiser_assembly: "Точна збірка"
 sp_land_reward_land_cruiser_assembly_desc: "На етапі складання інженери проєкту «[SpecialProject.GetName]» успішно вдосконалили техніку точного вирівнювання для встановлення масивних компонентів техніки, як-от кільце башти та обшивка корпусу, що значно зменшило ризик механічних руйнувань під дією напруги. Ми можемо інтегрувати цю інноваційну технологію на всіх етапах проєкту, щоби збільшити надійність конструкції загалом. Як нам її застосувати?"
 sp_land_reward_option_land_cruiser_assembly_all: "На всіх етапах збірки"
