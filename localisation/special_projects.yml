 sp_nuclear_design_choice_reward: "Дизайн реактора"
 sp_nuclear_design_choice_reward_desc: "Намагаючися спроєктувати реактор, ми мусимо вибрати, який матеріал використовувати в якості сповільнювача. Від цього буде залежати конструкція всього реактора. Ми можемо використати важку воду або графіт, кожен із яких має свої переваги та недоліки..."
 sp_nuclear_design_choice_reward_graphite: "Очищений графіт — ліпший сповільнювач"
 sp_nuclear_design_choice_reward_heavy_water: "Важка вода буде дешевша"
 sp_nuclear_major_breakthrough_reward: "Великий прорив у ядерних реакціях"
 sp_nuclear_major_breakthrough_reward_desc: "Контрольований експеримент із деякими з наших обмежених ядерних матеріалів продемонстрував здійсненність нашого задуму. Це дало поштовх до подальшої роботи над проєктом із новим ентузіазмом."
 sp_nuclear_isotope_separation_choice_reward: "Засоби розділення ізотопів"
 sp_nuclear_isotope_separation_choice_reward_desc: "Щоби забезпечити наші реактори ядерним паливом, нам потрібно визначитися з процесом відокремлення корисних ізотопів урану від решти. Існує низка пропозицій щодо засобів розділення, але двома провідними є газовий і відцентровий."
 sp_nuclear_isotope_separation_choice_reward_gaseous: "Газовий має доведену техніку." # (&)
 sp_nuclear_isotope_separation_choice_reward_centrifugal: "Центрифуги будуть ефективніші в довгостроковій перспективі."

