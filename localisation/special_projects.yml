 sp_land_reward_land_cruiser_suspension_desc: "Команда проєкту «[SpecialProject.GetName]» вдосконалила передову гідропневматичну підвіску, яка врівноважує величезну вагу техніки, забезпечуючи стабільність і зменшуючи навантаження на ходову систему навіть при пересуванні пересіченою місцевістю. [Character.GetName] вважає, що ця підвіска може бути надійно впроваджена для кращої продуктивності в польових умовах."
