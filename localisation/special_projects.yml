 # Nuclear bombs
 sp_nuclear_bomb_test_prototype_reward: "Прототип бомби"
 sp_nuclear_bomb_test_prototype_reward_desc: "[Character.GetName] і [Character.GetHerHis] команда створили прототип бомби. Проведення й оцінка успішного випробування значно поліпшило б наш прогрес. З іншого боку, тепер у нас є ядерна бомба..."
 sp_nuclear_bomb_test_prototype_reward_test_bomb: "Протестувати її в регульованому середовищі"
 sp_nuclear_bomb_test_prototype_reward_keep_bomb: "Ми можемо використати це проти ворогів"
 sp_nuclear_bomb_espionage_threats_reward: "Загрози шпигунства"
 sp_nuclear_bomb_espionage_threats_reward_desc: "Співробітники служби безпеки стверджують, що необхідно посилити безпеку на місці проведення проєкту «[SpecialProject.GetName]» та всіх пов'язаних із ним заходів. Однак дослідники, яких очолює [Character.GetName], стверджують, що свобода пересування та спілкування є життєво важливою для прогресу."
 sp_nuclear_bomb_espionage_threats_reward_no: "Не посилювати безпеку"
 sp_nuclear_bomb_espionage_threats_reward_increase_security: "Посилити безпеку"
 sp_nuclear_bomb_espionage_threats_reward_increase_security_tt: "Посилена безпека знижує ризик крадіжки відомостей."
 sp_nuclear_bomb_breakthrough_plutonium_reward: "Прорив у виробництві плутонію"
 sp_nuclear_bomb_breakthrough_plutonium_reward_desc: "Наші вчені зробили значний прорив у технології виробництва плутонію, підвищивши ефективність виробництва бомб. Ми сподіваємося, що це зможе прискорити терміни розробки."
 sp_nuclear_bomb_accident_generic_reward: "Випадкова пожежа"
 sp_nuclear_bomb_accident_generic_reward_desc: "На одному зі складів підприємства спалахнула пожежа. Початкове розслідування вказує на те, що це був нещасний випадок. Але чи так це насправді?"
 sp_nuclear_bomb_design_choice_reward: "Простий або складний дизайн бомб"
 sp_nuclear_bomb_design_choice_reward_desc: "Існують два проєкти атомної зброї, над якими працюють наші вчені, і розгорнулися дебати щодо того, як їх утілити в життя. Одна конструкція, відома як гарматний тип, набагато простіша у створенні, але й менш ефективна у використанні ядерного матеріалу. Інший — вибуховий, набагато складніший, але теоретично ефективніший у використанні ядерного матеріалу."
 sp_nuclear_bomb_design_choice_reward_gun_type: "Гармата — безпечніший вибір."
 sp_nuclear_bomb_design_choice_reward_implosion: "Вибух — це найкраща конструкція."

# Thermonuclear Bombs
 sp_thermonuclear_bomb_test_reward: "Пропозиція тесту"
 sp_thermonuclear_bomb_test_reward_desc: "З ціллю підтвердження теорії термоядерної бомби наші вчені попросили надати їм можливість здійснити тестовий вибух. Це вимагатиме виділення існуючої атомної бомби для ініціювання ланцюгової реакції, але значно прискорить прогрес проєкту."
