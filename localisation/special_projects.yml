 sp_land_reward_land_cruiser_overheating: "Перегрів під час випробувань"
 sp_land_reward_land_cruiser_chassis: "Перевантаження шасі"
 sp_land_reward_land_cruiser_chassis_desc: "Під час стрес-тестування проєкту «[SpecialProject.GetName]» було виявлено, що його шасі не здатне витримати величезну вагу, викликаючи структурні деформації. Команда проєктувальників розділилася в думках, чи варто додавати додаткове посилення, яке ще більше збільшить вагу автомобіля, або ж використовувати легші матеріали, що цілком може поставити під загрозу міцність."
 sp_land_reward_option_land_cruiser_chassis_redesign: "Повністю переробити шасі"
