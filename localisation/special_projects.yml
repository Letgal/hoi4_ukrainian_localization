 sp_rockets_flying_bomb_technological_innovation_in_guidance_systems_reward:0 "Технологічні інновації в системах наведення" # (@!)
 sp_rockets_flying_bomb_technological_innovation_in_guidance_systems_reward_desc:0 "Під час останнього етапу створення прототипу було значно покращено точність та стійкість системи наведення до перешкод, що дозволило нам посилити нашу технологічну перевагу." # (@!)
 #sp_rockets_flying_bomb_technological_innovation_in_guidance_systems_reward_option: "Ми наближаємося до досягнення нашої цілі"

 sp_rockets_flying_bomb_test_flight_failures_reward:0 "Невдалі випробувальні польоти" # (@!)
 sp_rockets_flying_bomb_test_flight_failures_reward_desc:0 "Ранні випробувальні польоти закінчилися невдачами через несправності системи наведення та конструктивні недоліки. Наші вчені багато чому навчилися з цього, але нам потрібно зробити крок назад і переосмислити ситуацію." # (@!)
 #sp_rockets_flying_bomb_test_flight_failures_reward_option: "Кажуть, найбільшому навчаєшся з власних невдач"


 # Земля–повітря
 sp_rockets_ground_control_improvements_reward:0 "Покращення наземного управління" # (@!)
 sp_rockets_ground_control_improvements_reward_desc:0 "Науковцеві [Character.GetName] вдалося вирішити кілька невирішених питань, пов'язаних із можливістю відстежувати та контролювати ракету з землі. Це є значним кроком у напрямку можливості вражати ворожі літаки, що летять на великій висоті." # (@!)

 sp_rockets_vertical_launch_reward:0 "Вертикальна система запуску" # (@!)
 sp_rockets_vertical_launch_reward_desc:0 "Після кількох невдалих спроб науковцеві [Character.GetName] нарешті вдалося вирішити проблеми, пов'язані з вертикальним запуском цих ракет. Нова система повинна дозволити ракетам без проблем злітати і без затримок досягати великих висот." # (@!)

 sp_rockets_high_speed_flight_control_reward:0 "Високошвидкісне управління польотом" # (@!)
 sp_rockets_high_speed_flight_control_reward_desc:0 "Нам нарешті вдалося створити робочу систему управління, яка може функціонувати на високих швидкостях і реагувати на зміну динаміки польоту. Ці знання, безсумнівно, можуть бути корисними і в інших сферах." # (@!)
 sp_rockets_high_speed_flight_control_bonus:0 "Системи управління польотом на високій швидкості" # (@!)

 sp_rockets_warhead_detonation_mechanisms_reward:0 "Механізми детонації боєголовок" # (@!)
 sp_rockets_warhead_detonation_mechanisms_reward_desc:0 "Важливою частиною всього процесу розробки є забезпечення вибуху зброї в потрібний момент. Схоже, що науковцеві [Character.GetName] вдалося знайти рішення, яке дозволяє підірвати її в найбільш сприятливий момент." # (@!)
 sp_surface_air_missile_warhead_detonation_bonus:0 "Ракета «земля-повітря»: вдосконалена детонація боєголовки" # (@!)
 #Ballistic missile

 sp_rocket_wind_tunnel_choice_reward:0 "Інженери просять про аеродинамічну трубу" # (@!)
 sp_rocket_wind_tunnel_choice_reward_desc:0 "Інженери, які працюють над проектом балістичних ракет, раніше запропонували побудувати надзвукову аеродинамічну трубу для випробування масштабних моделей своїх конструкцій. Це значно прискорило б процес ітерації та дозволило б заощадити ресурси в довгостроковій перспективі." # (@!)
 sp_rocket_wind_tunnel_choice_reward_reject: "Ресурси потрібні деінде."
 sp_rocket_wind_tunnel_choice_reward_agree: "Виділити ресурси."

 sp_rocket_glass_wool_choice_reward:0 "Утворення льоду при вході в атмосферу" # (@!)
 sp_rocket_glass_wool_choice_reward_desc:0 "Під час фази повернення ракети в атмосферу навколо паливних баків утворюється лід, який заважає роботі внутрішніх систем ракети. Незважаючи на цю перешкоду, наші інженери запропонували додати скловату навколо баків, щоб запобігти подібним ситуаціям у майбутньому." # (@!)
 sp_rocket_glass_wool_choice_reward_accept: "Прикро, але необхідно."

 sp_rocket_guidance_system_choice_reward:0 "Система наведення" # (@!)
 sp_rocket_guidance_system_choice_reward_desc:0 "Наші інженери обговорюють систему наведення ракети. Деякі хочуть залишитися при перевіреному механічному комп'ютері, а інші бажають використовувати нові радіотехнології для управління та моніторингу ракети після запуску." # (@!)
 sp_rocket_guidance_system_choice_reward_mechanical: "Механіка — надійна."
 sp_rocket_guidance_system_choice_reward_radio: "Радіо — це майбутнє!"

 sp_rocket_turbo_pump_froth_reward:0 "Проблема з піноутворенням турбонасоса" # (@!)
 sp_rocket_turbo_pump_froth_reward_desc:0 "Під час випробувань на великій висоті було виявлено проблему, пов'язану з турбонасосом. Схоже, що мастило всередині насосів починає пінитися в умовах інтенсивного навантаження, що впливає на загальну продуктивність і надійність поточної конструкції." # (@!)
 sp_rocket_turbo_pump_froth_reward_accept: "Нам треба це вирішити!" # (&+)

 sp_rocket_relay_failure_reward:0 "Відмова реле" # (@!)
 sp_rocket_relay_failure_reward_desc:0 "Під час підготовки до випробувального запуску було виявлено несправне реле, яке використовується у внутрішніх системах управління ракетою. Інженери вважають, що перед продовженням робіт реле слід замінити, але зростають побоювання щодо політичних наслідків затримки." # (@!)
 sp_rocket_relay_failure_reward_accept: "Ці реле треба полагодити."
 sp_rocket_relay_failure_reward_reject: "Ми не можемо затримувати далі."

 sp_rocket_outercoating_reward:0 "Ракетна іржа" # (@!)
 sp_rocket_outercoating_reward_desc:0 "Висловлюються побоювання щодо зовнішнього корпусу ракети. При тривалому зберіганні матеріали часто піддаються корозії та іржавіють. Якщо не буде знайдено рішення, це може призвести до виходу ракети з ладу." # (@!)
 sp_rocket_outercoating_reward_accept:0 "Можливо, можна застосувати мастило?" # (@!)

 sp_rocket_launch_site_choice_reward:0 "Проблеми з місцем запуску" # (@!)
 sp_rocket_launch_site_choice_reward_desc:0 "Сам розмір нової ракети створює обмеження на запланованому місці запуску. Тому керівники проекту просять виділити кошти на будівництво нового спеціалізованого майданчика в іншому місці." # (@!)
 sp_rocket_launch_site_choice_reward_reject: "Знайти спосіб змусити нинішнє місце запрацювати." # (&+)
 sp_rocket_launch_site_choice_reward_accept: "Ми вкладемося в новий комплекс."

 SP_ROCKET_AND_SUBMARINE_SITE_REMINDER_PROJECT: "Аби ефективно використовувати проєкт $PROJECT|Y$, нам потрібно збудувати ракетний майданчик або мати підводні човни, здатні наносити ракетні удари."
 SP_ROCKET_SITE_REMINDER_PROJECT: "Аби ефективно використовувати проєкт $PROJECT|Y$, нам потрібно збудувати ракетний майданчик."

